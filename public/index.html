 isn't mentioned.", "Wildflowers come later.", "Pesticides are still one cause.", ""]}, "id": "r0123", "checked": true, "by": "seed"}, {"section": "reading", "topic": "r-function", "passage": "For forty years, Ada Bell kept the lighthouse on Gull Point. Every evening she climbed the ninety steps to light the lamp, and every morning she wrote the weather in a small brown book. When the lighthouse was made automatic in 1962, a machine took over the lamp. Ada moved to town, but she kept writing the weather each morning. Her notebooks, now in the county museum, are the longest weather record on that stretch of coast.", "stem": "The last sentence mainly serves to:", "choices": ["introduce a new character.", "show the lasting value of Ada's habit.", "describe the museum's building.", "explain how lighthouses became automatic."], "answer": 1, "rule": "Function: ask why the detail is there", "explanation": {"right": "It shows that her daily notes became the longest weather record on that coast.", "wrong": ["No new character appears.", "", "The building isn't described.", "That's earlier."]}, "id": "r0124", "checked": true, "by": "seed"}, {"section": "reading", "topic": "r-function", "passage": "Most volcanoes form where Earth's plates meet. Hawaii is different. It sits in the middle of the Pacific Plate, above a hot spot where melted rock rises from deep inside the Earth. As the plate slowly moves northwest, the hot spot stays in place. Over millions of years, it has built a chain of islands. The oldest islands, far to the northwest, have worn down, while the youngest, the Big Island, still has active volcanoes.", "stem": "The sentence \"Hawaii is different\" mainly serves to:", "choices": ["end the passage.", "contrast Hawaii with most volcanoes.", "say Hawaii has no volcanoes.", "describe Hawaiian culture."], "answer": 1, "rule": "Function: ask why the detail is there", "explanation": {"right": "It sets Hawaii apart from volcanoes that form where plates meet.", "wrong": ["It's near the start.", "", "Hawaii does have volcanoes.", "Culture isn't discussed."]}, "id": "r0125", "checked": true, "by": "seed"}, {"section": "reading", "topic": "r-function", "passage": "Many schools have cut recess to make more time for classes. But some researchers argue this is a mistake. In one study, children who had a daily recess were better behaved in class and paid more attention afterward. The researchers believe short breaks help the brain reset. Critics point out that the study was small and that the schools differed in other ways, so the question deserves more research.", "stem": "The final sentence mainly serves to:", "choices": ["describe the schools' buildings.", "give the study's size.", "add a caution about the study's findings.", "prove recess works."], "answer": 2, "rule": "Function: ask why the detail is there", "explanation": {"right": "It points out limits and calls for more research.", "wrong": ["Buildings aren't described.", "It says the study was small but gives no number.", "", "It does the opposite."]}, "id": "r0126", "checked": true, "by": "seed"}, {"section": "reading", "topic": "r-paired", "passage": "Passage A: Phones in class distract students. Even a phone sitting face down on a desk can pull attention away from a lesson. Schools that ban phones during the day report fewer disruptions and better test results.\n\nPassage B: Phones can be useful tools in class. Students can look up facts, check their work, and use apps that help them practice. Instead of banning phones, schools should teach students when and how to use them well.", "stem": "The authors of the two passages mainly disagree about whether:", "choices": ["phones should be allowed in class.", "teachers use phones.", "phones exist.", "students like phones."], "answer": 0, "rule": "Paired passages: know each author's position first", "explanation": {"right": "Passage A supports banning phones. Passage B supports teaching students to use them well.", "wrong": ["", "Neither discusses teachers' phones.", "Both talk about phones.", "Neither discusses whether students like them."]}, "id": "r0127", "checked": true, "by": "seed"}, {"section": "reading", "topic": "r-paired", "passage": "Passage A: Phones in class distract students. Even a phone sitting face down on a desk can pull attention away from a lesson. Schools that ban phones during the day report fewer disruptions and better test results.\n\nPassage B: Phones can be useful tools in class. Students can look up facts, check their work, and use apps that help them practice. Instead of banning phones, schools should teach students when and how to use them well.", "stem": "Both authors would most likely agree that phones:", "choices": ["are only used for games.", "affect how students learn in class.", "should be given to every student.", "have no place in school."], "answer": 1, "rule": "\"Both agree\" needs support in both passages", "explanation": {"right": "Passage A says phones hurt learning, and Passage B says they can help. Both say phones affect learning.", "wrong": ["Passage B lists learning uses.", "", "Neither says this.", "Passage B disagrees."]}, "id": "r0128", "checked": true, "by": "seed"}, {"section": "reading", "topic": "r-paired", "passage": "Passage A: Cities should add more bike lanes. Bike lanes make cycling safer, and more people ride when they feel safe. More riders mean fewer cars, less traffic, and cleaner air.\n\nPassage B: Bike lanes can take space from cars and parking, which hurts some small shops. Before adding lanes, cities should study traffic and talk to business owners so that the lanes help the most people.", "stem": "Compared with Passage A, Passage B is more concerned with:", "choices": ["how many people ride.", "cyclist safety.", "air quality.", "effects on businesses and parking."], "answer": 3, "rule": "Paired passages: know each author's position first", "explanation": {"right": "Passage B raises the loss of parking and the effect on small shops.", "wrong": ["Ridership is Passage A's point.", "Safety is Passage A's point.", "Air is Passage A's point.", ""]}, "id": "r0129", "checked": true, "by": "seed"}, {"section": "reading", "topic": "r-paired", "passage": "Passage A: Cities should add more bike lanes. Bike lanes make cycling safer, and more people ride when they feel safe. More riders mean fewer cars, less traffic, and cleaner air.\n\nPassage B: Bike lanes can take space from cars and parking, which hurts some small shops. Before adding lanes, cities should study traffic and talk to business owners so that the lanes help the most people.", "stem": "The author of Passage B would most likely respond to Passage A by saying:", "choices": ["cars should be banned.", "bike lanes are never useful.", "bike lanes may help, but cities should plan carefully first.", "cycling is unsafe."], "answer": 2, "rule": "Paired passages: use each author's own claim", "explanation": {"right": "Passage B doesn't reject lanes. It asks cities to study and talk to businesses first.", "wrong": ["Passage B wants to protect parking.", "\"Never\" is too extreme.", "", "Passage B doesn't say this."]}, "id": "r0130", "checked": true, "by": "seed"}, {"section": "reading", "topic": "r-traps", "passage": "Honeybee colonies have been shrinking in many parts of the world. Scientists point to several causes working together: pesticides, parasites called varroa mites, poor nutrition, and changing weather. No single cause explains every loss, which makes the problem hard to fix. Some farmers now plant strips of wildflowers between crops. Early studies suggest that bees near these strips are healthier, though researchers say more years of data are needed.", "stem": "Which statement goes beyond what the passage says?", "choices": ["Some farmers plant wildflowers.", "Mites are one cause of colony loss.", "Wildflower strips will save all honeybees.", "Weather may play a role."], "answer": 2, "rule": "Wrong answer pattern: too extreme", "explanation": {"right": "The passage says early studies look good. \"Save all honeybees\" goes far beyond that.", "wrong": ["The passage says this.", "The passage says this.", "", "The passage says this."]}, "id": "r0131", "checked": true, "by": "seed"}, {"section": "reading", "topic": "r-traps", "passage": "Most volcanoes form where Earth's plates meet. Hawaii is different. It sits in the middle of the Pacific Plate, above a hot spot where melted rock rises from deep inside the Earth. As the plate slowly moves northwest, the hot spot stays in place. Over millions of years, it has built a chain of islands. The oldest islands, far to the northwest, have worn down, while the youngest, the Big Island, still has active volcanoes.", "stem": "Which statement is the opposite of what the passage says?", "choices": ["The Big Island has active volcanoes.", "The oldest islands are in the southeast.", "The plate moves over the hot spot.", "The hot spot stays in place."], "answer": 1, "rule": "Wrong answer pattern: opposite", "explanation": {"right": "The passage says the oldest islands are far to the northwest.", "wrong": ["The passage says this.", "", "The passage says this.", "The passage says this."]}, "id": "r0132", "checked": true, "by": "seed"}, {"section": "reading", "topic": "r-traps", "passage": "When critics first saw Georgia O'Keeffe's huge paintings of single flowers, many said they were too simple. O'Keeffe disagreed. She said that most people rush past flowers without really looking, so she painted them large enough that viewers would have to stop. Today her flower paintings are among the most famous American artworks of the twentieth century.", "stem": "A student says the passage shows that O'Keeffe only painted flowers. This is:", "choices": ["not in the passage.", "stated in the last sentence.", "the main idea.", "supported by the passage."], "answer": 0, "rule": "Wrong answer pattern: not in the passage", "explanation": {"right": "The passage talks about her flower paintings but never says she painted nothing else.", "wrong": ["", "The last sentence says her flowers are famous.", "The main idea is about her flower paintings and their reception.", "The passage doesn't say this."]}, "id": "r0133", "checked": true, "by": "seed"}, {"section": "reading", "topic": "r-traps", "passage": "For forty years, Ada Bell kept the lighthouse on Gull Point. Every evening she climbed the ninety steps to light the lamp, and every morning she wrote the weather in a small brown book. When the lighthouse was made automatic in 1962, a machine took over the lamp. Ada moved to town, but she kept writing the weather each morning. Her notebooks, now in the county museum, are the longest weather record on that stretch of coast.", "stem": "Which statement is a distortion of the passage?", "choices": ["Her notebooks are in a museum.", "Ada stopped recording the weather when she moved to town.", "Ada kept the lighthouse for forty years.", "A machine took over the lamp."], "answer": 1, "rule": "Wrong answer pattern: distortion", "explanation": {"right": "The passage says she kept writing the weather after she moved. This twists that detail.", "wrong": ["The passage says this.", "", "The passage says this.", "The passage says this."]}, "id": "r0134", "checked": true, "by": "seed"}, {"section": "science", "topic": "s-graphs", "passage": "A student grew bean plants under different amounts of light per day. All plants got the same soil, pot size, and water. Heights were measured after 4 weeks.", "table": {"headers": ["Light (hours/day)", "Height after 4 weeks (cm)"], "rows": [["4", "6.2"], ["8", "10.5"], ["12", "14.1"], ["16", "14.8"]]}, "stem": "According to the table, what was the height of the plants that got 8 hours of light per day?", "choices": ["6.2 cm", "10.5 cm", "14.1 cm", "14.8 cm"], "answer": 1, "rule": "Read a value: find the row, then read across", "explanation": {"right": "In the row for 8 hours, the height is 10.5 cm.", "wrong": ["6.2 cm is for 4 hours.", "", "14.1 cm is for 12 hours.", "14.8 cm is for 16 hours."]}, "id": "s0001", "checked": true, "by": "seed"}, {"section": "science", "topic": "s-graphs", "passage": "A student dropped identical tablets into 200 mL of water at different temperatures and timed how long each took to dissolve completely.", "table": {"headers": ["Water temperature (°C)", "Time to dissolve (s)"], "rows": [["10", "120"], ["20", "80"], ["30", "55"], ["40", "38"]]}, "stem": "At 30°C, how long did a tablet take to dissolve?", "choices": ["38 s", "55 s", "80 s", "120 s"], "answer": 1, "rule": "Read a value: find the row, then read across", "explanation": {"right": "The 30°C row shows 55 seconds.", "wrong": ["38 s is at 40°C.", "", "80 s is at 20°C.", "120 s is at 10°C."]}, "id": "s0002", "checked": true, "by": "seed"}, {"section": "science", "topic": "s-graphs", "passage": "Students timed pendulums of different lengths. The same 50 g mass hung from each string. The period is the time for one full swing back and forth.", "table": {"headers": ["String length (cm)", "Period (s)"], "rows": [["25", "1.0"], ["50", "1.4"], ["100", "2.0"], ["200", "2.8"]]}, "stem": "What was the period of the 100 cm pendulum?", "choices": ["1.0 s", "1.4 s", "2.0 s", "2.8 s"], "answer": 2, "rule": "Read a value: find the row, then read across", "explanation": {"right": "The 100 cm row shows a period of 2.0 seconds.", "wrong": ["1.0 s is for 25 cm.", "1.4 s is for 50 cm.", "", "2.8 s is for 200 cm."]}, "id": "s0003", "checked": true, "by": "seed"}, {"section": "science", "topic": "s-graphs", "passage": "The table lists the pH of several common solutions.", "table": {"headers": ["Solution", "pH"], "rows": [["Lemon juice", "2"], ["Vinegar", "3"], ["Pure water", "7"], ["Baking soda solution", "9"], ["Bleach", "12"]]}, "stem": "According to the table, what is the pH of vinegar?", "choices": ["2", "3", "7", "9"], "answer": 1, "rule": "Read a value: find the row, then read across", "explanation": {"right": "The vinegar row shows a pH of 3.", "wrong": ["2 is lemon juice.", "", "7 is pure water.", "9 is baking soda solution."]}, "id": "s0004", "checked": true, "by": "seed"}, {"section": "science", "topic": "s-graphs", "passage": "A student measured the mass and volume of four small solid objects. Water has a density of 1.0 g/mL.", "table": {"headers": ["Object", "Mass (g)", "Volume (mL)"], "rows": [["A", "20", "10"], ["B", "30", "40"], ["C", "54", "20"], ["D", "9", "10"]]}, "stem": "Which object has the greatest mass?", "choices": ["A", "B", "C", "D"], "answer": 2, "rule": "Check the column headers before reading", "explanation": {"right": "In the mass column, object C has 54 g, the largest value.", "wrong": ["A has 20 g.", "B has the largest volume, not mass.", "", "D has 9 g."]}, "id": "s0005", "checked": true, "by": "seed"}, {"section": "science", "topic": "s-graphs", "passage": "A farmer tested four amounts of fertilizer on identical plots of corn. Each plot got the same water and sunlight.", "table": {"headers": ["Plot", "Fertilizer (g per m²)", "Average yield (kg per m²)"], "rows": [["1", "0", "2.1"], ["2", "5", "2.9"], ["3", "10", "3.6"], ["4", "20", "3.3"]]}, "stem": "Which plot had the highest average yield?", "choices": ["Plot 1", "Plot 2", "Plot 3", "Plot 4"], "answer": 2, "rule": "Read a value: compare one column", "explanation": {"right": "Plot 3 had 3.6 kg per m², the highest yield.", "wrong": ["Plot 1 had 2.1.", "Plot 2 had 2.9.", "", "Plot 4 had the most fertilizer, but its yield was 3.3."]}, "id": "s0006", "checked": true, "by": "seed"}, {"section": "science", "topic": "s-graphs", "passage": "Sound level is measured in decibels (dB). On this scale, every increase of 10 dB means the sound is 10 times as intense.", "table": {"headers": ["Sound source", "Sound level (dB)"], "rows": [["Whisper", "30"], ["Normal conversation", "60"], ["Busy traffic", "80"], ["Rock concert", "110"]]}, "stem": "What is the sound level of normal conversation?", "choices": ["30 dB", "60 dB", r reduces yield.", "more fertilizer always means more corn.", "10 g per m² gave a higher yield than 20 g per m² in this test."], "answer": 3, "rule": "A conclusion says only what the data shows", "explanation": {"right": "Plot 3 (10 g) yielded 3.6, more than Plot 4 (20 g) at 3.3.", "wrong": ["Water wasn't varied.", "All fertilized plots beat the control.", "Yield dropped at 20 g.", ""]}, "id": "s0046", "checked": true, "by": "seed"}, {"section": "science", "topic": "s-design", "passage": "A scientist measured how active an enzyme was at different pH values. All trials used the same temperature and amount of enzyme.", "table": {"headers": ["pH", "Enzyme activity (units)"], "rows": [["4", "10"], ["6", "45"], ["7", "60"], ["8", "40"], ["10", "5"]]}, "stem": "A student wants to know if temperature affects this enzyme. What should the student change?", "choices": ["Only the temperature, keeping pH the same", "The amount of enzyme and the pH", "Both pH and temperature", "Only the pH"], "answer": 0, "rule": "Change only one variable at a time", "explanation": {"right": "To test temperature, change only temperature and keep pH and everything else the same.", "wrong": ["", "Neither change tests temperature.", "Changing both makes the results unclear.", "This tests pH again."]}, "id": "s0047", "checked": true, "by": "seed"}, {"section": "science", "topic": "s-design", "passage": "A student dropped identical tablets into 200 mL of water at different temperatures and timed how long each took to dissolve completely.", "table": {"headers": ["Water temperature (°C)", "Time to dissolve (s)"], "rows": [["10", "120"], ["20", "80"], ["30", "55"], ["40", "38"]]}, "stem": "The student predicted that \"hotter water will dissolve tablets faster.\" This prediction is best called:", "choices": ["a hypothesis.", "a variable.", "a control.", "a conclusion."], "answer": 0, "rule": "Hypothesis = prediction before; conclusion = what the data shows", "explanation": {"right": "A prediction made before testing is a hypothesis.", "wrong": ["", "A variable is something that changes.", "A control is a baseline group.", "A conclusion comes after looking at data."]}, "id": "s0048", "checked": true, "by": "seed"}, {"section": "science", "topic": "s-viewpoints", "passage": "The number of trout in Clear Lake dropped by half between 2010 and 2020. Scientist 1: The lake's water got warmer. Warmer water holds less dissolved oxygen, and trout need a lot of oxygen, so fewer trout survived. Scientist 2: A new species of fish, the round goby, entered the lake in 2012. Gobies eat trout eggs, so fewer young trout were born.", "stem": "Which finding would most support Scientist 2?", "choices": ["Goby numbers rose sharply after 2012, and fewer young trout were found.", "The lake's water temperature rose each year.", "Adult trout were found with low oxygen levels.", "The lake got more rain."], "answer": 0, "rule": "Conflicting viewpoints: match the finding to each scientist's claim", "explanation": {"right": "Scientist 2 blames gobies eating eggs. More gobies and fewer young trout match that claim.", "wrong": ["", "This supports Scientist 1.", "This supports Scientist 1.", "Rain isn't part of either claim."]}, "id": "s0049", "checked": true, "by": "seed"}, {"section": "science", "topic": "s-viewpoints", "passage": "The number of trout in Clear Lake dropped by half between 2010 and 2020. Scientist 1: The lake's water got warmer. Warmer water holds less dissolved oxygen, and trout need a lot of oxygen, so fewer trout survived. Scientist 2: A new species of fish, the round goby, entered the lake in 2012. Gobies eat trout eggs, so fewer young trout were born.", "stem": "Both scientists agree that:", "choices": ["oxygen is not important.", "the number of trout dropped.", "gobies eat trout eggs.", "the water got warmer."], "answer": 1, "rule": "\"Both agree\" needs to be stated or implied by both", "explanation": {"right": "Both start from the fact that trout numbers fell by half.", " alues. All trials used the same temperature and amount of enzyme.", "table": {"headers": ["pH", "Enzyme activity (units)"], "rows": [["4", "10"], ["6", "45"], ["7", "60"], ["8", "40"], ["10", "5"]]}, "stem": "A scientist claims the enzyme works best in neutral conditions. Do the data support this?", "choices": ["No, because activity is highest at pH 10.", "Yes, because activity is highest at pH 7.", "Yes, because activity is highest at pH 4.", "No, because pH doesn't affect activity."], "answer": 1, "rule": "Pick the choice with the right match AND the right reason", "explanation": {"right": "pH 7 is neutral, and activity peaks there at 60 units.", "wrong": ["Activity at pH 10 is only 5 units.", "", "Activity is lowest near pH 4 and pH 10.", "Activity changes a lot with pH."]}, "id": "s0063", "checked": true, "by": "seed"}, {"section": "science", "topic": "s-newinfo", "passage": "A cart rolled along a flat track. A sensor recorded its distance from the start every second.", "table": {"headers": ["Time (s)", "Distance (m)"], "rows": [["0", "0"], ["1", "2"], ["2", "4"], ["3", "6"], ["4", "8"]]}, "stem": "A second cart's data show 0, 1, 4, 9, 16 m at 0 to 4 s. Compared with the first cart, the second cart was:", "choices": ["slowing down.", "moving at a steady speed.", "not moving.", "speeding up."], "answer": 3, "rule": "New information: describe it in plain words, then compare", "explanation": {"right": "The second cart covers more distance each second: 1, 3, 5, 7 m. It's speeding up, while the first cart moved at a steady 2 m each second.", "wrong": ["The gaps get bigger, not smaller.", "The gaps grow each second, so the speed isn't steady.", "The distance keeps changing.", ""]}, "id": "s0064", "checked": true, "by": "seed"}, {"section": "science", "topic": "s-newinfo", "passage": "Researchers counted rabbits and foxes in a valley each spring.", "table": {"headers": ["Year", "Rabbits", "Foxes"], "rows": [["1", "400", "20"], ["2", "600", "25"], ["3", "700", "40"], ["4", "450", "55"], ["5", "300", "35"]]}, "stem": "In Year 6, researchers count 250 rabbits and 22 foxes. This fits the idea that fox numbers depend on rabbits because:", "choices": ["both populations fell after rabbits fell.", "rabbits increased.", "foxes increased while rabbits decreased.", "foxes and rabbits stayed the same."], "answer": 0, "rule": "Pick the choice with the right match AND the right reason", "explanation": {"right": "Rabbits kept falling, and foxes fell too, about a year after the rabbit drop began.", "wrong": ["", "Rabbits fell to 250.", "Foxes fell from 35 to 22.", "Both changed."]}, "id": "s0065", "checked": true, "by": "seed"}, {"section": "science", "topic": "s-newinfo", "passage": "Students timed pendulums of different lengths. The same 50 g mass hung from each string. The period is the time for one full swing back and forth.", "table": {"headers": ["String length (cm)", "Period (s)"], "rows": [["25", "1.0"], ["50", "1.4"], ["100", "2.0"], ["200", "2.8"]]}, "stem": "A student tests a 100 cm pendulum with a 200 g mass and gets a period of 2.0 s. This result suggests that:", "choices": ["length has no effect.", "mass has little effect on the period.", "heavier masses swing faster.", "the period depends only on mass."], "answer": 1, "rule": "New information: compare it to the existing data", "explanation": {"right": "The 100 cm pendulum had a 2.0 s period with 50 g, and also with 200 g. Changing mass didn't change the period.", "wrong": ["The table shows length does matter.", "", "The period didn't get shorter.", "Length clearly matters."]}, "id": "s0066", "checked": true, "by": "seed"}, {"section": "science", "topic": "s-newinfo", "passage": "A student measured the mass and volume of four small solid objects. Water has a density of 1.0 g/mL.", "table": {"headers": ["Object", "Mass (g)", "Volume (mL)"], "rows": [["A", "20", "10"], ["B", "30", "40"], ["C", "54", "20"], ["D", "9", "10"]]}, "stem": "A new object E has a mass of 40 g and a volume of 50 mL. Based on the passage, object E will most likely:", "choices": ["float in water.", "have the same density as object C.", "sink in water.", "dissolve."], "answer": 0, "rule": "New information: compute, then compare", "explanation": {"right": "40 ÷ 50 = 0.8 g/mL, which is less than water's 1.0 g/mL, so it floats.", "wrong": ["", "Object C has 2.7 g/mL.", "Its density is less than 1.0 g/mL.", "Nothing suggests it dissolves."]}, "id": "s0067", "checked": true, "by": "seed"}, {"section": "science", "topic": "s-newinfo", "passage": "Sound level is measured in decibels (dB). On this scale, every increase of 10 dB means the sound is 10 times as intense.", "table": {"headers": ["Sound source", "Sound level (dB)"], "rows": [["Whisper", "30"], ["Normal conversation", "60"], ["Busy traffic", "80"], ["Rock concert", "110"]]}, "stem": "A hair dryer measures 70 dB. Its level falls between which two sources?", "choices": ["Busy traffic and rock concert", "Whisper and conversation", "Conversation and busy traffic", "Above the rock concert"], "answer": 2, "rule": "New information: place it in the data", "explanation": {"right": "70 dB is between conversation (60 dB) and busy traffic (80 dB).", "wrong": ["Those are 80 and 110 dB.", "Those are 30 and 60 dB.", "", "70 is less than 110."]}, "id": "s0068", "checked": true, "by": "seed"}, {"section": "science", "topic": "s-causation", "passage": "A town recorded its monthly ice cream sales and the number of people treated for sunburn. Both numbers were highest in July and lowest in January.", "stem": "Based on the data, can the town conclude that eating ice cream causes sunburn?", "choices": ["Yes, because ice cream is cold.", "Yes, because both rise in July.", "No, because sunburn is lower in January.", "No, because both may rise for another reason, such as hot sunny weather."], "answer": 3, "rule": "Correlation is not causation", "explanation": {"right": "The two numbers rise together, but warm sunny weather could drive both. A pattern alone doesn't prove one causes the other.", "wrong": ["This reason makes no sense.", "Rising together isn't proof of cause.", "Lower January numbers don't answer the question.", ""]}, "id": "s0069", "checked": true, "by": "seed"}, {"section": "science", "topic": "s-causation", "passage": "A survey of 500 students found that students who said they eat breakfast every day had higher average test scores than students who said they skip breakfast. Students chose for themselves whether to eat breakfast.", "stem": "Which conclusion is best supported by the survey?", "choices": ["Skipping breakfast causes students to fail.", "Students who eat breakfast tend to have higher scores.", "Eating breakfast causes higher test scores.", "All students should eat breakfast."], "answer": 1, "rule": "Correlation is not causation", "explanation": {"right": "The survey shows a link, not a cause. Students chose for themselves, so other differences could explain the scores.", "wrong": ["This claims a cause and is too extreme.", "", "The survey can't show cause because no variable was controlled.", "This is advice, not a finding."]}, "id": "s0070", "checked": true, "by": "seed"}, {"section": "science", "topic": "s-causation", "passage": "A survey of 500 students found that students who said they eat breakfast every day had higher average test scores than students who said they skip breakfast. Students chose for themselves whether to eat breakfast.", "stem": "Which experiment would best test whether breakfast causes higher test scores?", "choices": ["Compare scores of students in different states.", "Randomly assign students to eat or skip breakfast, keep everything else the same, and compare scores.", "Survey more students.", "Ask students which they prefer."], "answer": 1, "rule": "\"X causes Y\" needs an experiment that changes X alone", "explanation": {"right": "Randomly assigning breakfast and holding everything else the same lets you test cause.", "wrong": ["Many things differ between states.", "", "More surveys still only show a link.", "Preferences don't test cause."]}, "id": "s0071", "checked": true, "by": "seed"}, {"section": "science", "topic": "s-causation", "passage": "A survey of 500 students found that students who said they eat breakfast every day had higher average test scores than students who said they skip breakfast. Students chose for themselves whether to eat breakfast.", "stem": "Which is a possible reason, other than breakfast itself, for the link in the survey?", "choices": ["Students who eat breakfast may also get more sleep.", "The survey asked 500 students.", "Breakfast foods contain sugar.", "Tests are given in the morning."], "answer": 0, "rule": "Correlation is not causation: look for another explanation", "explanation": {"right": "Students who eat breakfast might differ in other ways, like sleep, that also affect scores.", "wrong": ["", "Sample size isn't another cause.", "This still makes breakfast the cause.", "This doesn't explain the difference between the groups."]}, "id": "s0072", "checked": true, "by": "seed"}, {"section": "science", "topic": "s-causation", "passage": "A town recorded its monthly ice cream sales and the number of people treated for sunburn. Both numbers were highest in July and lowest in January.", "stem": "Which factor most likely explains why both ice cream sales and sunburns peak in July?", "choices": ["Ice cream sales", "School schedules", "Hot, sunny weather", "Sunscreen sales"], "answer": 2, "rule": "Look for a third factor that drives both", "explanation": {"right": "Hot sunny weather makes people want ice cream and also exposes them to more sun.", "wrong": ["Ice cream doesn't cause sunburn.", "Schedules don't explain sunburn.", "", "Sunscreen would lower sunburns."]}, "id": "s0073", "checked": true, "by": "seed"}, {"section": "science", "topic": "s-causation", "passage": "A farmer tested four amounts of fertilizer on identical plots of corn. Each plot got the same water and sunlight.", "table": {"headers": ["Plot", "Fertilizer (g per m²)", "Average yield (kg per m²)"], "rows": [["1", "0", "2.1"], ["2", "5", "2.9"], ["3", "10", "3.6"], ["4", "20", "3.3"]]}, "stem": "The farmer claims \"fertilizer caused the higher yields.\" Which feature of the study supports this claim?", "choices": ["Only the amount of fertilizer differed between plots.", "The farmer liked Plot 3.", "Yields were measured in kilograms.", "The plots were in different states."], "answer": 0, "rule": "Cause is supported only if one variable changed and the rest held constant", "explanation": {"right": "Because water, sunlight, and plots were the same, fertilizer is the only explanation for the differences.", "wrong": ["", "Preference isn't evidence.", "Units don't show cause.", "The passage says the plots were identical."]}, "id": "s0074", "checked": true, "by": "seed"}, {"section": "science", "topic": "s-causation", "passage": "Researchers counted rabbits and foxes in a valley each spring.", "table": {"headers": ["Year", "Rabbits", "Foxes"], "rows": [["1", "400", "20"], ["2", "600", "25"], ["3", "700", "40"], ["4", "450", "55"], ["5", "300", "35"]]}, "stem": "A student says, \"The data prove that foxes caused the rabbits to decline.\" Why is this claim too strong?", "choices": ["Foxes and rabbits never live together.", "Rabbits increased every year.", "The data show no foxes.", "The data show only a pattern over time, not an experiment."], "answer": 3, "rule": "Correlation is not causation", "explanation": {"right": "The numbers rise and fall in a pattern, but nothing was controlled. Weather or food could also affect rabbits.", "wrong": ["They share the valley.", "Rabbits fell after Year 3.", "Foxes were counted every year.", ""]}, "id": "s0075", "checked": true, "by": "seed"}, {"section": "science", "topic": "s-causation", "passage": "A town recorded its monthly ice cream sales and the number of people treated for sunburn. Both numbers were highest in July and lowest in January.", "stem": "Based only on the data, which statement is accurate?", "choices": ["Sunburn causes people to buy ice cream.", "Ice cream causes sunburn.", "Neither number changes during the year.", "Ice cream sales and sunburn cases rise and fall together."], "answer": 3, "rule": "Correlation is not causation", "explanation": {"right": "The data show the two move together, which is a correlation. It doesn't show which causes which.", "wrong": ["The data don't show cause.", "The data don't show cause.", "Both numbers change a lot.", ""]}, "id": "s0076", "checked": true, "by": "seed"}, {"section": "science", "topic": "s-causation", "passage": "A student grew bean plants under different amounts of light per day. All plants got the same soil, pot size, and water. Heights were measured after 4 weeks.", "table": {"headers": ["Light (hours/day)", "Height after 4 weeks (cm)"], "rows": [["4", "6.2"], ["8", "10.5"], ["12", "14.1"], ["16", "14.8"]]}, "stem": "Why can the student say that light affected plant height?", "choices": ["Because light was the only factor changed between groups.", "Because the plants were beans.", "Because heights were measured in cm.", "Because taller plants were greener."], "answer": 0, "rule": "Cause is supported only if one variable changed and the rest held constant", "explanation": {"right": "All other factors were held the same, so differences in height can be linked to light.", "wrong": ["", "The type of plant doesn't show cause.", "Units don't show cause.", "Color wasn't measured."]}, "id": "s0077", "checked": true, "by": "seed"}, {"section": "science", "topic": "s-causation", "passage": "A 2019 survey asked teenagers how they got to school and whether they felt awake in first period. Students who walked or biked were more likely to say they felt awake.", "stem": "A student says that riding a bus makes students less awake. Why can't the 2019 survey support this?", "choices": ["Buses are faster than walking.", "A survey can show a link but can't control other factors.", "The survey only asked about bikes.", "The survey didn't include bus riders."], "answer": 1, "rule": "Correlation is not causation", "explanation": {"right": "A survey only finds patterns. Things like how far away students live or when they wake up could explain any link.", "wrong": ["Speed doesn't address cause.", "", "The survey asked about all ways of getting to school.", "Bus riders were 40 percent of the survey."]}, "id": "s0078", "checked": true, "by": "seed"}, {"section": "science", "topic": "s-units", "passage": "Sound level is measured in decibels (dB). On this scale, every increase of 10 dB means the sound is 10 times as intense.", "table": {"headers": ["Sound source", "Sound level (dB)"], "rows": [["Whisper", "30"], ["Normal conversation", "60"], ["Busy traffic", "80"], ["Rock concert", "110"]]}, "stem": "Busy traffic is how many times as intense as normal conversation?", "choices": ["1.3 times", "2 times", "20 times", "100 times"], "answer": 3, "rule": "Check whether a scale is linear or logarithmic", "explanation": {"right": "Traffic is 20 dB louder. Each 10 dB is 10 times, so 20 dB is 10 × 10 = 100 times.", "wrong": ["This divides 80 by 60.", "This treats the scale as linear.", "This uses the dB difference as the answer.", ""]}, "id": "s0079", "checked": true, "by": "seed"}, {"section": "science", "topic": "s-units", "passage": "Sound level is measured in decibels (dB). On this scale, every increase of 10 dB means the sound is 10 times as intense.", "table": {"headers": ["Sound source", "Sound level (dB)"], "rows": [["Whisper", "30"], ["Normal conversation", "60"], ["Busy traffic", "80"], ["Rock concert", "110"]]}, "stem": "A rock concert is how many times as intense as busy traffic?", "choices": ["3 times", "30 times", "300 times", "1,000 times"], "answer": 3, "rule": "Check whether a scale is linear or logarithmic", "explanation": {"right": "110 − 80 = 30 dB. That's three steps of 10 times: 10 × 10 × 10 = 1,000.", "wrong": ["This counts the steps without multiplying.", "This uses the dB difference.", "This multiplies 3 by 100.", ""]}, "id": "s0080", "checked": true, "by": "seed"}, {"section": "science", "topic": "s-units", "passage": "A student dropped identical tablets into 200 mL of water at different temperatures and timed how long each took to dissolve completely.", "table": {"headers": ["Water temperature (°C)", "Time to dissolve (s)"], "rows": [["10", "120"], ["20", "80"], ["30", "55"], ["40", "38"]]}, "stem": "How many minutes did the tablet take to dissolve at 10°C?", "choices": ["1.2 minutes", "2 minutes", "12 minutes", "120 minutes"], "answer": 1, "rule": "Units: check what unit the question uses", "explanation": {"right": "The table gives 120 seconds. 120 ÷ 60 = 2 minutes.", "wrong": ["This moves the decimal instead of dividing by 60.", "", "This divides by 10.", "The table is in seconds, not minutes."]}, "id": "s0081", "checked": true, "by": "seed"}, {"section": "science", "topic": "s-units", "passage": "Students timed pendulums of different lengths. The same 50 g mass hung from each string. The period is the time for one full swing back and forth.", "table": {"headers": ["String length (cm)", "Period (s)"], "rows": [["25", "1.0"], ["50", "1.4"], ["100", "2.0"], ["200", "2.8"]]}, "stem": "How long, in meters, was the string with a period of 2.8 s?", "choices": ["0.2 m", "2 m", "20 m", "200 m"], "answer": 1, "rule": "Units: check what unit the question uses", "explanation": {"right": "The table gives 200 cm. 100 cm = 1 m, so 200 cm = 2 m.", "wrong": ["This divides by 1,000.", "", "This divides by 10.", "The table is in cm, not m."]}, "id": "s0082", "checked": true, "by": "seed"}, {"section": "science", "topic": "s-units", "passage": "A student measured the mass and volume of four small solid objects. Water has a density of 1.0 g/mL.", "table": {"headers": ["Object", "Mass (g)", "Volume (mL)"], "rows": [["A", "20", "10"], ["B", "30", "40"], ["C", "54", "20"], ["D", "9", "10"]]}, "stem": "The volume of object B is 40 mL. How many liters is that?", "choices": ["0.04 L", "0.4 L", "4 L", "40 L"], "answer": 0, "rule": "Units: 1 L = 1,000 mL", "explanation": {"right": "40 ÷ 1,000 = 0.04 L.", "wrong": ["", "This divides by 100.", "This divides by 10.", "This doesn't convert."]}, "id": "s0083", "checked": true, "by": "seed"}, {"section": "science", "topic": "s-units", "passage": "A cart rolled along a flat track. A sensor recorded its distance from the start every second.", "table": {"headers": ["Time (s)", "Distance (m)"], "rows": [["0", "0"], ["1", "2"], ["2", "4"], ["3", "6"], ["4", "8"]]}, "stem": "What was the speed of the cart?", "choices": ["2 m/s", "0.5 m/s", "8 m/s", "2 s/m"], "answer": 0, "rule": "Units: speed = distance / time", "explanation": {"right": "The cart moved 8 m in 4 s. 8 ÷ 4 = 2 m/s.", "wrong": ["", "This divides time by distance.", "8 m is the total distance, not a speed.", "The units are flipped."]}, "id": "s0084", "checked": true, "by": "seed"}, {"section": "science", "topic": "s-units", "passage": "A farmer tested four amounts of fertilizer on identical plots of corn. Each plot got the same water and sunlight.", "table": {"headers": ["Plot", "Fertilizer (g per m²)", "Average yield (kg per m²)"], "rows": [["1", "0", "2.1"], ["2", "5", "2.9"], ["3", "10", "3.6"], ["4", "20", "3.3"]]}, "stem": "How many grams of fertilizer did a 2 m² area of Plot 3 receive?", "choices": ["5 g", "10 g", "20 g", "40 g"], "answer": 2, "rule": "Units: multiply a rate by the amount", "explanation": {"right": "Plot 3 got 10 g per m². For 2 m², that's 10 × 2 = 20 g.", "wrong": ["This halves the rate.", "This is the amount for 1 m².", "", "This uses Plot 4's rate."]}, "id": "s0085", "checked": true, "by": "seed"}, {"section": "science", "topic": "s-units", "passage": "A student measured the mass and volume of four small solid objects. Water has a density of 1.0 g/mL.", "table": {"headers": ["Object", "Mass (g)", "Volume (mL)"], "rows": [["A", "20", "10"], ["B", "30", "40"], ["C", "54", "20"], ["D", "9", "10"]]}, "stem": "In what units is density reported for these objects?", "choices": ["kg", "g × mL", "mL/g", "g/mL"], "answer": 3, "rule": "Units: density = mass / volume", "explanation": {"right": "Density is mass divided by volume, so grams per milliliter.", "wrong": ["kg is only mass.", "Density divides, it doesn't multiply.", "The units are flipped.", ""]}, "id": "s0086", "checked": true, "by": "seed"}, {"section": "science", "topic": "s-units", "passage": "Students dissolved different amounts of table salt in 100 mL of water and measured the temperature at which each solution froze.", "table": {"headers": ["Salt (g per 100 mL)", "Freezing point (°C)"], "rows": [["0", "0"], ["5", "−3"], ["10", "−6"], ["15", "−9"]]}, "stem": "The freezing point of the 15 g solution is −9°C. This is how many degrees below the freezing point of pure water?", "choices": ["3 degrees", "6 degrees", "9 degrees", "15 degrees"], "answer": 2, "rule": "Units: watch negative values on a scale", "explanation": {"right": "Pure water freezes at 0°C. 0 − (−9) = 9 degrees.", "wrong": ["3 is the drop for each 5 g.", "6 is the drop at 10 g.", "", "15 is the grams of salt."]}, "id": "s0087", "checked": true, "by": "seed"}, {"section": "science", "topic": "s-units", "passage": "A student grew bean plants under different amounts of light per day. All plants got the same soil, pot size, and water. Heights were measured after 4 weeks.", "table": {"headers": ["Light (hours/day)", "Height after 4 weeks (cm)"], "rows": [["4", "6.2"], ["8", "10.5"], ["12", "14.1"], ["16", "14.8"]]}, "stem": "The 16 hour plants grew to 14.8 cm. How many millimeters is that?", "choices": ["1.48 mm", "14.8 mm", "148 mm", "1,480 mm"], "answer": 2, "rule": "Units: 1 cm = 10 mm", "explanation": {"right": "14.8 × 10 = 148 mm.", "wrong": ["This divides by 10.", "This doesn't convert.", "", "This multiplies by 100."]}, "id": "s0088", "checked": true, "by": "seed"}, {"section": "science", "topic": "s-outside", "passage": "The table lists the pH of several common solutions.", "table": {"headers": ["Solution", "pH"], "rows": [["Lemon juice", "2"], ["Vinegar", "3"], ["Pure water", "7"], ["Baking soda solution", "9"], ["Bleach", "12"]]}, "stem": "Which solution in the table is a base?", "choices": ["Vinegar", "Lemon juice", "Bleach", "Pure water"], "answer": 2, "rule": "pH above 7 is a base", "explanation": {"right": "Bleach has a pH of 12, which is above 7, so it's a base. Baking soda solution is a base too.", "wrong": ["pH 3 is an acid.", "pH 2 is an acid.", "", "pH 7 is neutral."]}, "id": "s0089", "checked": true, "by": "seed"}, {"section": "science", "topic": "s-outside", "passage": "The table lists the pH of several common solutions.", "table": {"headers": ["Solution", "pH"], "rows": [["Lemon juice", "2"], ["Vinegar", "3"], ["Pure water", "7"], ["Baking soda solution", "9"], ["Bleach", "12"]]}, "stem": "Which solution in the table is the most acidic?", "choices": ["Vinegar", "Bleach", "Pure water", "Lemon juice"], "answer": 3, "rule": "Lower pH means more acidic", "explanation": {"right": "Lemon juice has the lowest pH, 2, so it's the most acidic.", "wrong": ["Vinegar's pH of 3 is less acidic than 2.", "Bleach is a base.", "Pure water is neutral.", ""]}, "id": "s0090", "checked": true, "by": "seed"}, {"section": "science", "topic": "s-outside", "passage": "A student measured the mass and volume of four small solid objects. Water has a density of 1.0 g/mL.", "table": {"headers": ["Object", "Mass (g)", "Volume (mL)"], "rows": [["A", "20", "10"], ["B", "30", "40"], ["C", "54", "20"], ["D", "9", "10"]]}, "stem": "Which objects will float in water?", "choices": ["A and C", "B and D", "A and B", "C and D"], "answer": 1, "rule": "Density = mass / volume; less dense than water floats", "explanation": {"right": "B is 30 ÷ 40 = 0.75 g/mL and D is 9 ÷ 10 = 0.9 g/mL. Both are less than 1.0, so they float.", "wrong": ["A is 2.0 and C is 2.7, so both sink.", "", "A sinks.", "C sinks."]}, "id": "s0091", "checked": true, "by": "seed"}, {"section": "science", "topic": "s-outside", "passage": "Plants make sugar from carbon dioxide and water using light energy.", "stem": "Which process is described?", "choices": ["Mitosis", "Photosynthesis", "Cellular respiration", "Evaporation"], "answer": 1, "rule": "Photosynthesis uses light to make sugar", "explanation": {"right": "Using light to make sugar from carbon dioxide and water is photosynthesis.", "wrong": ["Mitosis is cell division.", "", "Respiration breaks sugar down to release energy.", "Evaporation is water turning to gas."]}, "id": "s0092", "checked": true, "by": "seed"}, {"section": "science", "topic": "s-outside", "passage": "A cell divides once to make two identical cells, each with the full set of chromosomes.", "stem": "Which process is described?", "choices": ["Mitosis", "Fertilization", "Meiosis", "Photosynthesis"], "answer": 0, "rule": "Mitosis makes two identical cells", "explanation": {"right": "Mitosis makes two identical cells with the full chromosome number. Meiosis makes four cells with half.", "wrong": ["", "Fertilization joins two cells.", "Meiosis makes four cells with half the chromosomes.", "Photosynthesis makes sugar."]}, "id": "s0093", "checked": true, "by": "seed"}, {"section": "science", "topic": "s-outside", "passage": "A food chain in a pond: algae are eaten by small fish, which are eaten by herons.", "stem": "In this chain, the algae are:", "choices": ["consumers.", "predators.", "producers.", "decomposers."], "answer": 2, "rule": "Producers make their own food", "explanation": {"right": "Algae make their own food from light, so they are producers.", "wrong": ["Consumers eat other living things.", "Algae don't hunt.", "", "Decomposers break down dead matter."]}, "id": "s0094", "checked": true, "by": "seed"}, {"section": "science", "topic": "s-outside", "passage": "A student pushes a box across the floor. The box pushes back on the student's hands with an equal force.", "stem": "Which law does this describe?", "choices": ["Newton's first law", "Newton's second law", "Newton's third law", "Conservation of mass"], "answer": 2, "rule": "Newton's third law: every action has an equal and opposite reaction", "explanation": {"right": "The equal push back is the third law.", "wrong": ["The first law is about objects staying at rest or in motion.", "The second law is F = ma.", "", "Conservation of mass is about matter."]}, "id": "s0095", "checked": true, "by": "seed"}, {"section": "science", "topic": "s-outside", "passage": "A ball rolls down a ramp. At the top it has potential energy. At the bottom it is moving fast.", "stem": "Which idea best explains where the ball's speed comes from?", "choices": ["Energy is created at the bottom.", "Kinetic energy disappears.", "Potential energy changes into kinetic energy.", "The ball loses all its mass."], "answer": 2, "rule": "Conservation of energy: energy changes form but isn't created or destroyed", "explanation": {"right": "The stored energy at the top turns into motion energy as the ball rolls down.", "wrong": ["Energy isn't created.", "Kinetic energy increases.", "", "Mass doesn't change."]}, "id": "s0096", "checked": true, "by": "seed"}, {"section": "science", "topic": "s-outside", "passage": "Elements in the same vertical column of the periodic table share many properties.", "stem": "A vertical column of the periodic table is called a:", "choices": ["period.", "row.", "shell.", "group."], "answer": 3, "rule": "Periodic table: columns are groups, rows are periods", "explanation": {"right": "Vertical columns are called groups.", "wrong": ["A period is a horizontal row.", "A row is horizontal.", "A shell is part of an atom.", ""]}, "id": "s0097", "checked": true, "by": "seed"}, {"section": "science", "topic": "s-outside", "passage": "In living cells, DNA is copied into a molecule that carries the instructions to where proteins are made.", "stem": "Which molecule carries the instructions?", "choices": ["Water", "RNA", "Fat", "Glucose"], "answer": 1, "rule": "DNA is copied into RNA, which guides protein building", "explanation": {"right": "RNA carries DNA's instructions to make proteins.", "wrong": ["Water doesn't carry genetic instructions.", "", "Fat stores energy.", "Glucose is a sugar."]}, "id": "s0098", "checked": true, "by": "seed"}, {"section": "science", "topic": "s-graphs", "passage": "A student mixed baking soda with vinegar in sealed bags at different vinegar volumes and measured the volume of gas made. The amount of baking soda was the same in every bag.", "table": {"headers": ["Vinegar (mL)", "Gas produced (mL)"], "rows": [["10", "120"], ["20", "240"], ["30", "360"], ["40", "380"], ["50", "380"]]}, "stem": "How much gas was produced with 30 mL of vinegar?", "choices": ["120 mL", "240 mL", "360 mL", "380 mL"], "answer": 2, "rule": "Read a value: find the row, then read across", "explanation": {"right": "The 30 mL row shows 360 mL of gas.", "wrong": ["120 mL is for 10 mL.", "240 mL is for 20 mL.", "", "380 mL is for 40 or 50 mL."]}, "id": "s0099", "checked": true, "by": "seed"}, {"section": "science", "topic": "s-graphs", "passage": "A gardener measured soil temperature at 5 cm depth under different amounts of shade at 2 p.m. on the same sunny day.", "table": {"headers": ["Shade (%)", "Soil temperature (°C)"], "rows": [["0", "34"], ["25", "30"], ["50", "26"], ["75", "22"], ["100", "19"]]}, "stem": "What was the soil temperature under 50% shade?", "choices": ["22°C", "26°C", "30°C", "34°C"], "answer": 1, "rule": "Read a value: find the row, then read across", "explanation": {"right": "The 50% row shows 26°C.", "wrong": ["22°C is 75% shade.", "", "30°C is 25% shade.", "34°C is no shade."]}, "id": "s0100", "checked": true, "by": "seed"}, {"section": "science", "topic": "s-graphs", "passage": "Students measured their heart rates after jogging in place for different lengths of time.", "table": {"headers": ["Jogging ti // Each visitor's own data lives in four small documents. Where the page can save

const DOCS = ["profile", "tests", "misses", "quiz"];

  profile: { onboarded: false },

const Store = {

  localSet(name, val) { try { localStorage.setItem("bsp:" + name, JSON.stringify(val)); return true; } catch { return false; } },
  get(name) { return this.data[name]; },
  initLocal() { for (const n of DOCS) this.data[n] = this.localGet(n) || structuredClone(EMPTY[n]); },
  async initCloud() {
    try {
      this.user = await claude.use("user");
      this.db = await claude.use("db");
      if (this.user) this.isOwner = await this.user.isOwner().catch(() => false);
      if (!this.user || !this.db) return false;
      this.uid = await this.user.id().catch(() => null);
      if (!this.uid) return false;
      const snaps = await Promise.all(DOCS.map(n => this.db.doc(`data/users/${this.uid}/${n}`).get()));
      const cloud = {};
      snaps.forEach((s, i) => { if (s.exists) cloud[DOCS[i]] = structuredClone(s.data()); });
      const hasCloud = Object.keys(cloud).length > 0;
      if (hasCloud) {
        for (const n of DOCS) this.data[n] = cloud[n] || structuredClone(EMPTY[n]);
        this.mode = "cloud";
        return true;
      }
      // Nothing saved yet. Try one write to learn whether this visitor can save here.
      const hasLocal = DOCS.some(n => this.localGet(n));
      try {
        await this.db.doc(`data/users/${this.uid}/profile`).set(this.data.profile || EMPTY.profile);
        this.mode = "cloud";
        if (hasLocal) for (const n of DOCS) if (n !== "profile") await this.db.doc(`data/users/${this.uid}/${n}`).set(this.data[n]);
        return true;
      } catch (e) {
        this.mode = "local";
        return false;
      }
    } catch { return false; }
  },
  _queue: {},
  async save(name) {
    const val = this.data[name];
    this.localSet(name, val);
    if (this.mode !== "cloud") return;
    // One write at a time per document; coalesce bursts.
    const q = this._queue[name] || (this._queue[name] = { busy: false, again: false });
    if (q.busy) { q.again = true; return; }
    q.busy = true;
    try {
      do {
        q.again = false;
        try { await this.db.doc(`data/users/${this.uid}/${name}`).set(this.data[name]); }
        catch (e) {
          if (e && e.code === "quota_exceeded") toast("Your saved data is full. Clear old mistakes in the Mistake log.");
          else if (e && e.code === "invalid_argument") { this.mode = "local"; toast("Saving in this browser from now on."); }

// ===== Booklet parser for PDFs that have a text layer =====
// Input: pages = [{w, h, items: [{s, x, y, w, h}]}] with y measured from the top (baseline).
// Pure functions so the same code runs in the browser and in tests.
const PARSER = (() => {
  const SEC_HEAD = [
    ["english", /ENGLISH\s*TEST/i],
    ["math", /MATHEMATICS\s*TEST/i],
    ["reading", /READING\s*TEST/i],
    ["science", /SCIENCE(\s+REASONING)?\s*TEST/i],
  ];
  const OLD_COUNT = { english: 75, math: 60, reading: 40, science: 40 };

  function lines(page, tol = 2.5) {
    const its = page.items.slice().sort((a, b) => a.y - b.y || a.x - b.x);
    const out = [];
    for (const it of its) {
      const last = out[out.length - 1];
      if (last && Math.abs(last.y - it.y) <= tol) last.items.push(it);
      else out.push({ y: it.y, items: [it] });
    }
    for (const l of out) { l.items.sort((a, b) => a.x - b.x); l.text = l.items.map(i => i.s).join(" "); }
    return out;
  }
  function pageText(page) { return lines(page).map(l => l.text).join("\n"); }

  function detectForm(pages, fileName = "") {
    const pats = [/\bForm\s*[:#]?\s*([A-Z]{0,2}\d{2,4}[A-Z]{0,4})\b/, /\bACT[-\s]([A-Z]{0,2}\d{2,4}[A-Z]{0,4})\b/, /\bFrom\s+([A-Z]{0,2}\d{2,4}[A-Z]?)\b/];
    for (const re of pats) {
      for (const p of pages.slice(0, 4).concat(pages.slice(-6))) {
        const m = pageText(p).match(re);
        if (m && /\d/.test(m[1]) && !/^(19|20)\d\d$/.test(m[1])) return m[1].toUpperCase();
      }
    }
    for (const p of pages) { const m = pageText(p).match(pats[1]); if (m) return m[1].toUpperCase(); }

    return fm ? fm[1].toUpperCase() : "";

  // Which pages hold which section's questions.
  function sectionPages(pages) {
    const map = [];
    let cur = null;
    pages.forEach((p, i) => {
      const t = pageText(p);
      const isKey = /Scoring\s+Key|Answer\s+Key/i.test(t) && /\b1\.\s+[A-E]\b/.test(t.replace(/\s+/g, " "));
      const isConv = /Scale\s+Scores?/i.test(t) && /Raw\s+Scores?/i.test(t);
      if (isKey || isConv) { map.push({ section: null, kind: isKey ? "key" : "conversion" }); cur = null; return; }
      if (/WRITING\s+TEST/i.test(t) && !SEC_HEAD.some(([, re]) => re.test(t))) { map.push({ section: null, kind: "other" }); cur = null; return; }

        // A section heading near the top of the page, not a mention in running text.
        const top = lines(p).filter(l => l.y < p.h * 0.35).map(l => l.text).join(" ");
        if (re.test(top)) { cur = s; break; }
      }
      map.push({ section: cur, kind: cur ? "questions" : "other" });
      if (/END\s+OF\s+TEST/i.test(t)) cur = null;
    });

  }

  // Find where each question starts: page, column, top y. Returns {section: {n: {page, x, y, col}}}.
  function locateQuestions(pages, smap) {
    const found = { english: {}, math: {}, reading: {}, science: {} };
    for (const sec of Object.keys(found)) {
      let next = 1;
      const max = OLD_COUNT[sec];
      smap.forEach((m, pi) => {
        if (m.section !== sec) return;
        const p = pages[pi];
        // Candidate starts: an item that begins with "N." (N = a question number).
        const cands = [];
        for (const it of p.items) {
          const mm = it.s.match(/^\s*(\d{1,2})\s*\.(\s|$)/);
          if (!mm) continue;
          const n = +mm[1];
          if (n < 1 || n > max) continue;
          cands.push({ n, x: it.x, y: it.y, h: it.h || 9 });
        }
        // Keep candidates that look like question numbers: followed by text on the same line or a choice letter.
        cands.sort((a, b) => (a.x < p.w / 2 ? 0 : 1) - (b.x < p.w / 2 ? 0 : 1) || a.y - b.y);

          if (found[sec][c.n]) continue;
          if (c.n < next) continue;
          if (c.n > next + 3) continue; // too far ahead to be the next question
          found[sec][c.n] = { page: pi, x: c.x, y: c.y, h: c.h, col: c.x < p.w / 2 ? 0 : 1 };

  function questionBoxes(pages, found) {
    const boxes = {};
    for (const sec of Object.keys(found)) {
      boxes[sec] = {};
      const byPage = {};

          const list = qs.filter(q => q.col === col).sort((a, b) => a.y - b.y);
          list.forEach((q, i) => {

              const marks = [];
              for (const pj of [+pi, +pi - 1]) {
                const pp = pages[pj]; if (!pp) continue;
                for (const it of pp.items) if (it.s.trim() === String(q.n) && it.x < pp.w / 2 - 10 && (it.h || 9) <= 9 && it.y > pp.h * 0.08 && it.y < pp.h * 0.93) marks.push({ page: pj, x: (it.x - 4) / pp.w, y: (it.y - (it.h || 7) - 2) / pp.h, w: ((it.w || 6) + 8) / pp.w, h: ((it.h || 7) + 4) / pp.h });
                if (marks.length) break;
              }

            }

  }
  function footerTop(p) {
    const f = p.items.filter(i => (i.y > p.h * 0.88 && /GO ON|END OF TEST|STOP!|^ACT-/i.test(i.s.trim())) || (i.y > p.h * 0.935 && /^\d+$/.test(i.s.trim())));

  // ---- Scoring key ----
  const CAT_CODES = ["POW", "KLA", "CSE", "UM", "RH", "N", "A", "F", "G", "S", "IES", "MDL", "PHM", "EA", "AG", "GT", "KID", "CS", "IKI", "IOD", "SIN", "EMI", "SS", "AL", "LIT"];
  function splitWords(it) {
    const words = []; const re = /\S+/g; let m;
    const cw = it.w / Math.max(1, it.s.length);

    return words;
  }
  function parseKeys(pages, smap) {
    const res = {};
    smap.forEach((m, pi) => {
      if (m.kind !== "key") return;
      const p = pages[pi];
      // Section headings on this key page, by y.
      const heads = [];
      for (const it of p.items) {
        const t = it.s;
        let sec = null;
        if (/Test\s*1|English/i.test(t) && /Key/i.test(t)) sec = "english";
        else if (/Test\s*2|Mathematics/i.test(t) && /Key/i.test(t)) sec = "math";
        else if (/Test\s*3|Reading/i.test(t) && /Key/i.test(t)) sec = "reading";
        else if (/Test\s*4|Science/i.test(t) && /Key/i.test(t)) sec = "science";
        if (sec) heads.push({ sec, y: it.y });
      }
      heads.sort((a, b) => a.y - b.y);
      if (!heads.length) return;
      const secAt = y => { let s = null; for (const hd of heads) if (hd.y <= y + 1) s = hd.sec; return s; };
      // Category header words: on the same line as a "Key" label.
      const keyLabels = p.items.filter(i => /^Key\b/.test(i.s.trim()) && i.s.trim().length < 30);
      const catWords = [];
      for (const kl of keyLabels) for (const it of p.items) if (Math.abs(it.y - kl.y) < 2.5) for (const w of splitWords(it)) if (CAT_CODES.includes(w.s)) catWords.push({ ...w, sec: secAt(kl.y) });

      for (const l of ls) {
        const sec = secAt(l.y);

          const mm = its[i].s.trim().match(/^(\d{1,2})\.\s*([A-K])?$/);
          if (!mm) continue;
          const n = +mm[1];
          let letter = mm[2], li = i;
          if (!letter && its[i + 1] && /^[A-K]$/.test(its[i + 1].s.trim())) { letter = its[i + 1].s.trim(); li = i + 1; }
          if (!letter) continue;
          // Category marks: "___" items to the right until the next "N." item.
          const cats = [];
          for (let j = li + 1; j < its.length; j++) {
            if (/^\d{1,2}\.\s*/.test(its[j].s.trim())) break;
            if (/^_{2,}$/.test(its[j].s.trim())) {
              const cx = its[j].x + its[j].w / 2;

              if (near && Math.abs(near.cx - cx) < 20) cats.push(near.s);

          if (!r.answers[n]) { r.answers[n] = letter; if (cats.length) r.categories[n] = cats; }

  // ---- Raw to scale conversion table ----
  function parseRange(s) {
    s = s.trim().replace(/[–−—]/g, "-");
    if (/^-+$/.test(s) || s === "") return null;
    const m = s.match(/^(\d{1,2})(?:\s*-\s*(\d{1,2}))?$/);
    if (!m) return undefined;
    return [+m[1], m[2] != null ? +m[2] : +m[1]];
  }
  function parseConversion(pages, smap) {
    for (let pi = 0; pi < pages.length; pi++) {
      if (smap[pi].kind !== "conversion") continue;
      const rows = {};
      for (const l of lines(pages[pi])) {
        const cells = l.items.flatMap(it => it.s.trim().split(/\s{2,}|\s(?=\d{1,2}(?:-\d{1,2})?\s)|\s(?=[–—-]\s)/)).map(s => s.trim()).filter(Boolean);
        if (cells.length < 6) continue;
        const a = +cells[0], b = +cells[cells.length - 1];
        if (!(a >= 1 && a <= 36 && a === b && /^\d{1,2}$/.test(cells[0]))) continue;
        const mid = cells.slice(1, -1);
        if (mid.length !== 4) continue;
        const parsed = mid.map(parseRange);
        if (parsed.some(x => x === undefined)) continue;
        rows[a] = parsed;
      }
      if (Object.keys(rows).length >= 25) {
        const out = { english: {}, math: {}, reading: {}, science: {} };
        const secs = ["english", "math", "reading", "science"];
        for (const [scale, rs] of Object.entries(rows)) rs.forEach((r, i) => { if (r) for (let raw = r[0]; raw <= r[1]; raw++) out[secs[i]][raw] = +scale; });
        return out;
      }
    }
    return null;
  }

  // Text of a question: its own lines, plus nearby passage lines for English.
  function questionText(pages, found, sec, n) {
    const q = found[sec][n];
    if (!q) return "";
    const p = pages[q.page];
    const nextQ = found[sec][n + 1];
    const ls = lines(p);
    const inCol = it => (q.col === 0 ? it.x < p.w / 2 - 2 : it.x >= p.w / 2 - 2);
    const bottom = nextQ && nextQ.page === q.page && nextQ.col === q.col ? nextQ.y - 2 : p.h * 0.93;
    const own = ls.filter(l => l.y >= q.y - 2 && l.y < bottom).map(l => l.items.filter(inCol).map(i => i.s).join(" ")).filter(Boolean).join("\n");
    if (sec !== "english") return own;
    const ctx = ls.filter(l => l.y > q.y - 60 && l.y < q.y + 40).map(l => l.items.filter(it => it.x < p.w / 2 - 2).map(i => i.s).join(" ")).filter(Boolean).join("\n");
    return `Passage lines near the underlined part:\n${ctx}\n\nQuestion ${n}:\n${own}`;
  }

  function analyze(pages, fileName) {
    const textChars = pages.reduce((s, p) => s + p.items.reduce((a, i) => a + i.s.length, 0), 0);
    const smap = sectionPages(pages);
    const found = locateQuestions(pages, smap);
    const boxes = questionBoxes(pages, found);
    const keys = parseKeys(pages, smap);
    const conversion = parseConversion(pages, smap);
    const counts = Object.fromEntries(Object.keys(found).map(s => [s, Object.keys(found[s]).length]));
    return { textChars, smap, found, boxes, keys, conversion, counts, form: detectForm(pages, fileName) };
  }
  return { analyze, lines, pageText, questionText, OLD_COUNT, parseRange };
})();


// ===== Reading test PDFs in the browser =====
// PDFs never leave the device except as page images sent to the visitor's own Claude when a page is scanned.
const PDFX = (() => {
  let ready = null;
  function lib() {
    if (!ready) ready = (async () => {
      // Load the PDF reader only when a PDF is opened. The worker script runs on the page itself.
      const load = src => new Promise((res, rej) => { const s = document.createElement("script"); s.src = src; s.onload = res; s.onerror = () => rej(new Error("load")); document.head.append(s); });
      const base = "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/";
      try { if (!window.pdfjsLib) await load(base + "pdf.min.js"); if (!window.pdfjsWorker) await load(base + "pdf.worker.min.js"); }
      catch { ready = null; throw new Error("The PDF reader didn't load. Check your connection and try again."); }
      for (let i = 0; i < 60 && !window.pdfjsLib; i++) await sleep(100);
      if (!window.pdfjsLib) throw new Error("The PDF reader didn't load. Check your connection and reload the page.");
      return window.pdfjsLib;
    })();
    return ready;
  }
  async function open(file) {
    const pdfjs = await lib();
    const buf = await file.arrayBuffer();
    const fp = await fingerprint(buf, file.name);
    const doc = await pdfjs.getDocument({ data: new Uint8Array(buf), isEvalSupported: false, disableFontFace: false }).promise;
    return { doc, fp, name: file.name, numPages: doc.numPages };
  }
  async function fingerprint(buf, name) {
    try {
      const head = buf.slice(0, Math.min(buf.byteLength, 262144));
      const d = await crypto.subtle.digest("SHA-256", head);
      return [...new Uint8Array(d)].slice(0, 10).map(b => b.toString(16).padStart(2, "0")).join("") + "-" + buf.byteLength;
    } catch { return name.replace(/[^\w]/g, "") + "-" + buf.byteLength; }
  }
  async function textPages(pdf, onProgress) {
    const pages = [];
    for (let i = 1; i <= pdf.doc.numPages; i++) {
      const p = await pdf.doc.getPage(i);
      const vp = p.getViewport({ scale: 1 });
      const tc = await p.getTextContent();
      pages.push({
        w: vp.width, h: vp.height,
        items: tc.items.filter(it => it.str && it.str.trim()).map(it => ({ s: it.str, x: it.transform[4], y: vp.height - it.transform[5], w: it.width, h: it.height || Math.abs(it.transform[3]) })),
      });
      onProgress?.(i, pdf.doc.numPages);
    }
    return pages;
  }
  const cache = new Map();
  async function render(pdf, pageIndex, width) {
    const key = pdf.fp + ":" + pageIndex + ":" + Math.round(width);
    if (cache.has(key)) return cache.get(key);
    const p = await pdf.doc.getPage(pageIndex + 1);
    const vp1 = p.getViewport({ scale: 1 });
    const scale = width / vp1.width;
    const vp = p.getViewport({ scale });
    const c = document.createElement("canvas");
    c.width = Math.round(vp.width); c.height = Math.round(vp.height);
    const ctx = c.getContext("2d");
    ctx.fillStyle = "#fff"; ctx.fillRect(0, 0, c.width, c.height);
    await p.render({ canvasContext: ctx, viewport: vp }).promise;
    if (cache.size > 40) cache.delete(cache.keys().next().value);
    cache.set(key, c);
    return c;
  }
  function rotate(canvas, deg) {
    deg = ((deg % 360) + 360) % 360;
    if (!deg) return canvas;
    const c = document.createElement("canvas");
    const swap = deg === 90 || deg === 270;
    c.width = swap ? canvas.height : canvas.width; c.height = swap ? canvas.width : canvas.height;
    const ctx = c.getContext("2d");
    ctx.translate(c.width / 2, c.height / 2); ctx.rotate(deg * Math.PI / 180);
    ctx.drawImage(canvas, -canvas.width / 2, -canvas.height / 2);
    return c;
  }
  function crop(canvas, fx, fy, fw, fh) {
    const x = clamp(fx, 0, 1) * canvas.width, y = clamp(fy, 0, 1) * canvas.height;
    const w = clamp(fw, 0.01, 1) * canvas.width, hh = clamp(fh, 0.01, 1) * canvas.height;
    const c = document.createElement("canvas");
    c.width = Math.round(w); c.height = Math.round(Math.min(hh, canvas.height - y));
    c.getContext("2d").drawImage(canvas, x, y, w, c.height, 0, 0, c.width, c.height);
    return c;
  }
  // A picture of one question, with English passage context to its left.
  async function questionImage(pdf, info, sec, n) {
    const b = info.boxes?.[sec]?.[n];
    if (!b) return null;
    const pc = await render(pdf, b.page, 1300);
    if (sec === "english") {
      const top = Math.max(0, b.y - 0.12), bottom = Math.min(1, b.y + b.h + 0.04);
      return crop(pc, 0, top, 1, bottom - top);
    }
    const top = Math.max(0, b.y - 0.01);
    return crop(pc, Math.max(0, b.x - 0.01), top, Math.min(1, b.w + 0.02), Math.min(1 - top, b.h + 0.02));
  }
  return { open, textPages, render, rotate, crop, questionImage, lib };
})();

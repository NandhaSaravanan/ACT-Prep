"right": "\"She\" could mean Ana or Rosa. Naming the person makes the meaning clear.", "wrong": ["\"She\" could point to either girl, so it's vague.", "\"They\" is plural, but only one person was excited.", "", "\"It\" doesn't refer to a person."]}, "id": "e0065", "checked": true, "by": "seed"}, {"section": "english", "topic": "e-pronoun", "stem": "The volunteers brought __his or her__ own tools to the cleanup.", "choices": ["NO CHANGE", "there", "their", "its"], "answer": 2, "rule": "A plural noun takes \"their\"", "explanation": {"right": "\"Volunteers\" is plural, so it takes the plural pronoun \"their.\"", "wrong": ["\"His or her\" is singular, but \"volunteers\" is plural.", "\"There\" is a place.", "", "\"Its\" is singular and doesn't refer to people."]}, "id": "e0066", "checked": true, "by": "seed"}, {"section": "english", "topic": "e-pronoun", "stem": "Each of the girls brought __their__ own racket to the tournament.", "choices": ["NO CHANGE", "her", "its", "they're"], "answer": 1, "rule": "A pronoun must match its noun in number", "explanation": {"right": "\"Each\" is singular, and the girls are known to be girls, so the pronoun is \"her.\"", "wrong": ["\"Their\" is plural, but \"each\" is singular.", "", "\"Its\" doesn't refer to a person.", "\"They're\" means \"they are.\""]}, "id": "e0067", "checked": true, "by": "seed"}, {"section": "english", "topic": "e-pronoun", "stem": "The woman __that__ won the marathon trained for two years.", "choices": ["NO CHANGE", "whom", "which", "who"], "answer": 3, "rule": "\"That\" never refers to people", "explanation": {"right": "\"The woman\" is a person, so the pronoun is \"who.\" It is the subject of \"won,\" so the subject form \"who\" is right, not \"whom.\"", "wrong": ["\"That\" doesn't refer to people. Use \"who\" or \"whom.\"", "\"Whom\" is an object pronoun, but here the pronoun is the subject of \"won.\"", "\"Which\" never refers to people.", ""]}, "id": "e0068", "checked": true, "by": "seed"}, {"section": "english", "topic": "e-verbs", "stem": "By noon, the race had __began__.", "choices": ["NO CHANGE", "beginning", "begun", "begin"], "answer": 2, "rule": "\"Had\" needs the past participle", "explanation": {"right": "A helper verb like \"had\" needs the past participle, \"begun.\" \"Had began\" is always wrong.", "wrong": ["\"Began\" is simple past and stands alone. It can't follow \"had.\"", "\"Had beginning\" isn't a verb form.", "", "\"Begin\" is present tense."]}, "id": "e0069", "checked": true, "by": "seed"}, {"section": "english", "topic": "e-verbs", "stem": "The book is __laying__ on the kitchen table.", "choices": ["NO CHANGE", "lain", "laid", "lying"], "answer": 3, "rule": "Lying means resting; laying means putting something down", "explanation": {"right": "The book is resting on the table. It isn't putting anything down, so \"lying\" is right.", "wrong": ["\"Laying\" means putting something down.", "\"Lain\" needs a helper like \"has.\"", "\"Laid\" means someone put it there and needs a different setup.", ""]}, "id": "e0070", "checked": true, "by": "seed"}, {"section": "english", "topic": "e-verbs", "stem": "If I had known about the party, I __would of__ come.", "choices": ["NO CHANGE", "would've had", "would have", "would had"], "answer": 2, "rule": "\"Would of\" is always wrong", "explanation": {"right": "The right form is \"would have.\" \"Would of\" comes from how the words sound out loud.", "wrong": ["\"Would of\" is always wrong.", "\"Would've had come\" adds an extra verb.", "", "\"Would had\" is not a verb form."]}, "id": "e0071", "checked": true, "by": "seed"}, {"section": "english", "topic": "e-verbs", "stem": "Last summer, we hiked the trail and __see__ a black bear.", "choices": ["NO CHANGE", "seen", "saw", "will see"], "answer": 2, "rule": "Keep tense consistent", "explanation": {"right": "\"Last summer\" and \"hiked\" are past tense. The second verb must match, so \"saw.\"", "wrong": ["\"See\" is present tense, but the rest of the sentence is past.", "\"Seen\" needs a helper like \"had.\"", "", "\"Will see\" is future tense."]}, "id": "e0072", "checked": true, "by": "seed"}, {"section": "english", "topic": "e-modifiers", "stem": "Walking to school, __the rain soaked my backpack__.", "choices": ["NO CHANGE", "the rain was soaking my backpack", "I got my backpack soaked by the rain", "my backpack was soaked by the rain"], "answer": 2, "rule": "An intro phrase describes whatever comes right after the comma", "explanation": {"right": "\"Walking to school\" describes the person walking. So the word right after the comma must be \"I.\"", "wrong": ["The rain wasn't walking to school.", "The rain still comes right after the comma.", "", "The backpack wasn't walking to school."]}, "id": "e0073", "checked": true, "by": "seed"}, {"section": "english", "topic": "e-modifiers", "stem": "Using a small telescope, __the moons of Jupiter were spotted by Galileo__.", "choices": ["NO CHANGE", "the moons were spotted by Galileo of Jupiter", "Jupiter's moons were spotted by Galileo", "Galileo spotted the moons of Jupiter"], "answer": 3, "rule": "An intro phrase describes whatever comes right after the comma", "explanation": {"right": "Galileo is the one using the telescope, so \"Galileo\" must come right after the comma.", "wrong": ["The moons weren't using a telescope.", "The moons still come right after the comma, and the order is confusing.", "Jupiter's moons weren't using a telescope.", ""]}, "id": "e0074", "checked": true, "by": "seed"}, {"section": "english", "topic": "e-modifiers", "stem": "Covered in mud, __the dog's owner washed him__ in the yard.", "choices": ["NO CHANGE", "the dog was washed by his owner", "the owner washed the dog", "the yard was where the dog was washed"], "answer": 1, "rule": "An intro phrase describes whatever comes right after the comma", "explanation": {"right": "The dog is the one covered in mud, so \"the dog\" must come right after the comma.", "wrong": ["This says the owner was covered in mud.", "", "This still says the owner was covered in mud.", "This says the yard was covered in mud."]}, "id": "e0075", "checked": true, "by": "seed"}, {"section": "english", "topic": "e-modifiers", "stem": "Excited about the trip, __the bags were packed by the family__ the night before.", "choices": ["NO CHANGE", "the bags got packed", "the family packed their bags", "packing the bags was done by the family"], "answer": 2, "rule": "An intro phrase describes whatever comes right after the comma", "explanation": {"right": "The family is excited, not the bags. So \"the family\" must come right after the comma.", "wrong": ["The bags weren't excited.", "The bags still come right after the comma.", "", "\"Packing\" can't be excited."]}, "id": "e0076", "checked": true, "by": "seed"}, {"section": "english", "topic": "e-parallel", "stem": "On weekends, I like hiking, swimming, and __to ride__ my bike.", "choices": ["NO CHANGE", "ride", "I ride", "riding"], "answer": 3, "rule": "Items in a list match in form", "explanation": {"right": "\"Hiking\" and \"swimming\" are -ing words, so the last item must be \"riding.\"", "wrong": ["\"To ride\" doesn't match \"hiking\" and \"swimming.\"", "\"Ride\" doesn't match the -ing form.", "\"I ride\" adds a subject and breaks the pattern.", ""]}, "id": "e0077", "checked": true, "by": "seed"}, {"section": "english", "topic": "e-parallel", "stem": "The coach told us to stretch, to drink water, and __getting__ enough sleep.", "choices": ["NO CHANGE", "to get", "got", "we get"], "answer": 1, "rule": "Items in a list match in form", "explanation": {"right": "The first two items are \"to stretch\" and \"to drink water,\" so the third must be \"to get.\"", "wrong": ["\"Getting\" doesn't match \"to stretch\" and \"to drink.\"", "", "\"Got\" is past tense and doesn't match.", "\"We get\" adds a subject and breaks the pattern."]}, "id": "e0078", "checked": true, "by": "seed"}, {"section": "english", "topic": "e-parallel", "stem": "The science program is not only fun but also __it teaches a lot__.", "choices": ["NO CHANGE", "teaching", "it is educational", "educational"], "answer": 3, "rule": "\"Not only X but also Y\": X and Y match in form", "explanation": {"right": "\"Fun\" is a describing word, so the part after \"but also\" must be one too: \"educational.\"", "wrong": ["A whole clause doesn't match the single word \"fun.\"", "\"Teaching\" is not a describing word like \"fun.\"", "A whole clause doesn't match \"fun.\"", ""]}, "id": "e0079", "checked": true, "by": "seed"}, {"section": "english", "topic": "e-parallel", "stem": "Swimming laps is as tiring as __to run__ a mile.", "choices": ["NO CHANGE", "ran", "you run", "running"], "answer": 3, "rule": "Comparisons stay balanced", "explanation": {"right": "\"Swimming laps\" is compared to running a mile. To keep the comparison balanced, use the same form: \"running.\"", "wrong": ["\"To run\" doesn't match \"swimming.\"", "\"Ran\" is past tense and doesn't match.", "\"You run\" adds a subject and breaks the balance.", ""]}, "id": "e0080", "checked": true, "by": "seed"}, {"section": "english", "topic": "e-words", "stem": "This checkout line is for customers with __less__ than ten items.", "choices": ["NO CHANGE", "littler", "fewer", "lesser"], "answer": 2, "rule": "Fewer is for things you can count", "explanation": {"right": "You can count items, so the right word is \"fewer.\"", "wrong": ["\"Less\" is for things you can't count.", "\"Littler\" is about size.", "", "\"Lesser\" means lower in quality or rank."]}, "id": "e0081", "checked": true, "by": "seed"}, {"section": "english", "topic": "e-words", "stem": "The new schedule had a big __affect__ on our sleep.", "choices": ["NO CHANGE", "effect", "affection", "effecting"], "answer": 1, "rule": "Affect is a verb; effect is a noun", "explanation": {"right": "After \"a big,\" you need a noun. \"Effect\" is the noun that means result.", "wrong": ["\"Affect\" is usually a verb.", "", "\"Affection\" means fondness.", "\"Effecting\" is a verb form."]}, "id": "e0082", "checked": true, "by": "seed"}, {"section": "english", "topic": "e-words", "stem": "My sister is taller __then__ our dad.", "choices": ["NO CHANGE", "as", "that", "than"], "answer": 3, "rule": "\"Than\" compares; \"then\" is about time", "explanation": {"right": "The sentence compares heights, so it needs \"than.\"", "wrong": ["\"Then\" is about time.", "\"Taller as\" is not standard English.", "\"That\" doesn't make a comparison.", ""]}, "id": "e0083", "checked": true, "by": "seed"}, {"section": "english", "topic": "e-words", "stem": "I __can't hardly__ wait for the concert.", "choices": ["NO CHANGE", "can't barely", "cannot hardly", "can hardly"], "answer": 3, "rule": "Hardly is already negative", "explanation": {"right": "\"Hardly\" is already negative. Adding \"can't\" makes a double negative. \"Can hardly wait\" is right.", "wrong": ["\"Can't hardly\" is a double negative.", "\"Can't barely\" is a double negative.", "\"Cannot hardly\" is a double negative.", ""]}, "id": "e0084", "checked": true, "by": "seed"}, {"section": "english", "topic": "e-transitions", "stem": "The trail was closed for repairs. __Therefore__, we took the road around the lake.", "choices": ["NO CHANGE", "In contrast", "However", "For example"], "answer": 0, "rule": "Read the sentence before and after; cause and effect takes \"therefore\"", "explanation": {"right": "The trail being closed caused the group to take the road. That is cause and effect, so \"therefore\" fits.", "wrong": ["", "There is no contrast between the sentences.", "\"However\" signals a contrast, but there isn't one.", "The second sentence isn't an example of the first."]}, "id": "e0085", "checked": true, "by": "seed"}, {"section": "english", "topic": "e-transitions", "stem": "Many people think owls see well in daylight. __Moreover__, most owls see best at night.", "choices": ["NO CHANGE", "As a result", "Similarly", "However"], "answer": 3, "rule": "Opposite ideas take a contrast word", "explanation": {"right": "The second sentence goes against what many people think. That is a contrast, so \"however\" fits.", "wrong": ["\"Moreover\" adds a similar idea, but these ideas are opposite.", "The first sentence doesn't cause the second.", "\"Similarly\" signals the same direction.", ""]}, "id": "e0086", "checked": true, "by": "seed"}, {"section": "english", "topic": "e-transitions", "stem": "Some birds travel huge distances. __However__, the Arctic tern flies from pole to pole each year.", "choices": ["NO CHANGE", "For example", "Instead", "Even so"], "answer": 1, "rule": "Use an example word when the second sentence gives an example", "explanation": {"right": "The Arctic tern is one bird that travels a huge distance. It's an example of the first sentence.", "wrong": ["\"However\" signals a contrast, but the sentences agree.", "", "\"Instead\" signals a replacement.", "\"Even so\" signals a contrast."]}, "id": "e0087", "checked": true, "by": "seed"}, {"section": "english", "topic": "e-transitions", "stem": "The library added more computers. __Instead__, it extended its weekend hours.", "choices": ["NO CHANGE", "In addition", "For instance", "Nevertheless"], "answer": 1, "rule": "Same direction takes an addition word", "explanation": {"right": "The second sentence adds another improvement. Both point the same direction, so \"in addition\" fits.", "wrong": ["\"Instead\" means the library did one thing in place of the other, but it did both.", "", "The longer hours aren't an example of adding computers.", "\"Nevertheless\" signals a contrast."]}, "id": "e0088", "checked": true, "by": "seed"}, {"section": "english", "topic": "e-transitions", "stem": "Ice is less dense than liquid water. __In other words__, ice floats.", "choices": ["NO CHANGE", "Similarly", "However", "As a result"], "answer": 3, "rule": "Cause and effect takes a result word", "explanation": {"right": "Ice floats because it's less dense. The first sentence causes the second, so \"as a result\" fits.", "wrong": ["\"In other words\" restates the same idea, but floating is a result, not a restatement.", "\"Similarly\" adds a parallel idea.", "\"However\" signals a contrast.", ""]}, "id": "e0089", "checked": true, "by": "seed"}, {"section": "english", "topic": "e-transitions", "stem": "Sea otters use rocks to crack open shells. __Similarly__, some birds drop shells on rocks to break them.", "choices": ["NO CHANGE", "Instead", "Therefore", "However"], "answer": 0, "rule": "Same direction takes an addition or comparison word", "explanation": {"right": "Both sentences show animals using rocks to open shells. \"Similarly\" signals a matching idea.", "wrong": ["", "\"Instead\" signals a replacement.", "The otters don't cause the birds' behavior.", "\"However\" signals a contrast."]}, "id": "e0090", "checked": true, "by": "seed"}, {"section": "english", "topic": "e-transitions", "stem": "The first design was too heavy to fly. __For example__, the engineers built a lighter frame from aluminum.", "choices": ["NO CHANGE", "Likewise", "As a result", "In contrast"], "answer": 2, "rule": "Cause and effect takes a result word", "explanation": {"right": "The heavy design caused the engineers to build a lighter frame. That's cause and effect.", "wrong": ["The lighter frame isn't an example of the design being heavy.", "\"Likewise\" signals a similar idea.", "", "\"In contrast\" signals opposite ideas."]}, "id": "e0091", "checked": true, "by": "seed"}, {"section": "english", "topic": "e-transitions", "stem": "Most deserts are hot. __In contrast__, Antarctica is a cold desert.", "choices": ["NO CHANGE", "For example", "Therefore", "Additionally"], "answer": 0, "rule": "Opposite ideas take a contrast word", "explanation": {"right": "Antarctica is cold, which is the opposite of most deserts. \"In contrast\" fits.", "wrong": ["", "Antarctica is not an example of a hot desert.", "Most deserts being hot doesn't cause Antarctica to be cold.", "\"Additionally\" adds a similar idea."]}, "id": "e0092", "checked": true, "by": "seed"}, {"section": "english", "topic": "e-rhetoric", "passage": "(1) Honeybees communicate by dancing. (2) A bee that finds food returns to the hive and moves in a figure eight. (3) The angle of the dance tells other bees which way to fly. (4) Honey has been found in ancient Egyptian tombs.", "stem": "The writer is considering deleting sentence 4. Should the sentence be kept or deleted?", "choices": ["Deleted, because it contradicts sentence 1.", "Deleted, because it moves away from the paragraph's focus on how bees communicate.", "Kept, because it adds an interesting fact about bees.", "Kept, because it shows that honey lasts a long time."], "answer": 1, "rule": "Keep a sentence only if it fits the paragraph's specific focus", "explanation": {"right": "The paragraph is about how bees communicate through dancing. A fact about honey in tombs doesn't fit that focus.", "wrong": ["Sentence 4 doesn't contradict anything. The reason has to match what the sentence actually does.", "", "The paragraph is about communication, not interesting facts in general.", "The fact may be true, but it doesn't fit the paragraph's focus."]}, "id": "e0093", "checked": true, "by": "seed"}, {"section": "english", "topic": "e-rhetoric", "passage": "Coach Rivera __watched the drills__.", "stem": "Which choice best shows that the coach was patient and methodical?", "choices": ["NO CHANGE", "shouted at us during the drills", "watched each drill, then calmly broke it into small steps for us", "ran the drills quickly so we could go home early"], "answer": 2, "rule": "Pick the choice that shows the exact goal words", "explanation": {"right": "The goal words are \"patient\" and \"methodical.\" Calmly breaking each drill into small steps shows both.", "wrong": ["Just watching doesn't show patience or method.", "Shouting isn't patient.", "", "Rushing isn't patient or methodical."]}, "id": "e0094", "checked": true, "by": "seed"}, {"section": "english", "topic": "e-rhetoric", "passage": "(1) The town built its first library in 1910. (2) It held only two hundred books. (3) Today, it holds more than fifty thousand. (4) These books were donated by local families.", "stem": "For the sake of logic, sentence 4 should be placed:", "choices": ["where it is now.", "after sentence 1.", "after sentence 2.", "before sentence 1."], "answer": 2, "rule": "Place a sentence right after what its key words point back to", "explanation": {"right": "\"These books\" points back to the two hundred books in sentence 2. So sentence 4 belongs right after sentence 2.", "wrong": ["Right now \"these books\" seems to mean the fifty thousand, which is not the point.", "Sentence 1 doesn't mention any books yet.", "", "Nothing before sentence 1 explains which books."]}, "id": "e0095", "checked": true, "by": "seed"}, {"section": "english", "topic": "e-rhetoric", "passage": "The essay describes one senator's childhood on a farm in Kansas.", "stem": "Suppose the writer's goal was to explain the steps a bill goes through to become a law. Would this essay fulfill that goal?", "choices": ["Yes, because it describes a senator.", "No, because it focuses on one senator's early life, not on how a bill becomes a law.", "No, because it argues that farms need more laws.", "Yes, because senators write bills."], "answer": 1, "rule": "For purpose questions, decide yes or no by what the essay spends most of its time on", "explanation": {"right": "The essay is about one senator's childhood. It never explains how bills become laws, so the answer is no, for that reason.", "wrong": ["Describing a senator is not the same as explaining how a bill becomes law.", "", "The essay doesn't argue about farm laws, so the reason isn't true.", "The essay doesn't explain the steps of passing a bill."]}, "id": "e0096", "checked": true, "by": "seed"}, {"section": "english", "topic": "e-rhetoric", "passage": "________ First, volunteers walk the beach at dawn to find nests. Then they mark each nest with stakes. Finally, they watch as the hatchlings crawl to the water.", "stem": "Which choice best introduces the paragraph?", "choices": ["Some volunteers also clean city parks.", "The beach is crowded in July.", "Sea turtles are reptiles.", "Every summer, volunteers protect sea turtle nests in three steps."], "answer": 3, "rule": "An intro sets up the paragraph's main point", "explanation": {"right": "The paragraph walks through three steps volunteers take to protect nests. This choice sets up exactly that.", "wrong": ["City parks are off topic.", "The crowded beach isn't the paragraph's point.", "This is true but doesn't set up the volunteers' steps.", ""]}, "id": "e0097", "checked": true, "by": "seed"}, {"section": "english", "topic": "e-rhetoric", "passage": "Many trees in the park, such as the red maple and the white oak, turn bright colors in October.", "stem": "If the writer deleted the phrase \"such as the red maple and the white oak,\" the sentence would mainly lose:", "choices": ["a contrast between two kinds of trees.", "the main idea of the paragraph.", "an explanation of why leaves change color.", "examples of the trees that change color."], "answer": 3, "rule": "Say what the part does, then match it", "explanation": {"right": "The phrase names two trees as examples of the trees that change color. That is what would be lost.", "wrong": ["The two trees aren't contrasted.", "The main idea is that trees turn colors, which stays.", "The phrase doesn't explain why leaves change.", ""]}, "id": "e0098", "checked": true, "by": "seed"}, {"section": "english", "topic": "e-rhetoric", "passage": "Our school used to throw away three hundred pounds of paper every week. Then the student council started a recycling program with bins in every classroom. ________", "stem": "Which choice best concludes the paragraph by tying back to its opening?", "choices": ["Paper is made from trees.", "Some students like art class more than math.", "Plastic is harder to recycle than paper.", "Now, thanks to the program, almost none of that paper ends up in the trash."], "answer": 3, "rule": "A conclusion ties back to the topic or the opening", "explanation": {"right": "The opening mentions the paper thrown away. This choice returns to that paper and shows the result of the program.", "wrong": ["This is a general fact that doesn't tie back.", "Class preferences are off topic.", "Plastic is off topic.", ""]}, "id": "e0099", "checked": true, "by": "seed"}, {"section": "english", "topic": "e-rhetoric", "passage": "(1) Next, she sanded off the old paint. (2) Last summer, Grandma decided to restore an old rocking chair. (3) Finally, she painted it bright blue.", "stem": "Which order makes the paragraph most logical?", "choices": ["1, 2, 3", "2, 1, 3", "3, 2, 1", "2, 3, 1"], "answer": 1, "rule": "Find the sentence that must come first and the one that must come last", "explanation": {"right": "Sentence 2 introduces Grandma and the chair, so it comes first. \"Next\" follows, and \"Finally\" comes last.", "wrong": ["Sentence 1 starts with \"Next,\" so it can't come first.", "", "\"Finally\" can't come first.", "\"Finally\" can't come before \"Next.\""]}, "id": "e0100", "checked": true, "by": "seed"}, {"section": "english", "topic": "e-join", "stem": "The storm knocked out the __power, we__ played board games by candlelight.", "choices": ["NO CHANGE", "power, so we", "power; so we", "power we"], "answer": 1, "rule": "Comma plus FANBOYS joins two complete sentences", "explanation": {"right": "Both parts are complete sentences. A comma plus \"so\" joins them, and \"so\" shows the cause and effect.", "wrong": ["A comma alone between two complete sentences is a comma splice.", "", "A semicolon never comes right before a FANBOYS word.", "No punctuation between two complete sentences is a run on."], "marks": [{"mark": ",", "why": "Goes right before \"so,\" which joins two complete sentences."}]}, "id": "e0101", "checked": true, "by": "seed"}, {"section": "english", "topic": "e-join", "stem": "Ella wanted to join the debate __team, but she__ had practice every afternoon.", "choices": ["NO CHANGE", "team but she", "team; but she", "team but, she"], "answer": 0, "rule": "Comma plus FANBOYS joins two complete sentences", "explanation": {"right": "\"Ella wanted to join the debate team\" and \"she had practice every afternoon\" are complete sentences. A comma before \"but\" joins them.", "wrong": ["", "Two complete sentences joined by \"but\" need a comma before \"but.\"", "A semicolon never comes right before a FANBOYS word.", "The comma goes before \"but,\" not after it."], "marks": [{"mark": ",", "why": "Goes right before \"but,\" which joins two complete sentences."}]}, "id": "e0102", "checked": true, "by": "seed"}, {"section": "english", "topic": "e-join", "stem": "Our flight was delayed three __hours. Therefore, we__ missed the connecting flight.", "choices": ["NO CHANGE", "hours, therefore, we", "hours, therefore we", "hours therefore we"], "answer": 0, "rule": "\"Therefore\" between two sentences needs a period or semicolon before it", "explanation": {"right": "\"Therefore\" is not a FANBOYS word. When it joins two complete sentences, a period or semicolon goes before it and a comma after it.", "wrong": ["", "Commas alone can't join two complete sentences, even with \"therefore.\" This is a comma splice.", "A comma before \"therefore\" still makes a comma splice.", "No punctuation between two complete sentences is a run on."], "marks": [{"mark": ".", "why": "Ends the first complete sentence."}, {"mark": ",", "why": "Sets off \"Therefore\" at the start of the second sentence."}]}, "id": "e0103", "checked": true, "by": "seed"}, {"section": "english", "topic": "e-join", "stem": "The tomatoes grew quickly in the warm __weather; the__ peppers took much longer.", "choices": ["NO CHANGE", "weather the", "weather; and the", "weather, the"], "answer": 0, "rule": "A semicolon joins two complete sentences", "explanation": {"right": "Both sides of the semicolon can stand alone, so the semicolon works.", "wrong": ["", "No punctuation between two complete sentences is a run on.", "A semicolon never comes right before a FANBOYS word.", "A comma alone between two complete sentences is a comma splice."], "marks": [{"mark": ";", "why": "Joins two complete sentences."}]}, "id": "e0104", "checked": true, "by": "seed"}, {"section": "english", "topic": "e-join", "stem": "Which choice would NOT be acceptable? The play sold out on opening __night. The__ cast added a second show.", "choices": ["night, the", "night, and the", "night, so the", "night; the"], "answer": 0, "rule": "A comma alone between two complete sentences is a comma splice", "explanation": {"right": "Both parts are complete sentences. A comma with no FANBOYS word can't join them, so this choice is the one that does NOT work.", "wrong": ["", "A comma plus \"and\" can join two complete sentences.", "A comma plus \"so\" can join two complete sentences.", "A semicolon can join two complete sentences."]}, "id": "e0105", "checked": true, "by": "seed"}, {"section": "english", "topic": "e-join", "stem": "__Since Leo practiced every day. He__ made the varsity team.", "choices": ["NO CHANGE", "Since Leo practiced every day; he", "Since Leo practiced every day, he", "Since, Leo practiced every day, he"], "answer": 2, "rule": "A dependent clause can't stand alone as a sentence", "explanation": {"right": "\"Since Leo practiced every day\" can't stand alone. It's an intro clause, so a comma connects it to the main sentence.", "wrong": ["The period leaves \"Since Leo practiced every day\" as a fragment.", "A semicolon needs complete sentences on both sides.", "", "No comma goes inside the intro clause after \"Since.\""], "marks": [{"mark": ",", "why": "Ends the intro clause right before the main subject \"he.\""}]}, "id": "e0106", "checked": true, "by": "seed"}, {"section": "english", "topic": "e-semicolon", "stem": "The museum as", "have been", "are"], "answer": 1, "rule": "With \"neither...nor,\" the verb matches the closer subject", "explanation": {"right": "The subject closest to the verb is \"coach,\" which is singular. So the verb is \"was.\"", "wrong": ["\"Were\" is plural, but the closer subject \"coach\" is singular.", "", "\"Have\" is plural.", "\"Are\" is plural and the wrong tense."]}, "id": "e0146", "checked": true, "by": "seed"}, {"section": "english", "topic": "e-agree", "stem": "The results of the survey __shows__ that most students like the new schedule.", "choices": ["NO CHANGE", "has shown", "is showing", "show"], "answer": 3, "rule": "Find the real subject and ignore phrases in between", "explanation": {"right": "The subject is \"results,\" which is plural. \"Of the survey\" is in between. So the verb is \"show.\"", "wrong": ["\"Shows\" is singular.", "\"Has\" is singular.", "\"Is\" is singular.", ""]}, "id": "e0147", "checked": true, "by": "seed"}, {"section": "english", "topic": "e-agree", "stem": "Everyone on the two teams __have__ a uniform.", "choices": ["NO CHANGE", "were having", "are having", "has"], "answer": 3, "rule": "\"Everyone\" is singular", "explanation": {"right": "\"Everyone\" is singular, even though it refers to many people. So the verb is \"has.\"", "wrong": ["\"Have\" is plural.", "\"Were\" is plural.", "\"Are\" is plural.", ""]}, "id": "e0148", "checked": true, "by": "seed"}, {"section": "english", "topic": "e-agree", "stem": "The bread and the cheese __was__ on the table.", "choices": ["NO CHANGE", "has been", "is", "were"], "answer": 3, "rule": "Two subjects joined by \"and\" take a plural verb", "explanation": {"right": "\"The bread and the cheese\" are two things joined by \"and,\" so the verb is plural: \"were.\"", "wrong": ["\"Was\" is singular.", "\"Has\" is singular.", "\"Is\" is singular and the wrong tense.", ""]}, "id": "e0149", "checked": true, "by": "seed"}, {"section": "english", "topic": "e-pronoun", "stem": "The team celebrated __their__ first win of the season. (The writer treats \"team\" as one group.)", "choices": ["NO CHANGE", "there", "it's", "its"], "answer": 3, "rule": "A pronoun must match its noun in number", "explanation": {"right": "Treated as one group, \"team\" is singular, so it takes \"its.\"", "wrong": ["\"Their\" is plural.", "\"There\" is a place.", "\"It's\" means \"it is.\"", ""]}, "id": "e0150", "checked": true, "by": "seed"}, {"section": "english", "topic": "e-pronoun", "stem": "Between you and __I__, the movie was too long.", "choices": ["NO CHANGE", "myself", "we", "me"], "answer": 3, "rule": "Use object pronouns after a preposition", "explanation": {"right": "\"Between\" is a preposition, so it takes the object form \"me.\"", "wrong": ["\"I\" is a subject pronoun.", "\"Myself\" is only for actions you do to yourself.", "\"We\" is a subject pronoun.", ""]}, "id": "e0151", "checked": true, "by": "seed"}, {"section": "english", "topic": "e-pronoun", "stem": "__Whom__ left the lights on in the gym?", "choices": ["NO CHANGE", "Which", "Who", "Whose"], "answer": 2, "rule": "\"Who\" is the subject form", "explanation": {"right": "The pronoun is the subject of \"left,\" so the subject form \"who\" is right.", "wrong": ["\"Whom\" is an object pronoun.", "\"Which\" doesn't refer to people.", "", "\"Whose\" shows ownership."]}, "id": "e0152", "checked": true, "by": "seed"}, {"section": "english", "topic": "e-pronoun", "stem": "My brother and __me__ built a treehouse last summer.", "choices": ["NO CHANGE", "us", "myself", "I"], "answer": 3, "rule": "Use subject pronouns for the subject", "explanation": {"right": "Drop \"my brother\" to test: \"I built a treehouse,\" not \"me built.\" So \"I\" is right.", "wrong": ["\"Me\" is an object pronoun.", "\"Us\" is plural and an object pronoun.", "\"Myself\" isn't used as a subject.", ""]}, "id": "e0153", "checked": true, "by": "seed"}, {"section": "english", "topic": "e-pronoun", "stem": "When the mayor met the reporter, __he__ asked about the new bridge.", "choices": ["NO CHANGE", "the reporter", "they", "it"], "answer": 1, "rule": "Vague pronouns lose; name the noun", "explanation": {"right": "\"He\" could mean the mayor or the reporter. Naming the person makes the meaning clear.", "wrong": ["\"He\" is vague. It could point to either person.", "", "\"They\" is plural.", "\"It\" doesn't refer to a person."]}, "id": "e0154", "checked": true, "by": "seed"}, {"section": "english", "topic": "e-pronoun", "stem": "The museum gave a prize to every student __who__ entered the contest.", "choices": ["NO CHANGE", "which", "whom", "whose"], "answer": 0, "rule": "\"Who\" is the subject form", "explanation": {"right": "The pronoun is the subject of \"entered,\" so \"who\" is right.", "wrong": ["", "\"Which\" doesn't refer to people.", "\"Whom\" is an object pronoun.", "\"Whose\" shows ownership."]}, "id": "e0155", "checked": true, "by": "seed"}, {"section": "english", "topic": "e-verbs", "stem": "By the time we arrived, the movie had already __began__.", "choices": ["NO CHANGE", "begin", "begun", "begins"], "answer": 2, "rule": "\"Had\" needs the past participle", "explanation": {"right": "After the helper \"had,\" use the past participle \"begun.\"", "wrong": ["\"Had began\" is always wrong.", "\"Begin\" is present tense.", "", "\"Begins\" is present tense."]}, "id": "e0156", "checked": true, "by": "seed"}, {"section": "english", "topic": "e-verbs", "stem": "She has __swam__ in the ocean every summer since she was six.", "choices": ["NO CHANGE", "swimmed", "swum", "swim"], "answer": 2, "rule": "\"Has\" needs the past participle", "explanation": {"right": "After the helper \"has,\" use the past participle \"swum.\"", "wrong": ["\"Swam\" is simple past and stands alone.", "\"Swimmed\" isn't a word.", "", "\"Swim\" is present tense."]}, "id": "e0157", "checked": true, "by": "seed"}, {"section": "english", "topic": "e-verbs", "stem": "Please __lay__ down on the couch if you feel dizzy.", "choices": ["NO CHANGE", "laid", "lie", "lain"], "answer": 2, "rule": "Lying means resting; laying means putting something down", "explanation": {"right": "The person is resting, not putting something down, so \"lie\" is right.", "wrong": ["\"Lay\" means to put something down.", "\"Laid\" is the past of \"lay.\"", "", "\"Lain\" needs a helper like \"have.\""]}, "id": "e0158", "checked": true, "by": "seed"}, {"section": "english", "topic": "e-verbs", "stem": "In 1969, astronauts __walk__ on the moon for the first time.", "choices": ["NO CHANGE", "walked", "have walked", "will walk"], "answer": 1, "rule": "Keep tense consistent with the time", "explanation": {"right": "\"In 1969\" is in the past, so the verb is past tense: \"walked.\"", "wrong": ["\"Walk\" is present tense.", "", "\"Have walked\" doesn't fit a single past date.", "\"Will walk\" is future."]}, "id": "e0159", "checked": true, "by": "seed"}, {"section": "english", "topic": "e-modifiers", "stem": "Running for the bus, __my phone fell out of my pocket__.", "choices": ["NO CHANGE", "I dropped my phone", "the bus left without my phone", "my pocket lost my phone"], "answer": 1, "rule": "An intro phrase describes whatever comes right after the comma", "explanation": {"right": "The person was running, so \"I\" must come right after the comma.", "wrong": ["The phone wasn't running.", "", "The bus wasn't running for itself.", "The pocket wasn't running."]}, "id": "e0160", "checked": true, "by": "seed"}, {"section": "english", "topic": "e-modifiers", "stem": "Baked fresh every morning, __customers line up for the bakery's bread__.", "choices": ["NO CHANGE", "the bakery's bread draws a line of customers", "the bakery has customers in line", "lines form for customers"], "answer": 1, "rule": "An intro phrase describes whatever comes right after the comma", "explanation": {"right": "The bread is baked fresh, so \"the bakery's bread\" must come right after the comma.", "wrong": ["Customers aren't baked fresh.", "", "The bakery isn't baked.", "Lines aren't baked."]}, "id": "e0161", "checked": true, "by": "seed"}, {"section": "english", "topic": "e-modifiers", "stem": "The teacher handed out tests to the students __covered in red ink__.", "choices": ["NO CHANGE", ", covered in red ink,", "The teacher handed out tests covered in red ink to the students.", "that were covered in red ink"], "answer": 2, "rule": "Put describing words next to what they describe", "explanation": {"right": "The tests were covered in red ink, not the students. Moving the phrase next to \"tests\" fixes it.", "wrong": ["This says the students were covered in red ink.", "The commas still leave it next to \"students.\"", "", "This still sits next to \"students.\""]}, "id": "e0162", "checked": true, "by": "seed"}, {"section": "english", "topic": "e-modifiers", "stem": "Nervous about the speech, __Kai's hands shook__.", "choices": ["NO CHANGE", "Kai felt his hands shake", "the speech made Kai's hands shake", "shaking happened to Kai's hands"], "answer": 1, "rule": "An intro phrase describes whatever comes right after the comma", "explanation": {"right": "Kai is nervous, so \"Kai\" must come right after the comma.", "wrong": ["Kai's hands aren't nervous. Kai is.", "", "The speech isn't nervous.", "\"Shaking\" isn't nervous."]}, "id": "e0163", "checked": true, "by": "seed"}, {"section": "english", "topic": "e-parallel", "stem": "The camp offers swimming, hiking, and __you can canoe__.", "choices": ["NO CHANGE", "canoe", "to canoe", "canoeing"], "answer": 3, "rule": "Items in a list match in form", "explanation": {"right": "\"Swimming\" and \"hiking\" are -ing words, so the third item is \"canoeing.\"", "wrong": ["A clause doesn't match the -ing pattern.", "\"Canoe\" doesn't match.", "\"To canoe\" doesn't match.", ""]}, "id": "e0164", "checked": true, "by": "seed"}, {"section": "english", "topic": "e-parallel", "stem": "She would rather walk to school than __riding__ the bus.", "choices": ["NO CHANGE", "to ride", "rides", "ride"], "answer": 3, "rule": "Comparisons stay balanced", "explanation": {"right": "\"Walk\" is the base form, so the other side of \"than\" is \"ride.\"", "wrong": ["\"Riding\" doesn't match \"walk.\"", "\"To ride\" doesn't match \"walk.\"", "\"Rides\" doesn't match \"walk.\"", ""]}, "id": "e0165", "checked": true, "by": "seed"}, {"section": "english", "topic": "e-parallel", "stem": "The job requires both patience and __being careful__.", "choices": ["NO CHANGE", "careful", "care", "to be careful"], "answer": 2, "rule": "\"Both X and Y\": X and Y match in form", "explanation": {"right": "\"Patience\" is a noun, so the other item must be a noun: \"care.\"", "wrong": ["\"Being careful\" doesn't match the noun \"patience.\"", "\"Careful\" is a describing word, not a noun.", "", "\"To be careful\" doesn't match."]}, "id": "e0166", "checked": true, "by": "seed"}, {"section": "english", "topic": "e-parallel", "stem": "The coach praised the team for its speed, its teamwork, and __how strong it was__.", "choices": ["NO CHANGE", "being strong", "its strength", "strongly"], "answer": 2, "rule": "Items in a list match in form", "explanation": {"right": "The first two items are \"its speed\" and \"its teamwork,\" so the third is \"its strength.\"", "wrong": ["A clause doesn't match \"its speed\" and \"its teamwork.\"", "\"Being strong\" doesn't match.", "", "\"Strongly\" is an adverb and doesn't match."]}, "id": "e0167", "checked": true, "by": "seed"}, {"section": "english", "topic": "e-words", "stem": "The __amount__ of students in the club doubled this year.", "choices": ["NO CHANGE", "numbers", "amounts", "number"], "answer": 3, "rule": "\"Number\" is for things you can count", "explanation": {"right": "Students can be counted, so \"number\" is right.", "wrong": ["\"Amount\" is for things you can't count.", "\"Numbers\" doesn't fit \"of students\" here.", "\"Amounts\" is still for things you can't count.", ""]}, "id": "e0168", "checked": true, "by": "seed"}, {"section": "english", "topic": "e-words", "stem": "The cold weather didn't __effect__ the outdoor concert.", "choices": ["NO CHANGE", "effects", "affects", "affect"], "answer": 3, "rule": "\"Affect\" is a verb", "explanation": {"right": "After \"didn't,\" you need a verb. \"Affect\" is the verb that means to influence.", "wrong": ["\"Effect\" is usually a noun.", "\"Effects\" is a noun.", "\"Affects\" doesn't fit after \"didn't.\"", ""]}, "id": "e0169", "checked": true, "by": "seed"}, {"section": "english", "topic": "e-words", "stem": "The city wants to __rise__ money for a new library.", "choices": ["NO CHANGE", "risen", "raise", "rising"], "answer": 2, "rule": "\"Raise\" lifts something; \"rise\" goes up by itself", "explanation": {"right": "The city is lifting the amount of money, so \"raise\" is right.", "wrong": ["\"Rise\" can't take an object like \"money.\"", "\"Risen\" doesn't fit after \"to.\"", "", "\"Rising\" doesn't fit after \"to.\""]}, "id": "e0170", "checked": true, "by": "seed"}, {"section": "english", "topic": "e-words", "stem": "According __with__ the forecast, it will snow tonight.", "choices": ["NO CHANGE", "to", "by", "from"], "answer": 1, "rule": "Idioms: \"according to\"", "explanation": {"right": "The correct phrase is \"according to.\"", "wrong": ["\"According with\" isn't standard English.", "", "\"According by\" isn't standard.", "\"According from\" isn't standard."]}, "id": "e0171", "checked": true, "by": "seed"}, {"section": "english", "topic": "e-transitions", "stem": "The first draft was messy. __Nevertheless__, it had some strong ideas.", "choices": ["NO CHANGE", "Similarly", "For example", "Therefore"], "answer": 0, "rule": "Opposite ideas take a contrast word", "explanation": {"right": "Being messy and having strong ideas point in different directions. \"Nevertheless\" shows that contrast.", "wrong": ["", "\"Similarly\" shows a matching idea.", "Strong ideas aren't an example of a mess.", "The mess didn't cause the strong ideas."]}, "id": "e0172", "checked": true, "by": "seed"}, {"section": "english", "topic": "e-transitions", "stem": "Bats eat many insects. __In fact__, a single bat can eat a thousand mosquitoes in an hour.", "choices": ["NO CHANGE", "Instead", "However", "Otherwise"], "answer": 0, "rule": "Same direction takes an addition or emphasis word", "explanation": {"right": "The second sentence backs up the first with a striking detail. \"In fact\" adds emphasis in the same direction.", "wrong": ["", "\"Instead\" shows a replacement.", "\"However\" shows a contrast.", "\"Otherwise\" shows an alternative."]}, "id": "e0173", "checked": true, "by": "seed"}, {"section": "english", "topic": "e-transitions", "stem": "The bridge needed repairs. __Meanwhile__, it was closed for six months.", "choices": ["NO CHANGE", "As a result", "For instance", "In contrast"], "answer": 1, "rule": "Cause and effect takes a result word", "explanation": {"right": "The repairs caused the bridge to close. \"As a result\" shows cause and effect.", "wrong": ["\"Meanwhile\" means at the same time, but the closing was caused by the repairs.", "", "The closing isn't an example of repairs.", "There's no contrast."]}, "id": "e0174", "checked": true, "by": "seed"}, {"section": "english", "topic": "e-transitions", "stem": "Some plants need full sun. __Ferns, however,__ grow best in shade.", "choices": ["NO CHANGE", "Ferns, likewise,", "Ferns, for example,", "Ferns, therefore,"], "answer": 0, "rule": "Opposite ideas take a contrast word", "explanation": {"right": "Ferns grow in shade, which is the opposite of plants that need full sun.", "wrong": ["", "\"Likewise\" shows a matching idea.", "Ferns aren't an example of sun plants.", "Sun plants don't cause ferns to like shade."]}, "id": "e0175", "checked": true, "by": "seed"}, {"section": "english", "topic": "e-transitions", "stem": "The school started a recycling program. __Additionally__, it added solar panels to the roof.", "choices": ["NO CHANGE", "Therefore", "Instead", "However"], "answer": 0, "rule": "Same direction takes an addition word", "explanation": {"right": "Both sentences describe green steps the school took. \"Additionally\" adds another one.", "wrong": ["", "The recycling didn't cause the panels.", "\"Instead\" means one replaced the other.", "There's no contrast."]}, "id": "e0176", "checked": true, "by": "seed"}, {"section": "english", "topic": "e-transitions", "stem": "Maya studied for weeks. __Consequently__, she was nervous the morning of the test.", "choices": ["NO CHANGE", "As a result", "For example", "Even so"], "answer": 3, "rule": "Read the sentence before and after", "explanation": {"right": "Studying for weeks would make you expect her to feel ready. Being nervous goes against that, so \"Even so\" fits.", "wrong": ["Studying didn't cause her nerves.", "Studying didn't cause her nerves.", "Being nervous isn't an example of studying.", ""]}, "id": "e0177", "checked": true, "by": "seed"}, {"section": "english", "topic": "e-rhetoric", "passage": "The writer wants to add a sentence that shows how the town changed after the factory closed.", "stem": "Which choice best accomplishes this goal?", "choices": ["Many people liked the factory's red brick.", "Factories make many kinds of products.", "Within two years, half the shops on Main Street had shut their doors.", "The factory was built in 1920."], "answer": 2, "rule": "Pick the choice that hits the exact goal", "explanation": {"right": "The goal is to show how the town changed after the closing. Shops shutting down shows that change.", "wrong": ["This is about the building's look.", "This is a general fact, off goal.", "", "This is about the factory's past, not the change."]}, "id": "e0178", "checked": true, "by": "seed"}, {"section": "english", "topic": "e-rhetoric", "passage": "(1) Ava loved the night sky. (2) She saved for a year to buy a telescope. (3) The first night she used it, she saw Saturn's rings. (4) Telescopes come in many sizes.", "stem": "The writer is considering deleting sentence 4. Should it be kept or deleted?", "choices": ["Deleted, because it repeats sentence 2.", "Deleted, because it is a general fact that moves away from Ava's story.", "Kept, because it explains how telescopes work.", "Kept, because it adds detail about Ava."], "answer": 1, "rule": "Keep a sentence only if it fits the paragraph's specific focus", "explanation": {"right": "The paragraph tells Ava's story. A general fact about telescope sizes doesn't fit that focus.", "wrong": ["It doesn't repeat sentence 2.", "", "It doesn't explain how telescopes work.", "It isn't about Ava."]}, "id": "e0179", "checked": true, "by": "seed"}, {"section": "english", "topic": "e-rhetoric", "passage": "The essay is about how one teacher started a free tutoring program at her school.", "stem": "Suppose the writer's goal was to write an essay about a person who made a difference in her community. Would this essay fulfill that goal?", "choices": ["No, because it focuses on many teachers.", "Yes, because it shows how one teacher helped students at her school.", "Yes, because it explains how schools are funded.", "No, because it is about tutoring."], "answer": 1, "rule": "For purpose questions, check what the essay spends its time on, then check the reason", "explanation": {"right": "The essay is about one person starting a program that helped others, so it fits. The reason matches what the essay does.", "wrong": ["The essay focuses on one teacher.", "", "The essay isn't about funding.", "Tutoring is how she made a difference, so this reason is wrong."]}, "id": "e0180", "checked": true, "by": "seed"}, {"section": "english", "topic": "e-rhetoric", "passage": "(1) The festival starts at noon. (2) First, local bands play on the main stage. (3) By evening, food trucks line the street. (4) The day ends with fireworks over the lake.", "stem": "The writer wants to add this sentence: \"These bands come from towns all over the county.\" It should go after sentence:", "choices": ["1.", "2.", "3.", "4."], "answer": 1, "rule": "Place a sentence right after what its key words point back to", "explanation": {"right": "\"These bands\" points back to the bands in sentence 2, so the new sentence goes right after it.", "wrong": ["Sentence 1 doesn't mention bands.", "", "Sentence 3 is about food trucks.", "Sentence 4 is about fireworks."]}, "id": "e0181", "checked": true, "by": "seed"}, {"section": "english", "topic": "e-rhetoric", "passage": "Coach Patel spoke softly, but every player __listened__.", "stem": "Which choice best shows how strongly the players respected the coach?", "choices": ["NO CHANGE", "heard something", "stood around", "leaned in, silent, to catch each word"], "answer": 3, "rule": "Pick the choice that hits the exact goal", "explanation": {"right": "Leaning in, silent, to catch every word shows deep respect. The other choices are flat or vague.", "wrong": ["\"Listened\" is accurate but doesn't show strong respect.", "\"Heard something\" is vague.", "\"Stood around\" suggests the opposite.", ""]}, "id": "e0182", "checked": true, "by": "seed"}, {"section": "english", "topic": "e-rhetoric", "passage": "The essay is written in a formal tone. One sentence reads: \"The experiment __kind of flopped__ because the samples were too warm.\"", "stem": "Which choice best matches the tone of the essay?", "choices": ["NO CHANGE", "went sideways", "was a total bust", "failed"], "answer": 3, "rule": "Tone and style: match the essay's register", "explanation": {"right": "The essay is formal, so the plain, formal \"failed\" fits best.", "wrong": ["\"Kind of flopped\" is slang.", "\"Went sideways\" is slang.", "\"A total bust\" is slang.", ""]}, "id": "e0183", "checked": true, "by": "seed"}, {"section": "math", "topic": "m-percent", "stem": "A jacket that costs $80 is on sale for 25% off. What is the sale price?", "choices": ["$20", "$55", "$60", "$65"], "answer": 2, "rule": "Percent off means multiply by 1 minus the percent", "explanation": {"right": "25% off leaves 75% of the price. 0.75 × 80 = 60.", "wrong": ["$20 is the discount, not the sale price.", "This takes off $25, not 25%.", "", "This takes off only $15."]}, "id": "m0001", "checked": true, "by": "seed"}, {"section": "math", "topic": "m-percent", "stem": "A store raises a price by 20%, then lowers the new price by 20%. Compared with the original price, the final price is:", "choices": ["the same.", "2% lower.", "4% lower.", "4% higher."], "answer": 2, "rule": "Percent of a percent: multiply the factors", "explanation": {"right": "Multiply the factors: 1.20 × 0.80 = 0.96. The final price is 96% of the original, which is 4% lower.", "wrong": ["The 20% cut is taken from a bigger number, so the changes don't cancel.", "Multiplying gives 0.96, a 4% drop, not 2%.", "", "The final price is lower, not higher."]}, "id": "m0002", "checked": true, "by": "seed"}, {"section": "math", "topic": "m-percent", "stem": "In a class of 40 students, the ratio of boys to girls is 3:5. How many girls are in the class?", "choices": ["15", "24", "25", "30"], "answer": 2, "rule": "Ratios: scale both parts by the same number", "explanation": {"right": "3 + 5 = 8 parts. 40 ÷ 8 = 5 students per part. Girls are 5 parts, so 5 × 5 = 25.", "wrong": ["15 is the number of boys.", "24 comes from 3 × 8, which mixes up the parts.", "", "30 doesn't fit the ratio. Boys would be 10, giving 10:30 = 1:3."]}, "id": "m0003", "checked": true, "by": "seed"}, {"section": "math", "topic": "m-percent", "stem": "The number of members in a club grew from 50 to 65. What was the percent increase?", "choices": ["15%", "23%", "30%", "35%"], "answer": 2, "rule": "Percent change = (new − old) / old × 100", "explanation": {"right": "The change is 65 − 50 = 15. Divide by the old value: 15 / 50 = 0.30, so 30%.", "wrong": ["15 is the change in members, not the percent.", "This divides by the new value, 65, instead of the old value.", "", "This doesn't match (65 − 50) / 50."]}, "id": "m0004", "checked": true, "by": "seed"}, {"section": "math", "topic": "m-percent", "stem": "18 is what percent of 72?", "choices": ["4%", "18%", "25%", "40%"], "answer": 2, "rule": "Part = percent × whole", "explanation": {"right": "18 / 72 = 0.25, which is 25%.", "wrong": ["This flips the division: 72 / 18 = 4.", "18 is the part, not the percent.", "", "This doesn't match 18 / 72."]}, "id": "m0005", "checked": true, "by": "seed"}, {"section": "math", "topic": "m-percent", "stem": "A recipe uses 2 cups of flour for every 3 cups of milk. How many cups of flour are needed for 9 cups of milk?", "choices": ["4", "6", "8", "13.5"], "answer": 1, "rule": "Ratios: cross multiply", "explanation": {"right": "Set up 2/3 = x/9. Cross multiply: 3x = 18, so x = 6.", "wrong": ["This adds 2 instead of scaling.", "", "This adds the difference wrong.", "This flips the ratio: 9 × 3/2."]}, "id": "m0006", "checked": true, "by": "seed"}, {"section": "math", "topic": "m-linear", "stem": "If 3x − 7 = 11, what is x?", "choices": ["4/3", "4", "6", "18"], "answer": 2, "rule": "Undo operations on both sides", "explanation": {"right": "Add 7 to both sides: 3x = 18. Divide by 3: x = 6.", "wrong": ["This subtracts 7 instead of adding it: 3x = 4.", "This doesn't come from 3x = 18.", "", "18 is 3x, not x."]}, "id": "m0007", "checked": true, "by": "seed"}, {"section": "math", "topic": "m-linear", "stem": "Which inequality is equivalent to −2x + 5 > 13?", "choices": ["x > −4", "x > 4", "x < −4", "x < 4"], "answer": 2, "rule": "Flip the inequality when you divide by a negative", "explanation": {"right": "Subtract 5: −2x > 8. Divide by −2 and flip the sign: x < −4.", "wrong": ["The sign must flip when dividing by −2.", "This forgets the negative and the flip.", "", "This loses the negative sign."]}, "id": "m0008", "checked": true, "by": "seed"}, {"section": "math", "topic": "m-linear", "stem": "What value of x solves 5(x − 2) = 3x + 4?", "choices": ["−7", "1", "3", "7"], "answer": 3, "rule": "Distribute, then solve", "explanation": {"right": "Distribute: 5x − 10 = 3x + 4. Subtract 3x: 2x − 10 = 4. Add 10: 2x = 14, so x = 7.", "wrong": ["The sign is wrong. Check: 5(−9) ≠ −17.", "This mixes up signs when moving terms.", "This forgets to distribute the 5 to the 2.", ""]}, "id": "m0009", "checked": true, "by": "seed"}, {"section": "math", "topic": "m-linear", "stem": "A plumber charges a $45 visit fee plus $30 per hour. A bill was $165. How many hours did the plumber work?", "choices": ["3", "4", "5.5", "6"], "answer": 1, "rule": "Set up a linear equation and solve", "explanation": {"right": "45 + 30h = 165. Subtract 45: 30h = 120. Divide: h = 4.", "wrong": ["3 hours would cost 45 + 90 = 135.", "", "This divides 165 by 30 and ignores the fee.", "6 hours would cost 45 + 180 = 225."]}, "id": "m0010", "checked": true, "by": "seed"}, {"section": "math", "topic": "m-linear", "stem": "If 2a + b = 10 and b = 4, what is a?", "choices": ["2", "3", "6", "7"], "answer": 1, "rule": "Substitute, then solve", "explanation": {"right": "Replace b with 4: 2a + 4 = 10. So 2a = 6 and a = 3.", "wrong": ["This doesn't match 2a = 6.", "", "6 is 2a, not a.", "This adds instead of subtracting."]}, "id": "m0011", "checked": true, "by": "seed"}, {"section": "math", "topic": "m-linear", "stem": "Which equation is the same as 4x − 2y = 8, solved for y?", "choices": ["y = 2x − 4", "y = 4x − 8", "y = −2x + 4", "y = 2x + 4"], "answer": 0, "rule": "Isolate y step by step", "explanation": {"right": "Subtract 4x: −2y = −4x + 8. Divide everything by −2: y = 2x − 4.", "wrong": ["", "This forgets to divide by −2.", "The signs didn't flip when dividing by −2.", "The constant should be −4, not +4."]}, "id": "m0012", "checked": true, "by": "seed"}, {"section": "math", "topic": "m-slope", "stem": "What is the slope of the line through (2, 3) and (6, 11)?", "choices": ["1/2", "2", "4", "8"], "answer": 1, "rule": "Slope = (y₂ − y₁) / (x₂ − x₁)", "explanation": {"right": "(11 − 3) / (6 − 2) = 8 / 4 = 2.", "wrong": ["This flips the fraction: run over rise.", "", "4 is the change in x.", "8 is the change in y."]}, "id": "m0013", "checked": true, "by": "seed"}, {"section": "math", "topic": "m-slope", "stem": "What is the slope of the line 3x + 2y = 6?", "choices": ["−3/2", "−2/3", "3/2", "3"], "answer": 0, "rule": "In Ax + By = C, slope = −A/B", "explanation": {"right": "A = 3 and B = 2, so the slope is −3/2. You can check by solving for y: y = −(3/2)x + 3.", "wrong": ["", "This flips A and B.", "The sign is missing. Slope is −A/B.", "3 is the y-intercept."]}, "id": "m0014", "checked": true, "by": "seed"}, {"section": "math", "topic": "m-slope", "stem": "A line is perpendicular to y = (2/3)x + 1. What is its slope?", "choices": ["−3/2", "−2/3", "2/3", "3/2"], "answer": 0, "rule": "Perpendicular slopes are negative reciprocals", "explanation": {"right": "Flip 2/3 to get 3/2 and change the sign: −3/2.", "wrong": ["", "This changes the sign but doesn't flip.", "Same slope means parallel, not perpendicular.", "This flips but doesn't change the sign."]}, "id": "m0015", "checked": true, "by": "seed"}, {"section": "math", "topic": "m-slope", "stem": "What is the y-intercept of y = −4x + 7?", "choices": ["−4", "7/4", "4", "7"], "answer": 3, "rule": "In y = mx + b, b is the y-intercept", "explanation": {"right": "The equation is in slope intercept form. b = 7.", "wrong": ["−4 is the slope.", "7/4 is where the line crosses the x axis.", "4 drops the sign of the slope.", ""]}, "id": "m0016", "checked": true, "by": "seed"}, {"section": "math", "topic": "m-slope", "stem": "Which is the equation of the line with slope 3 that passes through (1, 2)?", "choices": ["y = 3x − 1", "y = x + 3", "y = 3x + 2", "y = 3x + 1"], "answer": 0, "rule": "Point slope form: y − y₁ = m(x − x₁)", "explanation": {"right": "y − 2 = 3(x − 1). Distribute: y − 2 = 3x − 3. Add 2: y = 3x − 1.", "wrong": ["", "This has slope 1, not 3.", "Plug in x = 1: y = 5, not 2.", "Plug in x = 1: y = 4, not 2."]}, "id": "m0017", "checked": true, "by": "seed"}, {"section": "math", "topic": "m-slope", "stem": "Which line is parallel to y = 5x − 2 and passes through (0, 4)?", "choices": ["y = 5x + 4", "y = −(1/5)x + 4", "y = −5x + 4", "y = 4x + 5"], "answer": 0, "rule": "Parallel lines have the same slope", "explanation": {"right": "Parallel means slope 5. The point (0, 4) is the y-intercept, so y = 5x + 4.", "wrong": ["", "This slope is perpendicular, not parallel.", "The slope has the wrong sign.", "The slope and intercept are swapped."]}, "id": "m0018", "checked": true, "by": "seed"}, {"section": "math", "topic": "m-exponents", "stem": "Which is equivalent to x³ · x⁵?", "choices": ["2x⁸", "x²", "x⁸", "x¹⁵"], "answer": 2, "rule": "Multiply powers with the same base: add exponents", "explanation": {"right": "x³ · x⁵ = x³⁺⁵ = x⁸.", "wrong": ["There is no 2 in front. The x's multiply, they don't add.", "This subtracts the exponents.", "", "This multiplies the exponents. That rule is for a power of a power."]}, "id": "m0019", "checked": true, "by": "seed"}, {"section": "math", "topic": "m-exponents", "stem": "Which is equivalent to (x²)⁴?", "choices": ["x⁶", "x¹⁶", "x⁸", "4x²"], "answer": 2, "rule": "Power of a power: multiply exponents", "explanation": {"right": "(x²)⁴ = x²·⁴ = x⁸.", "wrong": ["This adds the exponents.", "This uses 4², not 2 × 4.", "", "The 4 is an exponent, not a coefficient."]}, "id": "m0020", "checked": true, "by": "seed"}, {"section": "math", "topic": "m-exponents", "stem": "Which is equivalent to √48?", "choices": ["4√3", "3√4", "16√3", "6√2"], "answer": 0, "rule": "Pull the biggest perfect square out of the radical", "explanation": {"right": "48 = 16 × 3. √16 = 4, so √48 = 4√3.", "wrong": ["", "3√4 = 6, but √48 is about 6.93.", "16 should come out as √16 = 4.", "6√2 = √72, not √48."]}, "id": "m0021", "checked": true, "by": "seed"}, {"section": "math", "topic": "m-exponents", "stem": "What is the value of 8^(2/3)?", "choices": ["2", "4", "16/3", "64"], "answer": 1, "rule": "x^(m/n) = (ⁿ√x)ᵐ", "explanation": {"right": "Take the cube root first: ∛8 = 2. Then square it: 2² = 4.", "wrong": ["This only takes the cube root.", "", "This multiplies 8 by 2/3.", "This squares 8 and stops."]}, "id": "m0022", "checked": true, "by": "seed"}, {"section": "math", "topic": "m-exponents", "stem": "What is the value of 2⁻³?", "choices": ["−8", "−6", "1/8", "1/6"], "answer": 2, "rule": "x⁻ⁿ = 1/xⁿ", "explanation": {"right": "2⁻³ = 1/2³ = 1/8.", "wrong": ["A negative exponent doesn't make the answer negative.", "This multiplies 2 by −3.", "", "This uses 2 × 3 instead of 2³."]}, "id": "m0023", "checked": true, "by": "seed"}, {"section": "math", "topic": "m-exponents", "stem": "Which is equivalent to x⁷ / x², for x ≠ 0?", "choices": ["x⁹", "x^3.5", "x⁵", "x¹⁴"], "answer": 2, "rule": "Divide powers with the same base: subtract exponents", "explanation": {"right": "x⁷ / x² = x⁷⁻² = x⁵.", "wrong": ["This adds the exponents.", "This divides the exponents.", "", "This multiplies the exponents."]}, "id": "m0024", "checked": true, "by": "seed"}, {"section": "math", "topic": "m-quadratics", "stem": "Which is the factored form of x² + 7x + 12?", "choices": ["(x + 2)(x + 6)", "(x + 1)(x + 12)", "(x + 3)(x + 4)", "(x − 3)(x − 4)"], "answer": 2, "rule": "Find two numbers that multiply to c and add to b", "explanation": {"right": "You need two numbers that multiply to 12 and add to 7. That's 3 and 4.", "wrong": ["2 and 6 multiply to 12 but add to 8.", "1 and 12 add to 13.", "", "−3 and −4 add to −7, not 7."]}, "id": "m0025", "checked": true, "by": "seed"}, {"section": "math", "topic": "m-quadratics", "stem": "What are the solutions to x² − 5x − 14 = 0?", "choices": ["x = 7 and x = −2", "x = −7 and x = 2", "x = 7 and x = 2", "x = 14 and x = −1"], "answer": 0, "rule": "Factor, then set each factor to zero", "explanation": {"right": "Two numbers that multiply to −14 and add to −5 are −7 and 2. So (x − 7)(x + 2) = 0, giving x = 7 or x = −2.", "wrong": ["", "The signs are flipped. Check: 49 + 35 − 14 ≠ 0.", "7 and 2 multiply to 14, not −14.", "14 and −1 add to 13, not −5."]}, "id": "m0026", "checked": true, "by": "seed"}, {"section": "math", "topic": "m-quadratics", "stem": "Which is equivalent to (x + 5)²?", "choices": ["x² + 10x + 10", "x² + 25", "x² + 10x + 25", "x² + 5x + 25"], "answer": 2, "rule": "(a + b)² = a² + 2ab + b²", "explanation": {"right": "a = x and b = 5. a² = x², 2ab = 10x, b² = 25.", "wrong": ["The last term should be 5² = 25.", "This forgets the middle term 2ab.", "", "The middle term should be 2 × 5x = 10x."]}, "id": "m0027", "checked": true, "by": "seed"}, {"section": "math", "topic": "m-quadratics", "stem": "How many real solutions does x² + 4x + 5 = 0 have?", "choices": ["One", "None", "Infinitely many", "Two"], "answer": 1, "rule": "Discriminant b² − 4ac: negative means no real roots", "explanation": {"right": "b² − 4ac = 16 − 20 = −4. A negative discriminant means no real solutions.", "wrong": ["One real solution needs a discriminant of 0.", "", "A quadratic never has infinitely many solutions.", "Two real solutions need a positive discriminant."]}, "id": "m0028", "checked": true, "by": "seed"}, {"section": "math", "topic": "m-quadratics", "stem": "What is the vertex of y = 2(x − 3)² + 1?", "choices": ["(−3, 1)", "(3, −1)", "(3, 1)", "(2, 1)"], "answer": 2, "rule": "Vertex form y = a(x − h)² + k has vertex (h, k)", "explanation": {"right": "Here h = 3 and k = 1, so the vertex is (3, 1).", "wrong": ["The form has x − h, so x − 3 means h = 3, not −3.", "k is +1, not −1.", "", "2 is a, which stretches the graph. It isn't part of the vertex."]}, "id": "m0029", "checked": true, "by": "seed"}, {"section": "math", "topic": "m-quadratics", "stem": "What is the x-coordinate of the vertex of y = x² − 6x + 2?", "choices": ["−3", "2", "3", "6"], "answer": 2, "rule": "In standard form, the vertex is at x = −b / 2a", "explanation": {"right": "a = 1 and b = −6. x = −(−6) / (2 × 1) = 3.", "wrong": ["The sign is wrong. −b means −(−6) = 6.", "2 is c, the y-intercept.", "", "This forgets to divide by 2a."]}, "id": "m0030", "checked": true, "by": "seed"}, {"section": "math", "topic": "m-functions", "stem": "If f(x) = 2x² − 3, what is f(3)?", "choices": ["3", "6", "15", "33"], "answer": 2, "rule": "f(3) means plug in 3 for x", "explanation": {"right": "f(3) = 2(3)² − 3 = 2(9) − 3 = 15. Square first, then multiply by 2.", "wrong": ["This forgets to square: 2 × 3 − 3 = 3.", "This forgets the 2: 9 − 3 = 6.", "", "This squares 2 × 3 = 6 to get 36, then subtracts 3."]}, "id": "m0031", "checked": true, "by": "seed"}, {"section": "math", "topic": "m-functions", "stem": "If f(x) = x + 4 and g(x) = 3x, what is f(g(2))?", "choices": ["9", "10", "12", "18"], "answer": 1, "rule": "f(g(x)) means put g(x) into f", "explanation": {"right": "First g(2) = 3 × 2 = 6. Then f(6) = 6 + 4 = 10.", "wrong": ["This doesn't follow either order.", "", "This doesn't follow either order.", "This finds g(f(2)) = 3 × 6."]}, "id": "m0032", "checked": true, "by": "seed"}, {"section": "math", "topic": "m-functions", "stem": "What is the domain of f(x) = 1 / (x − 5)?", "choices": ["All real numbers except 5", "All real numbers except −5", "All x > 5", "All real numbers"], "answer": 0, "rule": "Domain: watch for dividing by 0", "explanation": {"right": "The denominator is 0 when x = 5. Every other real number works.", "wrong": ["", "x = −5 gives 1/(−10), which is fine.", "Values below 5 also work, like f(0) = −1/5.", "x = 5 makes the denominator 0."]}, "id": "m0033", "checked": true, "by": "seed"}, {"section": "math", "topic": "m-functions", "stem": "What is the domain of g(x) = √(x − 3)?", "choices": ["x > 3", "x ≥ 3", "All real numbers", "x ≥ −3"], "answer": 1, "rule": "Domain: no square roots of negatives", "explanation": {"right": "x − 3 must be 0 or more, so x ≥ 3. At x = 3 the value is √0 = 0, which works.", "wrong": ["x = 3 gives √0 = 0, so 3 is included.", "", "Values below 3 give square roots of negatives.", "x = 0 gives √(−3), which isn't real."]}, "id": "m0034", "checked": true, "by": "seed"}, {"section": "math", "topic": "m-functions", "stem": "If f(x) = 3x − 1 and f(a) = 11, what is a?", "choices": ["10/3", "4", "12", "32"], "answer": 1, "rule": "Set the function equal to the value and solve", "explanation": {"right": "3a − 1 = 11. Add 1: 3a = 12. Divide: a = 4.", "wrong": ["This subtracts 1 instead of adding it.", "", "12 is 3a, not a.", "This finds f(11) instead."]}, "id": "m0035", "checked": true, "by": "seed"}, {"section": "math", "topic": "m-functions", "stem": "If f(x) = x² and g(x) = x − 1, what is g(f(3))?", "choices": ["2", "4", "8", "10"], "answer": 2, "rule": "g(f(x)) means put f(x) into g", "explanation": {"right": "First f(3) = 9. Then g(9) = 9 − 1 = 8.", "wrong": ["This only finds g(3).", "This finds f(g(3)) = 2² = 4.", "", "This adds 1 instead of subtracting."]}, "id": "m0036", "checked": true, "by": "seed"}, {"section": "math", "topic": "m-triangles", "stem": "Two angles of a triangle measure 50° and 65°. What is the measure of the third angle?", "choices": ["55°", "65°", "75°", "115°"], "answer": 1, "rule": "Triangle angles sum to 180°", "explanation": {"right": "180 − 50 − 65 = 65.", "wrong": ["This doesn't match 180 − 115.", "", "This doesn't match 180 − 115.", "115 is the sum of the two given angles."]}, "id": "m0037", "checked": true, "by": "seed"}, {"section": "math", "topic": "m-triangles", "stem": "A right triangle has legs of length 6 and 8. What is the length of the hypotenuse?", "choices": ["7", "10", "14", "48"], "answer": 1, "rule": "Pythagorean theorem: a² + b² = c²", "explanation": {"right": "6² + 8² = 36 + 64 = 100. c = √100 = 10. This is the 3, 4, 5 triple times 2.", "wrong": ["This averages the legs.", "", "This adds the legs.", "This multiplies the legs."]}, "id": "m0038", "checked": true, "by": "seed"}, {"section": "math", "topic": "m-triangles", "stem": "In a 30°-60°-90° triangle, the shorter leg is 5. What is the hypotenuse?", "choices": ["5√3", "10", "5√2", "15"], "answer": 1, "rule": "30-60-90 sides: x, x√3, 2x", "explanation": {"right": "The short leg is x = 5. The hypotenuse is 2x = 10.", "wrong": ["5√3 is the longer leg.", "", "x√2 belongs to a 45-45-90 triangle.", "The hypotenuse is 2x, not 3x."]}, "id": "m0039", "checked": true, "by": "seed"}, {"section": "math", "topic": "m-triangles", "stem": "A 45°-45°-90° triangle has a leg of length 7. What is the hypotenuse?", "choices": ["7√3", "14", "7√2", "49"], "answer": 2, "rule": "45-45-90 sides: x, x, x√2", "explanation": {"right": "Each leg is x = 7. The hypotenuse is x√2 = 7√2.", "wrong": ["x√3 belongs to a 30-60-90 triangle.", "2x is the hypotenuse of a 30-60-90 triangle.", "", "This squares the leg."]}, "id": "m0040", "checked": true, "by": "seed"}, {"section": "math", "topic": "m-triangles", "stem": "In a triangle, two interior angles measure 40° and 75°. What is the exterior angle at the third vertex?", "choices": ["65°", "105°", "115°", "140°"], "answer": 2, "rule": "Exterior angle = sum of the two far interior angles", "explanation": {"right": "The exterior angle equals 40 + 75 = 115.", "wrong": ["65° is the third interior angle, not the exterior angle.", "This doesn't come from the two far angles.", "", "This doesn't come from the two far angles."]}, "id": "m0041", "checked": true, "by": "seed"}, {"section": "math", "topic": "m-triangles", "stem": "Every side of a triangle is tripled. The area of the new triangle is how many times the area of the original?", "choices": ["3", "6", "9", "27"], "answer": 2, "rule": "Similar figures: areas scale by k²", "explanation": {"right": "The scale factor is k = 3. Area scales by k² = 9.", "wrong": ["Area doesn't scale by k. It scales by k².", "This doubles k instead of squaring it.", "", "27 is k³, which is for volume."]}, "id": "m0042", "checked": true, "by": "seed"}, {"section": "math", "topic": "m-trig", "stem": "In a right triangle, the side opposite angle A is 3 and the hypotenuse is 5. What is sin A?", "choices": ["3/5", "3/4", "4/5", "5/3"], "answer": 0, "rule": "SOH: sine = opposite / hypotenuse", "explanation": {"right": "sin A = opposite / hypotenuse = 3/5.", "wrong": ["", "3/4 is tan A.", "4/5 is cos A. The adjacent side is 4.", "This flips the fraction."]}, "id": "m0043", "checked": true, "by": "seed"}, {"section": "math", "topic": "m-trig", "stem": "In a right triangle, the side opposite angle B is 5 and the side adjacent to B is 12. What is tan B?", "choices": ["5/13", "5/12", "12/13", "12/5"], "answer": 1, "rule": "TOA: tangent = opposite / adjacent", "explanation": {"right": "tan B = 5/12.", "wrong": ["5/13 is sin B, using the hypotenuse 13.", "", "12/13 is cos B.", "This flips the fraction."]}, "id": "m0044", "checked": true, "by": "seed"}, {"section": "math", "topic": "m-trig", "stem": "What is sin 30°?", "choices": ["√2/2", "1", "1/2", "√3/2"], "answer": 2, "rule": "Key values: sin 30° = 1/2", "explanation": {"right": "sin 30° = 1/2.", "wrong": ["√2/2 is sin 45°.", "1 is sin 90°.", "", "√3/2 is sin 60°."]}, "id": "m0045", "checked": true, "by": "seed"}, {"section": "math", "topic": "m-trig", "stem": "What is 120° in radians?", "choices": ["2π/3", "4π/3", "π/3", "3π/2"], "answer": 0, "rule": "π radians = 180°", "explanation": {"right": "Multiply by π/180: 120 × π/180 = 2π/3.", "wrong": ["", "4π/3 is 240°.", "π/3 is 60°.", "3π/2 is 270°."]}, "id": "m0046", "checked": true, "by": "seed"}, {"section": "math", "topic": "m-trig", "stem": "If θ is an acute angle and sin θ = 0.6, what is cos θ?", "choices": ["0.36", "0.4", "0.64", "0.8"], "answer": 3, "rule": "sin²θ + cos²θ = 1", "explanation": {"right": "cos²θ = 1 − 0.36 = 0.64. cos θ = √0.64 = 0.8, positive because θ is acute.", "wrong": ["0.36 is sin²θ.", "Sine and cosine don't add to 1. Their squares do.", "0.64 is cos²θ. Take the square root.", ""]}, "id": "m0047", "checked": true, "by": "seed"}, {"section": "math", "topic": "m-trig", "stem": "What is the period of y = 3 sin(2x)?", "choices": ["2π", "3", "π", "4π"], "answer": 2, "rule": "y = a·sin(bx): period = 2π/b", "explanation": {"right": "b = 2, so the period is 2π/2 = π.", "wrong": ["2π is the period of sin x, before the 2 squeezes it.", "3 is the amplitude.", "", "This multiplies by 2 instead of dividing."]}, "id": "m0048", "checked": true, "by": "seed"}, {"section": "math", "topic": "m-stats", "stem": "What is the mean of 4, 8, 10, and 14?", "choices": ["8", "9", "10", "36"], "answer": 1, "rule": "Mean = sum ÷ count", "explanation": {"right": "4 + 8 + 10 + 14 = 36. 36 ÷ 4 = 9.", "wrong": ["This doesn't match 36 ÷ 4.", "", "10 is close to the middle but isn't the mean.", "36 is the sum, not the mean."]}, "id": "m0049", "checked": true, "by": "seed"}, {"section": "math", "topic": "m-stats", "stem": "What is the median of 3, 9, 4, 7, 12, 1?", "choices": ["4", "5.5", "6", "7"], "answer": 1, "rule": "Median: put in order; average the two middle values when the count is even", "explanation": {"right": "In order: 1, 3, 4, 7, 9, 12. The two middle values are 4 and 7. (4 + 7) ÷ 2 = 5.5.", "wrong": ["4 is one of the two middle values.", "", "6 is the mean, not the median.", "7 is the other middle value."]}, "id": "m0050", "checked": true, "by": "seed"}, {"section": "math", "topic": "m-stats", "stem": "Lee's average on 3 tests is 80. His average on 2 other tests is 90. What is his average on all 5 tests?", "choices": ["82", "84", "85", "86"], "answer": 1, "rule": "Weighted average: multiply by weights, add, divide by total weight", "explanation": {"right": "3 × 80 = 240 and 2 × 90 = 180. 240 + 180 = 420. 420 ÷ 5 = 84.", "wrong": ["This doesn't match 420 ÷ 5.", "", "This averages 80 and 90 without weights.", "This weights the wrong group more."]}, "id": "m0051", "checked": true, "by": "seed"}, {"section": "math", "topic": "m-stats", "stem": "Every value in a data set is increased by 5. What happens to the standard deviation?", "choices": ["It stays the same.", "It increases by 5.", "It is multiplied by 5.", "It decreases by 5."], "answer": 0, "rule": "Adding a constant shifts the mean but not the spread", "explanation": {"right": "Every value moves the same amount, so the spread doesn't change. The standard deviation stays the same.", "wrong": ["", "The mean goes up by 5, but the spread doesn't.", "Nothing is multiplied.", "The spread doesn't change."]}, "id": "m0052", "checked": true, "by": "seed"}, {"section": "math", "topic": "m-stats", "stem": "What is the mean of 2, 3, 3, 4, and 48?", "choices": ["3", "4", "12", "15"], "answer": 2, "rule": "An outlier pulls the mean more than the median", "explanation": {"right": "2 + 3 + 3 + 4 + 48 = 60. 60 ÷ 5 = 12. The outlier 48 pulls the mean far above the median of 3.", "wrong": ["3 is the median and mode.", "This leaves out the outlier.", "", "This doesn't match 60 ÷ 5."]}, "id": "m0053", "checked": true, "by": "seed"}, {"section": "math", "topic": "m-stats", "stem": "The mean of five numbers is 20. Four of the numbers are 18, 22, 15, and 25. What is the fifth number?", "choices": ["18", "20", "25", "100"], "answer": 1, "rule": "Sum = mean × count", "explanation": {"right": "The total is 5 × 20 = 100. The four numbers add to 80. 100 − 80 = 20.", "wrong": ["This doesn't make the total 100.", "", "This doesn't make the total 100.", "100 is the total, not the fifth number."]}, "id": "m0054", "checked": true, "by": "seed"}, {"section": "math", "topic": "m-prob", "stem": "A bag has 3 red marbles, 5 blue marbles, and 2 green marbles. One marble is picked at random. What is the probability it is blue?", "choices": ["1/5", "1/3", "1/2", "5/7"], "answer": 2, "rule": "P(event) = favorable ÷ total", "explanation": {"right": "There are 5 blue out of 10 total. 5/10 = 1/2.", "wrong": ["1/5 is the chance of green.", "This uses 3 colors as the total.", "", "This divides by the non blue marbles only."]}, "id": "m0055", "checked": true, "by": "seed"}, {"section": "math", "topic": "m-prob", "stem": "Two fair coins are flipped. What is the probability that both land heads?", "choices": ["1/4", "1/3", "1/2", "3/4"], "answer": 0, "rule": "Independent events: P(A and B) = P(A) · P(B)", "explanation": {"right": "Each coin has a 1/2 chance. 1/2 × 1/2 = 1/4.", "wrong": ["", "There are 4 equally likely outcomes, not 3.", "1/2 is for one coin.", "3/4 is the chance of at least one head."]}, "id": "m0056", "checked": true, "by": "seed"}, {"section": "math", "topic": "m-prob", "stem": "How many different pairs of students can be chosen from a group of 5?", "choices": ["5", "10", "20", "25"], "answer": 1, "rule": "Combinations when order doesn't matter: n! / [r!(n − r)!]", "explanation": {"right": "5! / (2! × 3!) = 120 / (2 × 6) = 10.", "wrong": ["This counts students, not pairs.", "", "20 counts each pair twice, as if order mattered.", "This is 5 × 5, which allows choosing the same student twice."]}, "id": "m0057", "checked": true, "by": "seed"}, {"section": "math", "topic": "m-prob", "stem": "In how many different orders can 4 books be placed on a shelf?", "choices": ["4", "10", "16", "24"], "answer": 3, "rule": "Counting principle: multiply the choices", "explanation": {"right": "4 choices for the first spot, 3 for the second, 2 for the third, 1 for the last. 4 × 3 × 2 × 1 = 24.", "wrong": ["This counts books, not orders.", "This adds 4 + 3 + 2 + 1.", "This is 4 × 4, which allows the same book twice.", ""]}, "id": "m0058", "checked": true, "by": "seed"}, {"section": "math", "topic": "m-prob", "table": {"headers": ["Grade", "Plays soccer", "Does not play", "Total"], "rows": [["Juniors", "12", "18", "30"], ["Seniors", "8", "12", "20"], ["Total", "20", "30", "50"]]}, "stem": "Based on the table, a student who plays soccer is chosen at random. What is the probability the student is a junior?", "choices": ["12/50", "12/30", "2/5", "3/5"], "answer": 3, "rule": "\"Given\" shrinks the total to that row or column", "explanation": {"right": "Only soccer players count, so the total is 20. Of those, 12 are juniors. 12/20 = 3/5.", "wrong": ["This uses all 50 students as the total.", "This uses all juniors as the total.", "2/5 is the chance the soccer player is a senior.", ""]}, "id": "m0059", "checked": true, "by": "seed"}, {"section": "math", "topic": "m-prob", "stem": "A game pays $5 with probability 0.3 and costs you $2 with probability 0.7. What is the expected value of one play?", "choices": ["−$1.40", "$0.10", "$1.50", "$3.00"], "answer": 1, "rule": "Expected value: multiply each outcome by its probability and add", "explanation": {"right": "5(0.3) + (−2)(0.7) = 1.50 − 1.40 = 0.10.", "wrong": ["This leaves out the win.", "", "This leaves out the loss.", "This just subtracts the dollar amounts."]}, "id": "m0060", "checked": true, "by": "seed"}, {"section": "math", "topic": "m-number", "stem": "What is the least common multiple of 12 and 18?", "choices": ["6", "36", "72", "216"], "answer": 1, "rule": "LCM = (a × b) / GCF", "explanation": {"right": "The GCF of 12 and 18 is 6. (12 × 18) / 6 = 216 / 6 = 36.", "wrong": ["6 is the GCF.", "", "72 is a common multiple, but not the least.", "216 is the product, not the LCM."]}, "id": "m0061", "checked": true, "by": "seed"}, {"section": "math", "topic": "m-number", "stem": "Which of the following numbers is prime?", "choices": ["51", "57", "59", "63"], "answer": 2, "rule": "Primes have exactly two factors", "explanation": {"right": "59 is only divisible by 1 and 59. The others have digit sums divisible by 3.", "wrong": ["51 = 3 × 17.", "57 = 3 × 19.", "", "63 = 7 × 9."]}, "id": "m0062", "checked": true, "by": "seed"}, {"section": "math", "topic": "m-number", "stem": "If a and b are both odd integers, which expression must be even?", "choices": ["ab", "a + 2b", "a + b", "3a"], "answer": 2, "rule": "Odd + odd = even", "explanation": {"right": "The sum of two odd numbers is always even.", "wrong": ["Odd × odd = odd.", "2b is even, and odd + even = odd.", "", "Odd × odd = odd."]}, "id": "m0063", "checked": true, "by": "seed"}, {"section": "math", "topic": "m-number", "stem": "Which is 0

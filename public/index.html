.00045 written in scientific notation?", "choices": ["4.5 × 10⁴", "45 × 10⁻⁵", "4.5 × 10⁻⁴", "4.5 × 10⁻³"], "answer": 2, "rule": "Scientific notation: a × 10ⁿ with 1 ≤ a < 10", "explanation": {"right": "Move the decimal 4 places to the right to get 4.5. So 0.00045 = 4.5 × 10⁻⁴.", "wrong": ["A positive exponent makes a big number.", "45 is not between 1 and 10.", "", "This moves the decimal 3 places, not 4."]}, "id": "m0064", "checked": true, "by": "seed"}, {"section": "math", "topic": "m-units", "stem": "A car travels at 60 miles per hour. How many feet per second is that? (1 mile = 5,280 feet)", "choices": ["60", "88", "1,056", "5,280"], "answer": 1, "rule": "Unit conversion: multiply by fractions equal to 1", "explanation": {"right": "60 × 5,280 ÷ 3,600 = 88 feet per second.", "wrong": ["This doesn't convert anything.", "", "This divides by 300 instead of 3,600.", "This converts miles to feet but not hours to seconds."]}, "id": "m0065", "checked": true, "by": "seed"}, {"section": "math", "topic": "m-units", "stem": "How many square feet are in 3 square yards?", "choices": ["6", "9", "27", "36"], "answer": 2, "rule": "Squared units square the factor", "explanation": {"right": "1 yard = 3 feet, so 1 square yard = 3² = 9 square feet. 3 × 9 = 27.", "wrong": ["This adds instead of multiplying.", "This is 3 × 3, which forgets one of the 3's.", "", "This uses 12 instead of 9."]}, "id": "m0066", "checked": true, "by": "seed"}, {"section": "math", "topic": "m-units", "stem": "How many minutes are in 2.5 hours?", "choices": ["90", "125", "150", "250"], "answer": 2, "rule": "Unit conversion: multiply by a fraction equal to 1", "explanation": {"right": "2.5 hours × 60 minutes per hour = 150 minutes.", "wrong": ["This doesn't come from 2.5 × 60.", "This uses 50 minutes per hour.", "", "This moves the decimal instead of converting."]}, "id": "m0067", "checked": true, "by": "seed"}, {"section": "math", "topic": "m-units", "stem": "A machine moves 72 inches per second. How many feet per minute is that?", "choices": ["6", "360", "864", "4,320"], "answer": 1, "rule": "Unit conversion: cancel units step by step", "explanation": {"right": "72 inches per second ÷ 12 = 6 feet per second. 6 × 60 = 360 feet per minute.", "wrong": ["6 is feet per second.", "", "This multiplies by 12 instead of dividing.", "This is inches per minute."]}, "id": "m0068", "checked": true, "by": "seed"}, {"section": "math", "topic": "m-systems", "stem": "If x + y = 10 and x − y = 4, what is x?", "choices": ["3", "6", "7", "14"], "answer": 2, "rule": "Add the equations to eliminate a variable", "explanation": {"right": "Adding gives 2x = 14, so x = 7.", "wrong": ["3 is y.", "This doesn't solve 2x = 14.", "", "14 is 2x."]}, "id": "m0069", "checked": true, "by": "seed"}, {"section": "math", "topic": "m-systems", "stem": "If 2x + y = 7 and x − y = 2, what is y?", "choices": ["1", "2", "3", "5"], "answer": 0, "rule": "Eliminate a variable, then substitute back", "explanation": {"right": "Add the equations: 3x = 9, so x = 3. Then 3 − y = 2, so y = 1.", "wrong": ["", "This doesn't satisfy both equations.", "3 is x.", "This doesn't satisfy both equations."]}, "id": "m0070", "checked": true, "by": "seed"}, {"section": "math", "topic": "m-systems", "stem": "How many solutions does this system have? y = 2x + 3 and y = 2x − 1", "choices": ["Exactly two", "None", "Infinitely many", "Exactly one"], "answer": 1, "rule": "Same slope, different intercept means no solution", "explanation": {"right": "Both lines have slope 2 but different intercepts. They are parallel and never meet.", "wrong": ["Two lines can't meet exactly twice.", "", "Infinitely many needs the same line.", "One solution needs different slopes."]}, "id": "m0071", "checked": true, "by": "seed"}, {"section": "math", "topic": "m-systems", "stem": "How many solutions does this system have? 3x + 2y = 12 and 6x + 4y = 24", "choices": ["Exactly one", "Exactly two", "None", "Infinitely many"], "answer": 3, "rule": "The same line means infinitely many solutions", "explanation": {"right": "The second equation is the first one times 2. They describe the same line, so every point on it works.", "wrong": ["The lines are the same, not crossing once.", "Two lines can't meet exactly twice.", "They are the same line, not parallel ones.", ""]}, "id": "m0072", "checked": true, "by": "seed"}, {"section": "math", "topic": "m-absval", "stem": "What are the solutions to |x − 3| = 5?", "choices": ["x = 8 and x = −2", "x = 2 only", "x = 8 only", "x = −8 and x = 2"], "answer": 0, "rule": "|x| = a means x = a or x = −a", "explanation": {"right": "x − 3 = 5 gives x = 8. x − 3 = −5 gives x = −2.", "wrong": ["", "This misses a case and has the wrong sign.", "This misses the negative case.", "The signs are flipped."]}, "id": "m0073", "checked": true, "by": "seed"}, {"section": "math", "topic": "m-absval", "stem": "Which describes all x with |x| < 4?", "choices": ["x > −4", "x < 4", "−4 < x < 4", "x < −4 or x > 4"], "answer": 2, "rule": "|x| < a means −a < x < a", "explanation": {"right": "|x| < 4 means x is within 4 of zero, so −4 < x < 4.", "wrong": ["This includes numbers like 10.", "This includes numbers like −10.", "", "This is |x| > 4."]}, "id": "m0074", "checked": true, "by": "seed"}, {"section": "math", "topic": "m-absval", "stem": "Which describes all x with |2x + 1| > 7?", "choices": ["x > 4 or x < −3", "−4 < x < 3", "x > 3 only", "x > 3 or x < −4"], "answer": 3, "rule": "|x| > a means x > a or x < −a", "explanation": {"right": "2x + 1 > 7 gives x > 3. 2x + 1 < −7 gives 2x < −8, so x < −4.", "wrong": ["The 1 was moved with the wrong sign.", "This is the \"less than\" case.", "This misses the negative case.", ""]}, "id": "m0075", "checked": true, "by": "seed"}, {"section": "math", "topic": "m-absval", "stem": "What is the value of |−5| − |2 − 9|?", "choices": ["−12", "−2", "2", "12"], "answer": 1, "rule": "Absolute value is the distance from zero", "explanation": {"right": "|−5| = 5 and |2 − 9| = |−7| = 7. 5 − 7 = −2.", "wrong": ["This doesn't come from 5 − 7.", "", "This flips the order of subtraction.", "This adds instead of subtracting."]}, "id": "m0076", "checked": true, "by": "seed"}, {"section": "math", "topic": "m-sequences", "stem": "What is the 20th term of the arithmetic sequence 4, 7, 10, ...?", "choices": ["57", "60", "61", "64"], "answer": 2, "rule": "Arithmetic sequence: aₙ = a₁ + (n − 1)d", "explanation": {"right": "a₁ = 4 and d = 3. a₂₀ = 4 + 19 × 3 = 4 + 57 = 61.", "wrong": ["57 is 19 × 3, without the first term.", "This uses 20 × 3.", "", "This uses 20 × 3 + 4."]}, "id": "m0077", "checked": true, "by": "seed"}, {"section": "math", "topic": "m-sequences", "stem": "What is the 6th term of the geometric sequence 3, 6, 12, ...?", "choices": ["36", "48", "96", "192"], "answer": 2, "rule": "Geometric sequence: aₙ = a₁ · rⁿ⁻¹", "explanation": {"right": "a₁ = 3 and r = 2. a₆ = 3 × 2⁵ = 3 × 32 = 96.", "wrong": ["This adds 6 each time, which is arithmetic.", "48 is the 5th term.", "", "192 is the 7th term."]}, "id": "m0078", "checked": true, "by": "seed"}, {"section": "math", "topic": "m-sequences", "stem": "What is the sum of the first 10 terms of 2, 4, 6, 8, ...?", "choices": ["20", "100", "110", "220"], "answer": 2, "rule": "Arithmetic sum = n(a₁ + aₙ) / 2", "explanation": {"right": "The 10th term is 20. Sum = 10 × (2 + 20) / 2 = 110.", "wrong": ["20 is the 10th term, not the sum.", "This forgets part of the sum.", "", "This forgets to divide by 2."]}, "id": "m0079", "checked": true, "by": "seed"}, {"section": "math", "topic": "m-sequences", "stem": "An arithmetic sequence has a₁ = 5 and a₅ = 21. What is the common difference?", "choices": ["3.2", "4", "5", "16"], "answer": 1, "rule": "Arithmetic sequence: aₙ = a₁ + (n − 1)d", "explanation": {"right": "21 = 5 + 4d, so 4d = 16 and d = 4.", "wrong": ["This divides by 5 steps instead of 4.", "", "5 is the first term.", "16 is the total change, not the step."]}, "id": "m0080", "checked": true, "by": "seed"}, {"section": "math", "topic": "m-growth", "stem": "$1,000 is invested at 5% interest compounded once a year. How much is it worth after 2 years?", "choices": ["$1,010.00", "$1,050.00", "$1,100.00", "$1,102.50"], "answer": 3, "rule": "Growth: y = a(1 + r)ᵗ", "explanation": {"right": "1,000 × (1.05)² = 1,000 × 1.1025 = 1,102.50.", "wrong": ["This uses 0.5% instead of 5%.", "This is one year only.", "This is simple interest. It doesn't grow the interest.", ""]}, "id": "m0081", "checked": true, "by": "seed"}, {"section": "math", "topic": "m-growth", "stem": "A population of 500 doubles every 3 years. What is the population after 9 years?", "choices": ["1,500", "2,000", "4,000", "13,500"], "answer": 2, "rule": "Doubling: y = a · 2^(t/d)", "explanation": {"right": "9 ÷ 3 = 3 doublings. 500 × 2³ = 500 × 8 = 4,000.", "wrong": ["This multiplies by the number of doublings instead of doubling 3 times.", "This doubles only 2 times.", "", "This triples each period instead of doubling."]}, "id": "m0082", "checked": true, "by": "seed"}, {"section": "math", "topic": "m-growth", "stem": "A car worth $20,000 loses 10% of its value each year. Which function gives its value after t years?", "choices": ["V = 20,000(1.1)ᵗ", "V = 20,000(0.1)ᵗ", "V = 20,000 − 0.1t", "V = 20,000(0.9)ᵗ"], "answer": 3, "rule": "Decay: y = a(1 − r)ᵗ", "explanation": {"right": "Losing 10% leaves 90% each year, so multiply by 0.9 each year.", "wrong": ["1.1 is 10% growth.", "0.1 keeps only 10% each year.", "This subtracts 10 cents a year.", ""]}, "id": "m0083", "checked": true, "by": "seed"}, {"section": "math", "topic": "m-growth", "stem": "A substance has a half life of 5 days. A sample starts at 80 grams. How much is left after 15 days?", "choices": ["5 g", "10 g", "20 g", "40 g"], "answer": 1, "rule": "Decay: multiply by the factor once for each period", "explanation": {"right": "15 ÷ 5 = 3 half lives. 80 → 40 → 20 → 10.", "wrong": ["That's after 4 half lives.", "", "That's after 2 half lives.", "That's after 1 half life."]}, "id": "m0084", "checked": true, "by": "seed"}, {"section": "math", "topic": "m-circles", "stem": "What is the circumference of a circle with radius 6?", "choices": ["6π", "12π", "36π", "24π"], "answer": 1, "rule": "C = 2πr", "explanation": {"right": "C = 2π × 6 = 12π.", "wrong": ["This forgets the 2.", "", "36π is the area.", "This uses the diameter in place of r."]}, "id": "m0085", "checked": true, "by": "seed"}, {"section": "math", "topic": "m-circles", "stem": "What is the area of a circle with diameter 10?", "choices": ["100π", "10π", "25π", "20π"], "answer": 2, "rule": "A = πr²", "explanation": {"right": "The radius is half the diameter: 5. A = π × 5² = 25π.", "wrong": ["This uses the diameter as r.", "10π is the circumference.", "", "This uses 2 × 10."]}, "id": "m0086", "checked": true, "by": "seed"}, {"section": "math", "topic": "m-circles", "stem": "A circle has radius 9. What is the length of an arc with a central angle of 60°?", "choices": ["3π", "6π", "9π", "13.5π"], "answer": 0, "rule": "Arc length = (θ/360) · 2πr", "explanation": {"right": "(60/360) × 2π × 9 = (1/6) × 18π = 3π.", "wrong": ["", "This uses (1/3) instead of (1/6).", "This uses half the circumference.", "This finds the sector area."]}, "id": "m0087", "checked": true, "by": "seed"}, {"section": "math", "topic": "m-circles", "stem": "What are the center and radius of (x − 2)² + (y + 3)² = 16?", "choices": ["(2, −3), radius 16", "(−2, 3), radius 4", "(2, −3), radius 4", "(2, 3), radius 4"], "answer": 2, "rule": "Circle: (x − h)² + (y − k)² = r²", "explanation": {"right": "h = 2 and k = −3, because y + 3 = y − (−3). r² = 16, so r = 4.", "wrong": ["16 is r², not r.", "The signs of the center are flipped.", "", "y + 3 means k = −3."]}, "id": "m0088", "checked": true, "by": "seed"}, {"section": "math", "topic": "m-area", "stem": "A trapezoid has bases of 6 and 10 and a height of 4. What is its area?", "choices": ["24", "32", "40", "64"], "answer": 1, "rule": "Trapezoid area = ½(b₁ + b₂)h", "explanation": {"right": "½ × (6 + 10) × 4 = ½ × 16 × 4 = 32.", "wrong": ["This uses 6 × 4.", "", "This uses 10 × 4.", "This forgets the ½."]}, "id": "m0089", "checked": true, "by": "seed"}, {"section": "math", "topic": "m-area", "stem": "What is the volume of a cylinder with radius 3 and height 5?", "choices": ["15π", "30π", "45π", "75π"], "answer": 2, "rule": "Cylinder volume = πr²h", "explanation": {"right": "π × 3² × 5 = π × 9 × 5 = 45π.", "wrong": ["This doesn't square the radius.", "This uses 2r instead of r².", "", "This squares the height instead."]}, "id": "m0090", "checked": true, "by": "seed"}, {"section": "math", "topic": "m-area", "stem": "What is the volume of a sphere with radius 3?", "choices": ["36π", "12π", "27π", "108π"], "answer": 0, "rule": "Sphere volume = (4/3)πr³", "explanation": {"right": "(4/3) × π × 27 = 36π.", "wrong": ["", "This forgets to cube the radius.", "This forgets the 4/3.", "This forgets to divide by 3."]}, "id": "m0091", "checked": true, "by": "seed"}, {"section": "math", "topic": "m-area", "stem": "A rectangle has a perimeter of 30 and a length of 9. What is its area?", "choices": ["42", "54", "189", "270"], "answer": 1, "rule": "Rectangle area = lw", "explanation": {"right": "2(9) + 2w = 30, so 2w = 12 and w = 6. Area = 9 × 6 = 54.", "wrong": ["This doesn't come from 9 × 6.", "", "This uses 21 as the width.", "This multiplies the perimeter by the length."]}, "id": "m0092", "checked": true, "by": "seed"}, {"section": "math", "topic": "m-coord", "stem": "What is the distance between (1, 2) and (4, 6)?", "choices": ["√7", "25", "7", "5"], "answer": 3, "rule": "Distance = √[(x₂ − x₁)² + (y₂ − y₁)²]", "explanation": {"right": "√[(4 − 1)² + (6 − 2)²] = √(9 + 16) = √25 = 5.", "wrong": ["This takes the root of 3 + 4.", "This forgets the square root.", "This adds the changes 3 + 4.", ""]}, "id": "m0093", "checked": true, "by": "seed"}, {"section": "math", "topic": "m-coord", "stem": "What is the midpoint of (−2, 5) and (6, −1)?", "choices": ["(4, 4)", "(2, 2)", "(8, −6)", "(2, 3)"], "answer": 1, "rule": "Midpoint: average the coordinates", "explanation": {"right": "((−2 + 6)/2, (5 + (−1))/2) = (2, 2).", "wrong": ["This adds without dividing by 2.", "", "This subtracts the points.", "The y value should be 4/2 = 2."]}, "id": "m0094", "checked": true, "by": "seed"}, {"section": "math", "topic": "m-coord", "stem": "The point (3, −4) is reflected over the x axis. What is the new point?", "choices": ["(−3, −4)", "(3, 4)", "(−3, 4)", "(−4, 3)"], "answer": 1, "rule": "Reflect over the x axis: (x, −y)", "explanation": {"right": "Reflecting over the x axis flips the sign of y: (3, 4).", "wrong": ["This is a reflection over the y axis.", "", "This flips both signs, which is a 180° rotation.", "This swaps the coordinates."]}, "id": "m0095", "checked": true, "by": "seed"}, {"section": "math", "topic": "m-coord", "stem": "The point (2, 5) is rotated 90° counterclockwise about the origin. What is the new point?", "choices": ["(5, 2)", "(−5, 2)", "(5, −2)", "(−2, −5)"], "answer": 1, "rule": "Rotate 90° counterclockwise: (−y, x)", "explanation": {"right": "(x, y) becomes (−y, x), so (2, 5) becomes (−5, 2).", "wrong": ["This reflects over y = x.", "", "This rotates 90° clockwise.", "This rotates 180°."]}, "id": "m0096", "checked": true, "by": "seed"}, {"section": "math", "topic": "m-advanced", "stem": "What is log₂ 32?", "choices": ["4", "5", "6", "16"], "answer": 1, "rule": "log_a(b) = c means aᶜ = b", "explanation": {"right": "2⁵ = 32, so log₂ 32 = 5.", "wrong": ["2⁴ = 16.", "", "2⁶ = 64.", "This divides 32 by 2."]}, "id": "m0097", "checked": true, "by": "seed"}, {"section": "math", "topic": "m-advanced", "stem": "What is the value of i⁶, where i = √−1?", "choices": ["−i", "−1", "i", "1"], "answer": 1, "rule": "Powers of i repeat in a cycle of 4", "explanation": {"right": "6 = 4 + 2, so i⁶ = i⁴ × i² = 1 × (−1) = −1.", "wrong": ["i⁷ = −i.", "", "i⁵ = i.", "i⁴ = 1, but i⁶ is two steps further."]}, "id": "m0098", "checked": true, "by": "seed"}, {"section": "math", "topic": "m-advanced", "stem": "What is the determinant of the matrix [3 2; 1 4]?", "choices": ["−10", "10", "12", "14"], "answer": 1, "rule": "2×2 determinant = ad − bc", "explanation": {"right": "ad − bc = 3 × 4 − 2 × 1 = 12 − 2 = 10.", "wrong": ["This subtracts in the wrong order.", "", "This leaves out bc.", "This adds instead of subtracting."]}, "id": "m0099", "checked": true, "by": "seed"}, {"section": "math", "topic": "m-advanced", "stem": "What is the magnitude of the vector ⟨6, 8⟩?", "choices": ["10", "14", "48", "100"], "answer": 0, "rule": "Magnitude of ⟨a, b⟩ = √(a² + b²)", "explanation": {"right": "√(36 + 64) = √100 = 10.", "wrong": ["", "This adds the components.", "This multiplies the components.", "This forgets the square root."]}, "id": "m0100", "checked": true, "by": "seed"}, {"section": "math", "topic": "m-percent", "stem": "A $40 shirt is marked up 15%. What is the new price?", "choices": ["$34", "$40.15", "$46", "$55"], "answer": 2, "rule": "Increase by a percent: multiply by 1 plus the percent", "explanation": {"right": "1.15 × 40 = 46.", "wrong": ["This takes 15% off.", "This adds 15 cents.", "", "This adds $15."]}, "id": "m0101", "checked": true, "by": "seed"}, {"section": "math", "topic": "m-percent", "stem": "30% of a number is 18. What is the number?", "choices": ["5.4", "54", "60", "600"], "answer": 2, "rule": "Part = percent × whole", "explanation": {"right": "0.30 × n = 18, so n = 18 ÷ 0.30 = 60.", "wrong": ["This multiplies 18 by 0.30.", "This adds 36 for no reason.", "", "This divides by 0.03."]}, "id": "m0102", "checked": true, "by": "seed"}, {"section": "math", "topic": "m-percent", "stem": "The ratio of cats to dogs at a shelter is 2:7. There are 63 dogs. How many cats are there?", "choices": ["9", "14", "18", "21"], "answer": 2, "rule": "Ratios: scale both parts by the same number", "explanation": {"right": "63 ÷ 7 = 9, so each part is 9. Cats are 2 parts: 2 × 9 = 18.", "wrong": ["9 is one part, not two.", "This multiplies the two ratio numbers, 2 × 7.", "", "This uses 3 parts."]}, "id": "m0103", "checked": true, "by": "seed"}, {"section": "math", "topic": "m-percent", "stem": "A town's population fell from 2,000 to 1,700. What was the percent decrease?", "choices": ["3%", "15%", "17.6%", "30%"], "answer": 1, "rule": "Percent change = (new − old) / old × 100", "explanation": {"right": "The change is 300. 300 ÷ 2,000 = 0.15, so 15%.", "wrong": ["This divides 300 by 10,000.", "", "This divides by the new value, 1,700.", "This divides 300 by 1,000."]}, "id": "m0104", "checked": true, "by": "seed"}, {"section": "math", "topic": "m-linear", "stem": "If (x + 4)/3 = 5, what is x?", "choices": ["1/3", "11", "15", "19"], "answer": 1, "rule": "Undo operations on both sides", "explanation": {"right": "Multiply both sides by 3: x + 4 = 15. Subtract 4: x = 11.", "wrong": ["This doesn't come from x + 4 = 15.", "", "15 is x + 4.", "This adds 4 instead of subtracting."]}, "id": "m0105", "checked": true, "by": "seed"}, {"section": "math", "topic": "m-linear", "stem": "Which value of x satisfies 4 − 3x ≤ 10?", "choices": ["x ≤ −2", "x ≥ 2", "x ≤ 2", "x ≥ −2"], "answer": 3, "rule": "Flip the inequality when you divide by a negative", "explanation": {"right": "Subtract 4: −3x ≤ 6. Divide by −3 and flip: x ≥ −2.", "wrong": ["This forgets to flip the sign.", "This loses the negative.", "This loses the negative and the flip.", ""]}, "id": "m0106", "checked": true, "by": "seed"}, {"section": "math", "topic": "m-linear", "stem": "A phone plan costs $20 a month plus $0.10 per text. Which expression gives the monthly cost for t texts?", "choices": ["20t + 0.10", "0.10t + 20", "20.10t", "20 + t"], "answer": 1, "rule": "Linear models: fixed amount plus rate times quantity", "explanation": {"right": "The fixed $20 plus $0.10 for each text: 20 + 0.10t.", "wrong": ["This charges $20 per text.", "", "This combines the fee and the rate.", "This charges $1 per text."]}, "id": "m0107", "checked": true, "by": "seed"}, {"section": "math", "topic": "m-linear", "stem": "If 6 − 2(x − 1) = 0, what is x?", "choices": ["−4", "2", "3.5", "4"], "answer": 3, "rule": "Distribute, then solve", "explanation": {"right": "6 − 2x + 2 = 0, so 8 − 2x = 0 and x = 4.", "wrong": ["The sign is wrong.", "This drops the +2 from distributing.", "This doesn't come from 8 = 2x.", ""]}, "id": "m0108", "checked": true, "by": "seed"}, {"section": "math", "topic": "m-slope", "stem": "What is the slope of a horizontal line?", "choices": ["1", "0", "Undefined", "−1"], "answer": 1, "rule": "Slope = rise over run", "explanation": {"right": "A horizontal line doesn't rise, so the slope is 0 / run = 0.", "wrong": ["A slope of 1 rises one for each step right.", "", "A vertical line has undefined slope.", "A slope of −1 falls one for each step right."]}, "id": "m0109", "checked": true, "by": "seed"}, {"section": "math", "topic": "m-slope", "stem": "A line passes through (−1, 4) and (3, −4). What is its slope?", "choices": ["−2", "−1/2", "1/2", "2"], "answer": 0, "rule": "Slope = (y₂ − y₁) / (x₂ − x₁)", "explanation": {"right": "(−4 − 4) / (3 − (−1)) = −8 / 4 = −2.", "wrong": ["", "This flips the fraction.", "This flips the fraction and loses the sign.", "The sign is wrong."]}, "id": "m0110", "checked": true, "by": "seed"}, {"section": "math", "topic": "m-slope", "stem": "What is the x-intercept of y = 2x − 6?", "choices": ["−6", "−3", "3", "6"], "answer": 2, "rule": "The x-intercept is where y = 0", "explanation": {"right": "Set y = 0: 2x − 6 = 0, so x = 3.", "wrong": ["−6 is the y-intercept.", "The sign is wrong.", "", "This forgets to divide by 2."]}, "id": "m0111", "checked": true, "by": "seed"}, {"section": "math", "topic": "m-slope", "stem": "Which line is perpendicular to y = −4x + 1?", "choices": ["y = −4x − 1", "y = 4x + 1", "y = (1/4)x + 2", "y = −(1/4)x + 2"], "answer": 2, "rule": "Perpendicular slopes are negative reciprocals", "explanation": {"right": "The negative reciprocal of −4 is 1/4.", "wrong": ["This has the same slope, so it's parallel.", "This changes only the sign.", "", "This flips but keeps the same sign."]}, "id": "m0112", "checked": true, "by": "seed"}, {"section": "math", "topic": "m-exponents", "stem": "Which is equivalent to (2x³)²?", "choices": ["2x⁶", "4x⁵", "4x⁶", "2x⁵"], "answer": 2, "rule": "A power of a product: raise each factor", "explanation": {"right": "(2x³)² = 2² · (x³)² = 4x⁶.", "wrong": ["This forgets to square the 2.", "This adds the exponents and squares the 2.", "", "This forgets to square the 2 and adds exponents."]}, "id": "m0113", "checked": true, "by": "seed"}, {"section": "math", "topic": "m-exponents", "stem": "What is the value of 16^(1/2) + 27^(1/3)?", "choices": ["7", "11", "12", "43"], "answer": 0, "rule": "x^(1/n) is the nth root", "explanation": {"right": "√16 = 4 and ∛27 = 3. 4 + 3 = 7.", "wrong": ["", "This uses 8 for one of the roots.", "This multiplies the roots.", "This adds the bases."]}, "id": "m0114", "checked": true, "by": "seed"}, {"section": "math", "topic": "m-exponents", "stem": "Which is equivalent to √50 + √18?", "choices": ["8√2", "√68", "5√2 + 3", "34"], "answer": 0, "rule": "Simplify each radical, then combine like radicals", "explanation": {"right": "√50 = 5√2 and √18 = 3√2. Together: 8√2.", "wrong": ["", "Radicals don't add like this.", "√18 is 3√2, not 3.", "This drops the radical."]}, "id": "m0115", "checked": true, "by": "seed"}, {"section": "math", "topic": "m-exponents", "stem": "Which is equivalent to x⁻²y³ / x³y, for x, y ≠ 0?", "choices": ["y² / x⁵", "x⁵y²", "y⁴ / x⁵", "y² / x"], "answer": 0, "rule": "Divide powers with the same base: subtract exponents", "explanation": {"right": "x: −2 − 3 = −5. y: 3 − 1 = 2. So x⁻⁵y² = y² / x⁵.", "wrong": ["", "The x exponent should be negative.", "This adds the y exponents.", "This uses −2 + 3 for x."]}, "id": "m0116", "checked": true, "by": "seed"}, {"section": "math", "topic": "m-quadratics", "stem": "Which is the factored form of x² − 9?", "choices": ["(x − 3)²", "(x + 3)(x − 3)", "(x − 9)(x + 1)", "(x + 9)(x − 1)"], "answer": 1, "rule": "(a + b)(a − b) = a² − b²", "explanation": {"right": "x² − 9 is a difference of squares: (x + 3)(x − 3).", "wrong": ["(x − 3)² = x² − 6x + 9.", "", "This gives x² − 8x − 9.", "This gives x² + 8x − 9."]}, "id": "m0117", "checked": true, "by": "seed"}, {"section": "math", "topic": "m-quadratics", "stem": "What are the solutions of 2x² − 8 = 0?", "choices": ["x = 4 and x = −4", "x = 2 only", "x = 2 and x = −2", "x = 16 and x = −16"], "answer": 2, "rule": "Isolate x², then take both square roots", "explanation": {"right": "2x² = 8, x² = 4, so x = 2 or x = −2.", "wrong": ["4 is x², not x.", "This misses the negative root.", "", "This multiplies instead of dividing."]}, "id": "m0118", "checked": true, "by": "seed"}, {"section": "math", "topic": "m-quadratics", "stem": "The graph of y = x² − 4x + 3 crosses the x axis at which points?", "choices": ["x = −1 and x = −3", "x = 1 and x = 3", "x = 4 and x = 3", "x = 0 and x = 3"], "answer": 1, "rule": "Factor, then set each factor to zero", "explanation": {"right": "x² − 4x + 3 = (x − 1)(x − 3), so x = 1 or x = 3.", "wrong": ["The signs are flipped.", "", "4 and 3 don't multiply to 3.", "x = 0 gives y = 3, not 0."]}, "id": "m0119", "checked": true, "by": "seed"}, {"section": "math", "topic": "m-quadratics", "stem": "Which is equivalent to (x − 4)(x + 2)?", "choices": ["x² − 6x − 8", "x² − 2x − 8", "x² − 8", "x² + 2x − 8"], "answer": 1, "rule": "FOIL: first, outer, inner, last", "explanation": {"right": "x² + 2x − 4x − 8 = x² − 2x − 8.", "wrong": ["This adds −4 and −2 for the middle.", "", "This forgets the middle terms.", "The middle term should be −2x."]}, "id": "m0120", "checked": true, "by": "seed"}, {"section": "math", "topic": "m-functions", "stem": "If f(x) = |x − 5|, what is f(2)?", "choices": ["−7", "−3", "3", "7"], "answer": 2, "rule": "f(2) means plug in 2 for x", "explanation": {"right": "f(2) = |2 − 5| = |−3| = 3.", "wrong": ["This adds and keeps a negative.", "Absolute value is never negative.", "", "This adds instead of subtracting."]}, "id": "m0121", "checked": true, "by": "seed"}, {"section": "math", "topic": "m-functions", "stem": "The table shows f(1) = 4, f(2) = 7, f(3) = 10. Which could be f(x)?", "choices": ["f(x) = 4x", "f(x) = 3x + 1", "f(x) = x + 3", "f(x) = 2x + 2"], "answer": 1, "rule": "Check a rule against every point", "explanation": {"right": "3(1) + 1 = 4, 3(2) + 1 = 7, 3(3) + 1 = 10. Every point fits.", "wrong": ["f(2) would be 8.", "", "f(2) would be 5.", "f(2) would be 6."]}, "id": "m0122", "checked": true, "by": "seed"}, {"section": "math", "topic": "m-functions", "stem": "If g(x) = x² − 1, what is g(x + 1)?", "choices": ["x² + 2x + 2", "x² + 1", "x² + 2x", "x²"], "answer": 2, "rule": "Replace x with the whole input", "explanation": {"right": "g(x + 1) = (x + 1)² − 1 = x² + 2x + 1 − 1 = x² + 2x.", "wrong": ["This adds the 1 instead of subtracting.", "This forgets the middle term and adds 1.", "", "This forgets the middle term."]}, "id": "m0123", "checked": true, "by": "seed"}, {"section": "math", "topic": "m-functions", "stem": "For f(x) = 2x + 3, what input gives an output of 15?", "choices": ["6", "7.5", "9", "33"], "answer": 0, "rule": "Set the function equal to the output and solve", "explanation": {"right": "2x + 3 = 15, so 2x = 12 and x = 6.", "wrong": ["", "This divides 15 by 2.", "This subtracts 6 instead.", "This finds f(15)."]}, "id": "m0124", "checked": true, "by": "seed"}, {"section": "math", "topic": "m-triangles", "stem": "An isosceles triangle has a vertex angle of 40°. What is each base angle?", "choices": ["40°", "50°", "70°", "140°"], "answer": 2, "rule": "Triangle angles sum to 180°", "explanation": {"right": "180 − 40 = 140. The two base angles are equal: 140 ÷ 2 = 70.", "wrong": ["The base angles aren't equal to the vertex angle here.", "This doesn't come from 140 ÷ 2.", "", "140 is the sum of both base angles."]}, "id": "m0125", "checked": true, "by": "seed"}, {"section": "math", "topic": "m-triangles", "stem": "A ladder 13 feet long leans against a wall. Its base is 5 feet from the wall. How high up the wall does it reach?", "choices": ["√194 ft", "18 ft", "8 ft", "12 ft"], "answer": 3, "rule": "Pythagorean theorem: a² + b² = c²", "explanation": {"right": "5² + h² = 13², so h² = 169 − 25 = 144 and h = 12. This is the 5, 12, 13 triple.", "wrong": ["This adds the squares instead of subtracting.", "This adds the lengths.", "This subtracts the lengths.", ""]}, "id": "m0126", "checked": true, "by": "seed"}, {"section": "math", "topic": "m-triangles", "stem": "Two parallel lines are cut by a transversal. One angle measures 115°. What is the measure of a same side interior angle?", "choices": ["65°", "75°", "115°", "245°"], "answer": 0, "rule": "Same side interior angles sum to 180°", "explanation": {"right": "180 − 115 = 65.", "wrong": ["", "This doesn't come from 180 − 115.", "Equal angles are corresponding or alternate, not same side interior.", "Angles here can't be more than 180°."]}, "id": "m0127", "checked": true, "by": "seed"}, {"section": "math", "topic": "m-triangles", "stem": "A triangle has sides 7, 24, and 25. What is its area?", "choices": ["84", "87.5", "168", "300"], "answer": 0, "rule": "Triangle area = ½ × base × height", "explanation": {"right": "7, 24, 25 is a right triangle, so the legs are the base and height. ½ × 7 × 24 = 84.", "wrong": ["", "This uses 7 and 25.", "This forgets the ½.", "This uses 24 and 25."]}, "id": "m0128", "checked": true, "by": "seed"}, {"section": "math", "topic": "m-trig", "stem": "In a right triangle, cos A = 5/13. What is sin A?", "choices": ["5/12", "8/13", "12/13", "13/12"], "answer": 2, "rule": "SOH CAH TOA with a Pythagorean triple", "explanation": {"right": "Adjacent 5, hypotenuse 13, so opposite is 12. sin A = 12/13.", "wrong": ["This is adjacent over opposite, which is the cotangent.", "This subtracts 5 from 13.", "", "This is the hypotenuse over opposite."]}, "id": "m0129", "checked": true, "by": "seed"}, {"section": "math", "topic": "m-trig", "stem": "What is cos 60°?", "choices": ["√3/2", "0", "√2/2", "1/2"], "answer": 3, "rule": "Key values: cos is sin in reverse order", "explanation": {"right": "cos 60° = sin 30° = 1/2.", "wrong": ["√3/2 is cos 30°.", "0 is cos 90°.", "√2/2 is cos 45°.", ""]}, "id": "m0130", "checked": true, "by": "seed"}, {"section": "math", "topic": "m-trig", "stem": "In which quadrant are sine and cosine both negative?", "choices": ["I", "IV", "III", "II"], "answer": 2, "rule": "Signs by quadrant: All, Sin, Tan, Cos", "explanation": {"right": "In quadrant III, only tangent is positive. Sine and cosine are both negative.", "wrong": ["In I, all are positive.", "In IV, cosine is positive.", "", "In II, sine is positive."]}, "id": "m0131", "checked": true, "by": "seed"}, {"section": "math", "topic": "m-trig", "stem": "A ramp rises 3 feet over a horizontal distance of 4 feet. What is the tangent of the angle the ramp makes with the ground?", "choices": ["3/5", "3/4", "4/5", "4/3"], "answer": 1, "rule": "TOA: tangent = opposite / adjacent", "explanation": {"right": "Opposite is the rise, 3. Adjacent is the run, 4. tan = 3/4.", "wrong": ["3/5 is the sine.", "", "4/5 is the cosine.", "This flips the fraction."]}, "id": "m0132", "checked": true, "by": "seed"}, {"section": "math", "topic": "m-stats", "stem": "What is the mode of 5, 7, 7, 8, 9, 9, 9, 10?", "choices": ["7", "8", "8.5", "9"], "answer": 3, "rule": "Mode is the most common value", "explanation": {"right": "9 appears three times, more than any other value.", "wrong": ["7 appears twice.", "8 appears once.", "8.5 is the median.", ""]}, "id": "m0133", "checked": true, "by": "seed"}, {"section": "math", "topic": "m-stats", "stem": "What is the range of 12, 3, 18, 7, 25?", "choices": ["12", "13", "22", "25"], "answer": 2, "rule": "Range = max − min", "explanation": {"right": "25 − 3 = 22.", "wrong": ["12 is the median.", "13 is the mean.", "", "25 is the max."]}, "id": "m0134", "checked": true, "by": "seed"}, {"section": "math", "topic": "m-stats", "stem": "Data set A is 10, 10, 10, 10. Data set B is 1, 5, 15, 19. Which statement is true?", "choices": ["B has the larger standard deviation.", "Neither has a mean.", "A has the larger standard deviation.", "They have the same standard deviation."], "answer": 0, "rule": "Standard deviation measures spread", "explanation": {"right": "Set A has no spread at all. Set B's values are far from its mean, so B has the larger standard deviation.", "wrong": ["", "Both means are 10.", "Set A's values are all the same, so its spread is 0.", "The spreads are very different."]}, "id": "m0135", "checked": true, "by": "seed"}, {"section": "math", "topic": "m-stats", "stem": "A class of 20 has a mean score of 75. One student with a score of 95 joins. What is the new mean, to the nearest tenth?", "choices": ["75.0", "75.5", "76.0", "85.0"], "answer": 2, "rule": "Sum = mean × count", "explanation": {"right": "20 × 75 = 1,500. Add 95: 1,595. Divide by 21: about 75.95, so 76.0.", "wrong": ["The new score raises the mean.", "This doesn't come from 1,595 ÷ 21.", "", "This averages 75 and 95."]}, "id": "m0136", "checked": true, "by": "seed"}, {"section": "math", "topic": "m-prob", "stem": "A number cube is rolled once. What is the probability of rolling a number greater than 4?", "choices": ["1/6", "1/3", "1/2", "2/3"], "answer": 1, "rule": "P(event) = favorable ÷ total", "explanation": {"right": "5 and 6 work. That's 2 out of 6, which is 1/3.", "wrong": ["This counts only one number.", "", "This counts 4, 5, and 6.", "This counts the numbers 4 or less."]}, "id": "m0137", "checked": true, "by": "seed"}, {"section": "math", "topic": "m-prob", "stem": "The probability of rain tomorrow is 0.35. What is the probability it does not rain?", "choices": ["0.35", "0.50", "0.65", "1.35"], "answer": 2, "rule": "P(not A) = 1 − P(A)", "explanation": {"right": "1 − 0.35 = 0.65.", "wrong": ["That's the chance it does rain.", "The chances aren't equal.", "", "A probability can't be more than 1."]}, "id": "m0138", "checked": true, "by": "seed"}, {"section": "math", "topic": "m-prob", "stem": "A card is drawn from 10 cards numbered 1 to 10. What is the probability it is even or greater than 7?", "choices": ["1/2", "3/5", "7/10", "4/5"], "answer": 1, "rule": "P(A or B) = P(A) + P(B) − P(A and B)", "explanation": {"right": "Even: 5 cards. Greater than 7: 8, 9, 10 is 3 cards. Both: 8 and 10 is 2 cards. 5 + 3 − 2 = 6. 6/10 = 3/5.", "wrong": ["This counts only the even cards.", "", "This forgets to subtract the overlap.", "This doesn't match the count."]}, "id": "m0139", "checked": true, "by": "seed"}, {"section": "math", "topic": "m-prob", "stem": "A café offers 3 breads, 4 fillings, and 2 sauces. How many different sandwiches use one of each?", "choices": ["9", "12", "24", "36"], "answer": 2, "rule": "Counting principle: multiply the choices", "explanation": {"right": "3 × 4 × 2 = 24.", "wrong": ["This adds the choices.", "This leaves out the sauces.", "", "This multiplies by 3 twice."]}, "id": "m0140", "checked": true, "by": "seed"}, {"section": "math", "topic": "m-number", "stem": "What is the greatest common factor of 24 and 36?", "choices": ["4", "6", "12", "72"], "answer": 2, "rule": "GCF = biggest shared factor", "explanation": {"right": "12 divides both 24 and 36, and nothing larger does.", "wrong": ["4 is a common factor but not the greatest.", "6 is a common factor but not the greatest.", "", "72 is the LCM."]}, "id": "m0141", "checked": true, "by": "seed"}, {"section": "math", "topic": "m-number", "stem": "Which number is divisible by both 3 and 4?", "choices": ["214", "318", "324", "410"], "answer": 2, "rule": "Divisibility rules", "explanation": {"right": "324: digits add to 9, so it's divisible by 3. The last two digits, 24, are divisible by 4.", "wrong": ["214's digits add to 7.", "318 ends in 18, which isn't divisible by 4.", "", "410's digits add to 5."]}, "id": "m0142", "checked": true, "by": "seed"}, {"section": "math", "topic": "m-number", "stem": "What is the value of 8 − 2 × 3 + 4?", "choices": ["−2", "6", "10", "22"], "answer": 1, "rule": "Order of operations", "explanation": {"right": "Multiply first: 2 × 3 = 6. Then left to right: 8 − 6 + 4 = 6.", "wrong": ["This adds 6 + 4 before subtracting.", "", "This doesn't follow the order of operations.", "This works left to right without multiplying first."]}, "id": "m0143", "checked": true, "by": "seed"}, {"section": "math", "topic": "m-number", "stem": "What is 3/4 ÷ 1/2?", "choices": ["1/4", "3/8", "2/3", "3/2"], "answer": 3, "rule": "To divide fractions, flip the second and multiply", "explanation": {"right": "3/4 × 2/1 = 6/4 = 3/2.", "wrong": ["This subtracts the fractions.", "This multiplies without flipping.", "This flips the wrong fraction.", ""]}, "id": "m0144", "checked": true, "by": "seed"}, {"section": "math", "topic": "m-units", "stem": "A recipe needs 1.5 liters of water. How many milliliters is that?", "choices": ["15", "150", "1,500", "15,000"], "answer": 2, "rule": "Unit conversion: 1 L = 1,000 mL", "explanation": {"right": "1.5 × 1,000 = 1,500 mL.", "wrong": ["This multiplies by 10.", "This multiplies by 100.", "", "This multiplies by 10,000."]}, "id": "m0145", "checked": true, "by": "seed"}, {"section": "math", "topic": "m-units", "stem": "A runner covers 400 meters in 80 seconds. What is her speed in meters per second?", "choices": ["0.2", "5", "320", "32,000"], "answer": 1, "rule": "Rate = distance / time", "explanation": {"right": "400 ÷ 80 = 5 meters per second.", "wrong": ["This divides time by distance.", "", "This subtracts.", "This multiplies."]}, "id": "m0146", "checked": true, "by": "seed"}, {"section": "math", "topic": "m-units", "stem": "A room is 12 feet by 15 feet. How many square yards of carpet cover it?", "choices": ["20", "60", "180", "540"], "answer": 0, "rule": "Squared units square the factor", "explanation": {"right": "The area is 180 square feet. 1 square yard = 9 square feet, so 180 ÷ 9 = 20.", "wrong": ["", "This divides by 3 instead of 9.", "180 is square feet.", "This multiplies by 3."]}, "id": "m0147", "checked": true, "by": "seed"}, {"section": "math", "topic": "m-units", "stem": "A car gets 30 miles per gallon. Gas costs $4 per gallon. What does it cost to drive 150 miles?", "choices": ["$20", "$37.50", "$120", "$600"], "answer": 0, "rule": "Unit conversion: cancel units step by step", "explanation": {"right": "150 ÷ 30 = 5 gallons. 5 × $4 = $20.", "wrong": ["", "This divides 150 by 4.", "This multiplies 30 by 4.", "This multiplies 150 by 4."]}, "id": "m0148", "checked": true, "by": "seed"}, {"section": "math", "topic": "m-systems", "stem": "Tickets cost $5 for students and $8 for adults. 100 tickets sold for $620. How many student tickets were sold?", "choices": ["40", "50", "60", "70"], "answer": 2, "rule": "Set up a system and solve", "explanation": {"right": "s + a = 100 and 5s + 8a = 620. Replace a with 100 − s: 5s + 800 − 8s = 620, so −3s = −180 and s = 60.", "wrong": ["40 is the number of adult tickets.", "50 and 50 would make $650.", "", "70 and 30 would make $590."]}, "id": "m0149", "checked": true, "by": "seed"}, {"section": "math", "topic": "m-systems", "stem": "What is the solution to y = x + 1 and y = 3x − 5?", "choices": ["(3, 4)", "(2, 3)", "(4, 3)", "(−3, −2)"], "answer": 0, "rule": "Substitution: set the expressions equal", "explanation": {"right": "x + 1 = 3x − 5, so 6 = 2x and x = 3. Then y = 4.", "wrong": ["", "(2, 3) works in the first equation but not the second.", "The coordinates are swapped.", "This doesn't satisfy either equation."]}, "id": "m0150", "checked": true, "by": "seed"}, {"section": "math", "topic": "m-systems", "stem": "For what value of k does the system 2x + 3y = 6 and 4x + ky = 5 have no solution?", "choices": ["−6", "3", "6", "12"], "answer": 2, "rule": "No solution: same slope, different intercept", "explanation": {"right": "The second equation needs to be a multiple of the first on the left side. 4 = 2 × 2, so k = 3 × 2 = 6. The right side, 5, isn't 12, so the lines are parallel.", "wrong": ["The sign is wrong.", "k = 3 gives a different slope.", "", "This doubles twice."]}, "id": "m0151", "checked": true, "by": "seed"}, {"section": "math", "topic": "m-systems", "stem": "If 3a + 2b = 16 and a − 2b = 0, what is a?", "choices": ["2", "4", "6", "8"], "answer": 1, "rule": "Add the equations to eliminate a variable", "explanation": {"right": "Adding gives 4a = 16, so a = 4.", "wrong": ["2 is b.", "", "This doesn't come from 4a = 16.", "This uses 2a instead of 4a."]}, "id": "m0152", "checked": true, "by": "seed"}, {"section": "math", "topic": "m-absval", "stem": "How many solutions does |x + 2| = −3 have?", "choices": ["0", "Infinitely many", "1", "2"], "answer": 0, "rule": "Absolute value is never negative", "explanation": {"right": "An absolute value can't equal a negative number, so there are no solutions.", "wrong": ["", "No value works.", "No value works.", "No value works."]}, "id": "m0153", "checked": true, "by": "seed"}, {"section": "math", "topic": "m-absval", "stem": "Which describes all x with |x − 1| ≤ 3?", "choices": ["x ≤ −2 or x ≥ 4", "x ≤ 4", "−2 ≤ x ≤ 4", "−4 ≤ x ≤ 2"], "answer": 2, "rule": "|x| ≤ a means −a ≤ x ≤ a", "explanation": {"right": "−3 ≤ x − 1 ≤ 3. Add 1: −2 ≤ x ≤ 4.", "wrong": ["This is the \"greater than\" case.", "This misses the lower limit.", "", "The 1 moved the wrong way."]}, "id": "m0154", "checked": true, "by": "seed"}, {"section": "math", "topic": "m-absval", "stem": "If |2x| = 10, what is the sum of all possible values of x?", "choices": ["−10", "0", "5", "10"], "answer": 1, "rule": "|x| = a means x = a or x = −a", "explanation": {"right": "2x = 10 or 2x = −10, so x = 5 or x = −5. Their sum is 0.", "wrong": ["This misses the positive value.", "", "This misses the negative value.", "This is |2x|, not a sum of x values."]}, "id": "m0155", "checked": true, "by": "seed"}, {"section": "math", "topic": "m-absval", "stem": "What is the distance between −7 and 3 on a number line?", "choices": ["−10", "4", "10", "21"], "answer": 2, "rule": "Distance on a number line = |a − b|", "explanation": {"right": "|3 − (−7)| = |10| = 10.", "wrong": ["Distance is never negative.", "This adds −7 and 3.", "", "This multiplies."]}, "id": "m0156", "checked": true, "by": "seed"}, {"section": "math", "topic": "m-sequences", "stem": "What is the next term in 2, 6, 18, 54, ...?", "choices": ["72", "108", "162", "216"], "answer": 2, "rule": "Geometric sequence: multiply by the same ratio", "explanation": {"right": "Each term is 3 times the last. 54 × 3 = 162.", "wrong": ["This adds 18.", "This multiplies by 2.", "", "This multiplies by 4."]}, "id": "m0157", "checked": true, "by": "seed"}, {"section": "math", "topic": "m-sequences", "stem": "The 3rd term of an arithmetic sequence is 11 and the 7th term is 23. What is the 1st term?", "choices": ["2", "3", "5", "8"], "answer": 2, "rule": "Arithmetic sequence: aₙ = a₁ + (n − 1)d", "explanation": {"right": "From term 3 to term 7 is 4 steps and 12 more, so d = 3. a₁ = 11 − 2(3) = 5.", "wrong": ["This uses d = 4.5.", "This subtracts too many steps.", "", "This subtracts one step only."]}, "id": "m0158", "checked": true, "by": "seed"}, {"section": "math", "topic": "m-sequences", "stem": "Which term of the sequence 5, 9, 13, ... equals 45?", "choices": ["9th", "10th", "11th", "12th"], "answer": 2, "rule": "Arithmetic sequence: aₙ = a₁ + (n − 1)d", "explanation": {"right": "45 = 5 + (n − 1)4. 40 = 4(n − 1), so n − 1 = 10 and n = 11.", "wrong": ["This doesn't come from the formula.", "This forgets to add 1.", "", "This adds 2."]}, "id": "m0159", "checked": true, "by": "seed"}, {"section": "math", "topic": "m-sequences", "stem": "A geometric sequence starts 100, 50, 25, .... What is the 5th term?", "choices": ["0", "3.125", "6.25", "12.5"], "answer": 2, "rule": "Geometric sequence: aₙ = a₁ · rⁿ⁻¹", "explanation": {"right": "r = 1/2. 100 × (1/2)⁴ = 100 / 16 = 6.25.", "wrong": ["The terms never reach 0.", "That's the 6th term.", "", "That's the 4th term."]}, "id": "m0160", "checked": true, "by": "seed"}, {"section": "math", "topic": "m-growth", "stem": "A bacteria count triples every hour. It starts at 200. What is the count after 3 hours?", "choices": ["600", "1,800", "2,400", "5,400"], "answer": 3, "rule": "Growth: y = a · bᵗ", "explanation": {"right": "200 × 3³ = 200 × 27 = 5,400.", "wrong": ["This multiplies by 3 only once.", "That's after 2 hours.", "This multiplies by 12.", ""]}, "id": "m0161", "checked": true, "by": "seed"}, {"section": "math", "topic": "m-growth", "stem": "Which function shows 6% growth per year starting at 500?", "choices": ["y = 500(1.06)ᵗ", "y = 500(0.94)ᵗ", "y = 500(0.06)ᵗ", "y = 500 + 0.06t"], "answer": 0, "rule": "Growth: y = a(1 + r)ᵗ", "explanation": {"right": "6% growth means multiply by 1.06 each year.", "wrong": ["", "This is 6% decay.", "This keeps only 6% each year.", "This is linear and adds only 6 cents a year."]}, "id": "m0162", "checked": true, "by": "seed"}, {"section": "math", "topic": "m-growth", "stem": "A phone loses 20% of its value each year. It cost $500. What is it worth after 2 years?", "choices": ["$250", "$300", "$320", "$400"], "answer": 2, "rule": "Decay: y = a(1 − r)ᵗ", "explanation": {"right": "500 × 0.8² = 500 × 0.64 = 320.", "wrong": ["This halves the price.", "This takes off $100 twice, which is linear.", "", "That's after 1 year."]}, "id": "m0163", "checked": true, "by": "seed"}, {"section": "math", "topic": "m-growth", "stem": "The function y = 1,000(0.97)ᵗ models a lake's fish population. What does 0.97 tell you?", "choices": ["There are 97 fish.", "The population drops 97% each year.", "The population drops 3% each year.", "The population grows 97% each year."], "answer": 2, "rule": "Decay: the factor is 1 minus the rate", "explanation": {"right": "0.97 = 1 − 0.03, so the population keeps 97% and loses 3% each year.", "wrong": ["1,000 is the starting number.", "It keeps 97%, so it loses only 3%.", "", "A factor less than 1 means decay."]}, "id": "m0164", "checked": true, "by": "seed"}, {"section": "math", "topic": "m-circles", "stem": "A circle has an area of 49π. What is its circumference?", "choices": ["7π", "14π", "49π", "98π"], "answer": 1, "rule": "A = πr², C = 2πr", "explanation": {"right": "r² = 49, so r = 7. C = 2π × 7 = 14π.", "wrong": ["7π forgets the 2.", "", "49π is the area.", "This doubles the area."]}, "id": "m0165", "checked": true, "by": "seed"}, {"section": "math", "topic": "m-circles", "stem": "A central angle of 90° cuts a sector from a circle of radius 4. What is the sector's area?", "choices": ["π", "16π", "8π", "4π"], "answer": 3, "rule": "Sector area = (θ/360) · πr²", "explanation": {"right": "(90/360) × π × 16 = 4π.", "wrong": ["This uses r instead of r².", "16π is the whole circle.", "This uses half the circle.", ""]}, "id": "m0166", "checked": true, "by": "seed"}, {"section": "math", "topic": "m-circles", "stem": "An inscribed angle intercepts an arc of 80°. What is the measure of the angle?", "choices": ["40°", "80°", "100°", "160°"], "answer": 0, "rule": "Inscribed angle = half its arc", "explanation": {"right": "80 ÷ 2 = 40.", "wrong": ["", "A central angle equals its arc, not an inscribed one.", "This subtracts from 180.", "This doubles instead of halving."]}, "id": "m0167", "checked": true, "by": "seed"}, {"section": "math", "topic": "m-circles", "stem": "What is the equation of a circle with center (0, 0) and radius 5?", "choices": ["(x − 5)² + (y − 5)² = 0", "x² + y² = 10", "x² + y² = 5", "x² + y² = 25"], "answer": 3, "rule": "Circle: (x − h)² + (y − k)² = r²", "explanation": {"right": "r² = 25, so x² + y² = 25.", "wrong": ["This puts the radius in the center.", "This doubles r.", "The right side must be r², not r.", ""]}, "id": "m0168", "checked": true, "by": "seed"}, {"section": "math", "topic": "m-area", "stem": "A cube has a volume of 64 cubic inches. What is the length of one edge?", "choices": ["4 in", "8 in", "16 in", "21.3 in"], "answer": 0, "rule": "Cube volume = s³", "explanation": {"right": "s³ = 64, so s = ∛64 = 4.", "wrong": ["", "This takes the square root.", "This divides by 4.", "This divides by 3."]}, "id": "m0169", "checked": true, "by": "seed"}, {"section": "math", "topic": "m-area", "stem": "A cone has radius 3 and height 4. What is its volume?", "choices": ["12π", "36π", "4π", "48π"], "answer": 0, "rule": "Cone volume = ⅓πr²h", "explanation": {"right": "⅓ × π × 9 × 4 = 12π.", "wrong": ["", "This forgets the ⅓.", "This forgets to square the radius.", "This uses r = 4 and h = 3."]}, "id": "m0170", "checked": true, "by": "seed"}, {"section": "math", "topic": "m-area", "stem": "A parallelogram has a base of 10 and a slanted side of 6. Its height is 5. What is its area?", "choices": ["25", "30", "50", "60"], "answer": 2, "rule": "Parallelogram area = base × height", "explanation": {"right": "10 × 5 = 50. The slanted side is not the height.", "wrong": ["This uses ½ like a triangle.", "This uses the slanted side and height.", "", "This uses the slanted side as the height."]}, "id": "m0171", "checked": true, "by": "seed"}, {"section": "math", "topic": "m-area", "stem": "A rectangular box is 2 by 3 by 4 feet. What is its total surface area?", "choices": ["24 ft²", "26 ft²", "52 ft²", "48 ft²"], "answer": 2, "rule": "Surface area: add the area of every face", "explanation": {"right": "2(2×3) + 2(2×4) + 2(3×4) = 12 + 16 + 24 = 52.", "wrong": ["24 is the volume.", "This counts each face only once.", "", "This doesn't match the sum."]}, "id": "m0172", "checked": true, "by": "seed"}, {"section": "math", "topic": "m-coord", "stem": "The midpoint of segment AB is (3, 4). A is (1, 1). What is B?", "choices": ["(2, 2.5)", "(5, 7)", "(4, 5)", "(7, 5)"], "answer": 1, "rule": "Midpoint: average the coordinates", "explanation": {"right": "(1 + x)/2 = 3 gives x = 5. (1 + y)/2 = 4 gives y = 7.", "wrong": ["This is the midpoint of A and the midpoint.", "", "This adds 1 to each midpoint value.", "The coordinates are swapped."]}, "id": "m0173", "checked": true, "by": "seed"}, {"section": "math", "topic": "m-coord", "stem": "The point (4, −2) is reflected over the y axis. What is the new point?", "choices": ["(−4, −2)", "(4, 2)", "(−4, 2)", "(−2, 4)"], "answer": 0, "rule": "Reflect over the y axis: (−x, y)", "explanation": {"right": "Flip the sign of x: (−4, −2).", "wrong": ["", "This reflects over the x axis.", "This flips both signs.", "This swaps the coordinates."]}, "id": "m0174", "checked": true, "by": "seed"}, {"section": "math", "topic": "m-coord", "stem": "A point at (1, 3) is translated 4 units left and 2 units up. Where does it land?", "choices": ["(5, 5)", "(−3, 5)", "(−3, 1)", "(5, 1)"], "answer": 1, "rule": "Translations: left/right changes x, up/down changes y", "explanation": {"right": "x: 1 − 4 = −3. y: 3 + 2 = 5.", "wrong": ["This moves right instead of left.", "", "This moves down instead of up.", "This moves right and down."]}, "id": "m0175", "checked": true, "by": "seed"}, {"section": "math", "topic": "m-coord", "stem": "The point (−3, 6) is reflected over the line y = x. What is the new point?", "choices": ["(6, −3)", "(3, −6)", "(−6, 3)", "(3, 6)"], "answer": 0, "rule": "Reflect over y = x: (y, x)", "explanation": {"right": "Swap the coordinates: (6, −3).", "wrong": ["", "This flips both signs.", "This swaps and flips both signs.", "This only flips the x sign."]}, "id": "m0176", "checked": true, "by": "seed"}, {"section": "math", "topic": "m-advanced", "stem": "Which is equivalent to log 20 + log 5?", "choices": ["log 25", "2", "log 15", "100"], "answer": 1, "rule": "log(xy) = log x + log y", "explanation": {"right": "log 20 + log 5 = log 100 = 2.", "wrong": ["This adds inside the log.", "", "This subtracts inside the log.", "100 is inside the log. log 100 = 2."]}, "id": "m0177", "checked": true, "by": "seed"}, {"section": "math", "topic": "m-advanced", "stem": "What is (3 + 2i)(1 − i)?", "choices": ["3 − 2i", "5 − i", "1 − i", "3 + 2i²"], "answer": 1, "rule": "Complex numbers: i² = −1", "explanation": {"right": "3 − 3i + 2i − 2i² = 3 − i + 2 = 5 − i.", "wrong": ["This multiplies only matching parts.", "", "This forgets that −2i² = +2.", "This stops before using i² = −1."]}, "id": "m0178", "checked": true, "by": "seed"}, {"section": "math", "topic": "m-advanced", "stem": "If log₃ x = 4, what is x?", "choices": ["7", "12", "64", "81"], "answer": 3, "rule": "log_a(b) = c means aᶜ = b", "explanation": {"right": "3⁴ = 81.", "wrong": ["This adds 3 and 4.", "This multiplies 3 by 4.", "This uses 4³.", ""]}, "id": "m0179", "checked": true, "by": "seed"}, {"section": "math", "topic": "m-advanced", "stem": "For f(x) = (x² − 4)/(x − 2), where is f undefined?", "choices": ["x = −2", "x = 2 and x = −2", "Nowhere", "x = 2"], "answer": 3, "rule": "Rational expressions are undefined where the denominator is 0", "explanation": {"right": "The denominator x − 2 is 0 when x = 2. The numerator doesn't matter.", "wrong": ["At x = −2, the denominator is −4, which is fine.", "Only the denominator matters.", "At x = 2 the denominator is 0.", ""]}, "id": "m0180", "checked": true, "by": "seed"}, {"section": "reading", "topic": "r-main", "passage": "Nora had walked past the bakery every morning for three years without going in. Today the smell of cinnamon stopped her at the door. Inside, an old man was pulling trays from the oven with slow, careful hands. He looked up and smiled as if he had been expecting her. \"First visit,\" he said. It was not a question. Nora bought one roll, then, to her own surprise, a second one for tomorrow.", "stem": "The passage mainly describes:", "choices": ["why Nora dislikes the baker.", "how cinnamon rolls are made.", "Nora's first visit to a bakery she had passed many times.", "the history of a family bakery."], "answer": 2, "rule": "Main idea must cover the whole passage", "explanation": {"right": "The whole passage follows Nora as she finally goes into the bakery she had walked past for three years.", "wrong": ["Nothing shows Nora dislikes the baker. She even buys a second roll.", "Baking is only mentioned in passing.", "", "The passage never gives the bakery's history."]}, "id": "r0001", "checked": true, "by": "seed"}, {"section": "reading", "topic": "r-main", "passage": "In the 1950s, many American cities tore down neighborhoods to build highways. Planners argued that faster roads would bring shoppers downtown. Instead, many families moved to the suburbs, and downtown stores lost customers. Some cities are now removing highways and replacing them with parks and streets. Early results suggest that these changes can bring people back, though the projects are expensive.", "stem": "The main purpose of the passage is to:", "choices": ["argue that all highways should be removed.", "describe how highways are built.", "explain how highways meant to help downtowns often hurt them, and how some cities are responding.", "compare cities and suburbs."], "answer": 2, "rule": "Main idea must cover the whole passage", "explanation": {"right": "The passage covers the plan, what actually happened, and how cities are now removing highways. Only this choice covers all of it.", "wrong": ["\"All\" is too extreme. The passage only says some cities are removing highways.", "Building methods are never discussed.", "", "Suburbs are mentioned, but comparing them is not the purpose."]}, "id": "r0002", "checked": true, "by": "seed"}, {"section": "reading", "topic": "r-main", "passage": "Tardigrades are tiny animals, less than a millimeter long, that live in moss and wet soil. When their home dries out, they curl into a ball and lose almost all the water in their bodies. In this state, called a tun, they can survive freezing, boiling, and even the vacuum of space. When water returns, they take it back in and go on with their lives. Scientists study tardigrades to learn how cells can be protected from damage.", "stem": "The passage is mainly about:", "choices": ["where tardigrades live.", "how tardigrades survive harsh conditions and why scientists study them.", "the vacuum of space.", "why moss stays wet."], "answer": 1, "rule": "Main idea must cover the whole passage", "explanation": {"right": "Most of the passage explains the tun state and how it protects tardigrades, then says why scientists study them.", "wrong": ["Where they live is one detail, too narrow.", "", "Space is one example of a harsh condition.", "Moss is mentioned only as a home."]}, "id": "r0003", "checked": true, "by": "seed"}, {"section": "reading", "topic": "r-main", "passage": "Many people think of jazz as music that is made up on the spot. That is only partly true. Jazz musicians do improvise, but they work within a structure: a set of chords that repeats as the song goes on. Learning to improvise means learning that structure so well that you can play freely inside it. In this way, jazz is less like a free fall and more like a dance with a partner you know well.", "stem": "The author's main point is that:", "choices": ["jazz improvisation depends on knowing a structure well.", "jazz is entirely made up on the spot.", "jazz musicians rarely practice.", "jazz is harder than classical music."], "answer": 0, "rule": "Main idea must cover the whole passage", "explanation": {"right": "The author says jazz is only partly made up on the spot. Improvising works inside a repeating set of chords that players learn well.", "wrong": ["", "The author says this view is only partly true.", "The passage says players learn the structure deeply, which takes practice.", "Classical music is never mentioned."]}, "id": "r0004", "checked": true, "by": "seed"}, {"section": "reading", "topic": "r-main", "passage": "Grandpa's workshop smelled of sawdust and old coffee. Every Saturday, Eli sat on the tall stool and watched him shape chair legs on the lathe. Grandpa rarely spoke while he worked. When Eli asked a question, Grandpa would hand him a tool instead of answering. By the end of the summer, Eli's hands knew things that no one had ever told him.", "stem": "The passage mainly focuses on:", "choices": ["Eli learning woodworking by watching and working beside his grandfather.", "how to use a lathe safely.", "the history of the workshop.", "why Grandpa stopped talking."], "answer": 0, "rule": "Main idea must cover the whole passage", "explanation": {"right": "The passage shows Eli watching Grandpa each Saturday and learning through doing, not through explanations.", "wrong": ["", "Safety is never discussed.", "The workshop's history isn't given.", "The passage never says Grandpa stopped talking. He just spoke rarely while working."]}, "id": "r0005", "checked": true, "by": "seed"}, {"section": "reading", "topic": "r-main", "passage": "A 2019 survey asked 1,200 teenagers how they got to school. About 40 percent rode a bus, 35 percent rode in a family car, 15 percent walked or biked, and 10 percent drove themselves. Students who walked or biked were more likely to say they felt awake in first period. The researchers noted, however, that students who walk usually live closer to school and may simply sleep later.", "stem": "Which choice best states the main idea of the passage?", "choices": ["Most teens drive themselves to school.", "Walking to school makes students more awake.", "A survey found a link between walking or biking and feeling awake, though another explanation is possible.", "Buses are the safest way to get to school."], "answer": 2, "rule": "Main idea must cover the whole passage", "explanation": {"right": "The passage reports the survey, the link to feeling awake, and the researchers' warning about another explanation.", "wrong": ["Only 10 percent drove themselves.", "The researchers did not say walking causes it. They noted another explanation.", "", "Safety is never discussed."]}, "id": "r0006", "checked": true, "by": "seed"}, {"section": "reading", "topic": "r-main", "passage": "Monarch butterflies travel up to 3,000 miles each fall from Canada and the northern United States to forests in central Mexico. No single butterfly makes the round trip. The monarchs that fly south live for about eight months, far longer than summer monarchs, which live only a few weeks. In spring, the travelers start north, but it takes three or four short generations to reach Canada. Then a new long living generation flies south again.", "stem": "The passage is mainly about:", "choices": ["how monarchs choose their food.", "how the monarch migration is completed across several generations.", "forests in central Mexico.", "why monarchs are endangered."], "answer": 1, "rule": "Main idea must cover the whole passage", "explanation": {"right": "The passage explains that no single monarch makes the round trip, and that the trip takes several generations.", "wrong": ["Food is never mentioned.", "", "Mexico is only the destination.", "The passage never says they are endangered."]}, "id": "r0007", "checked": true, "by": "seed"}, {"section": "reading", "topic": "r-main", "passage": "Rosa Alvarez did not paint her first mural until she was fifty. For thirty years she had worked as a seamstress, and she said that sewing taught her to see a large design as many small pieces. Her murals are made of hundreds of small, bright shapes that seem to stitch together into one image. Critics at first called her work simple. Today, art students visit her walls to study how she balanced color across such large spaces.", "stem": "The passage mainly discusses:", "choices": ["why critics dislike murals.", "how Alvarez's years of sewing shaped her murals and how views of her work changed.", "the history of San Antonio.", "how to sew a quilt."], "answer": 1, "rule": "Main idea must cover the whole passage", "explanation": {"right": "The passage links her sewing career to her style, then shows critics' early vie e and only the tools have changed.", "wrong": ["Tax classes are one example, too narrow.", "The passage never says libraries stopped lending books.", "Popularity is never discussed.", ""]}, "id": "r0010", "checked": true, "by": "seed"}, {"section": "reading", "topic": "r-main", "passage": "Octopuses can change the color of their skin in less than a second. They do this with thousands of cells called chromatophores, each holding a tiny sac of pigment. Muscles around each sac stretch it open to show more color or squeeze it shut to hide it. Strangely, most octopuses are thought to be colorblind. Scientists are still testing ideas about how they match colors they may not be able to see.", "stem": "The passage is mainly about:", "choices": ["how octopuses hunt.", "where octopuses live.", "how octopuses change color and the puzzle of how they match colors.", "why octopuses are colorblind."], "answer": 2, "rule": "Main idea must cover the whole passage", "explanation": {"right": "The passage explains the color changing cells, then raises the question of how colorblind animals match colors.", "wrong": ["Hunting isn't discussed.", "Habitat isn't discussed.", "", "Colorblindness is one part, too narrow."]}, "id": "r0011", "checked": true, "by": "seed"}, {"section": "reading", "topic": "r-main", "passage": "The first public museums opened in Europe in the 1700s. Before then, art and rare objects were usually kept in private collections that only wealthy guests could see. Opening these collections to everyone was a bold idea. Some people worried that ordinary visitors would damage the objects. Instead, museums became places where people of all backgrounds could see the same works side by side.", "stem": "The passage mainly discusses:", "choices": ["why wealthy people collected art.", "damage done by museum visitors.", "the shift from private collections to public museums.", "how to care for old paintings."], "answer": 2, "rule": "Main idea must cover the whole passage", "expla jects. Instead, museums became places where people of all backgrounds could see the same works side by side.", "stem": "The sentence \"Some people worried that ordinary visitors would damage the objects\" mainly serves to:", "choices": ["explain why museums charge fees.", "describe a famous painting.", "prove that visitors damaged art.", "present a concern that turned out to be wrong."], "answer": 3, "rule": "Function: ask why the detail is there", "explanation": {"right": "The next sentence starts with \"Instead,\" showing the worry didn't come true.", "wrong": ["Fees aren't mentioned.", "No painting is described.", "The passage says the opposite happened.", ""]}, "id": "r0075", "checked": true, "by": "seed"}, {"section": "reading", "topic": "r-function", "passage": "Researchers gave two groups of shoppers the same jam samples. One table offered six flavors; the other offered twenty four. More shoppers stopped at the table with twenty four flavors, but far fewer of them bought a jar. The researchers suggested that too many choices can make deciding harder. Later studies found the effect is not always this strong, so the question is still debated.", "stem": "The last sentence mainly serves to:", "choices": ["describe how jam is sold.", "name the researchers.", "repeat the study's results.", "show that the findings have been questioned."], "answer": 3, "rule": "Function: ask why the detail is there", "explanation": {"right": "It says later studies found the effect isn't always strong, so the question is debated.", "wrong": ["Selling isn't described.", "No researchers are named.", "It adds new information, not a repeat.", ""]}, "id": "r0076", "checked": true, "by": "seed"}, {"section": "reading", "topic": "r-function", "passage": "Bamboo is a grass, not a tree. Some kinds can grow almost three feet in a single day, which makes them among the fastest growing plants on Earth. Because it grows back quickly after being cut, bamboo is often used for flooring and furniture. eed"}, {"section": "reading", "topic": "r-paired", "passage": "Passage A: Modern zoos run breeding programs that have saved several species from extinction. Animals born in these programs can sometimes be returned to the wild. Zoos also teach millions of visitors each year about animals they might never see otherwise.\n\nPassage B: Even well run zoos cannot give large animals the space they would have in the wild. Elephants and big cats often show signs of stress in captivity, such as pacing. Sanctuaries, which give animals much more room and fewer visitors, may be a better choice for these species.", "stem": "The author of Passage B would most likely respond to Passage A's point about breeding programs by saying that:", "choices": ["breeding programs don't exist.", "zoos should get more visitors.", "all animals should be released at once.", "large animals may still suffer in zoos, so sanctuaries may be better for them."], "answer": 3, "rule": "Paired passages: know each author's position first", "explanation": {"right": "Passage B focuses on stress in large animals and suggests sanctuaries. That's the likely response.", "wrong": ["Passage B never denies breeding programs.", "Passage B prefers fewer visitors.", "\"All animals at once\" is too extreme.", ""]}, "id": "r0081", "checked": true, "by": "seed"}, {"section": "reading", "topic": "r-paired", "passage": "Passage A: Modern zoos run breeding programs that have saved several species from extinction. Animals born in these programs can sometimes be returned to the wild. Zoos also teach millions of visitors each year about animals they might never see otherwise.\n\nPassage B: Even well run zoos cannot give large animals the space they would have in the wild. Elephants and big cats often show signs of stress in captivity, such as pacing. Sanctuaries, which give animals much more room and fewer visitors, may be a better choice for these species.", "stem": "Both passages discuss:", "choices": ["hunting laws.", "animals

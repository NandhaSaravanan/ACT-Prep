// ===== Preparing a test: the steps =====
const Prep = {
  // Text PDFs: parse locally.
  async fromText(pdf, log) {
    log("Reading the text of each page");
    const pages = await PDFX.textPages(pdf, (i, n) => log(`Reading page ${i} of ${n}`, true));
    const a = PARSER.analyze(pages, pdf.name);
    const total = Object.values(a.counts).reduce((s, x) => s + x, 0);
    if (a.textChars < 20000 || total < 120) return { scanned: true, pages };
    const info = {
      v: 2, fp: pdf.fp, fileName: pdf.name, form: a.form, scanned: false, numPages: pdf.numPages,
      sectionPages: Object.fromEntries(SECTIONS.map(s => [s, a.smap.map((m, i) => m.section === s ? i : -1).filter(i => i >= 0)])),
      boxes: a.boxes, keys: a.keys, conversion: a.conversion, conversionEstimated: !a.conversion,
      counts: a.counts, catsEstimated: false, updated: Date.now(),
      keyPages: a.smap.map((m, i) => m.kind === "key" || m.kind === "conversion" ? i : -1).filter(i => i >= 0),
    };
    log(`Found ${total} questions${a.form ? " in form " + a.form : ""}`);
    return { info, pages, analysis: a };
  },

  // Ask Claude where each question starts on the given pages.
  async layoutPages(pdf, indexes, log, signal) {
    const lim = await imageLimits();
    if (!lim) throw { code: "images_unavailable" };
    const per = clamp(lim.maxCount || 5, 1, 8);
    const pageInfo = [];
    for (let k = 0; k < indexes.length; k += per) {
      const idx = indexes.slice(k, k + per);
      log(`Claude is reading pages ${idx[0] + 1} to ${idx[idx.length - 1] + 1} of ${pdf.numPages}`, true);
      const imgs = [];
      for (const i of idx) imgs.push(await canvasToBlob(await PDFX.render(pdf, i, 1000), "image/jpeg", 0.8));
      const prompt = `You are helping a student set up a practice test from a test booklet. The ${idx.length} images are booklet pages ${idx.map(i => i + 1).join(", ")}, in that order.
For each page, report:
- "kind": "english", "math", "reading" or "science" if the page has questions from that test; "key" if it is a scoring key or answer key; "conversion" if it is the raw score to scale score table; otherwise "other" (cover, directions only, writing test, ads).
- "rotation": degrees clockwise needed to make the page upright: 0, 90, 180 or 270.
- "questions": for question pages, every question that STARTS on this page: its number "n", its column "col" ("left", "right" or "full"), and "top", where its number appears as a fraction of the upright page height (0 = top, 1 = bottom).
- "form": the form code if printed on the page (like "70G", "Z04", "A11"), else "".
Reply with only JSON: [{"page": 1, "kind": "english", "rotation": 0, "questions": [{"n": 1, "col": "right", "top": 0.42}], "form": ""}]`;
      const res = await askJSON(prompt, { images: imgs, signal, modelTier: "default" });
      for (const r of Array.isArray(res) ? res : []) if (r && r.page) pageInfo[r.page - 1] = r;
    }
    return pageInfo;
  },
  boxesFromLayout(pageInfo, sec, pagesOfSec) {
    const out = {};
    for (const pi of pagesOfSec) {
      const qs = ((pageInfo[pi] || {}).questions || []).filter(q => q && q.n > 0 && q.n <= PARSER.OLD_COUNT[sec]);
      for (const col of ["left", "right", "full"]) {
        const list = qs.filter(q => (q.col || "full") === col).sort((a, b) => a.top - b.top);
        list.forEach((q, i) => {
          const top = clamp(Number(q.top) - 0.012, 0.03, 0.95);
          const bottom = i + 1 < list.length ? clamp(Number(list[i + 1].top) - 0.015, top + 0.02, 0.95) : 0.93;
          const x = col === "right" ? 0.5 : 0.05, w = col === "full" ? 0.9 : 0.45;
          if (!out[q.n]) out[q.n] = { page: pi, x, y: top, w, h: bottom - top, approx: true };
        });
      }
    }
    return out;
  },

  // Scanned PDFs: ask Claude to read the pages.
  async fromScan(pdf, log, signal) {
    const all = []; for (let i = 0; i < pdf.numPages; i++) all.push(i);
    const pageInfo = await this.layoutPages(pdf, all, log, signal);
    const form = (pageInfo.find(p => p && p.form) || {}).form || "";
    const sectionPages = Object.fromEntries(SECTIONS.map(s => [s, pageInfo.map((p, i) => p && p.kind === s ? i : -1).filter(i => i >= 0)]));
    const boxes = Object.fromEntries(SECTIONS.map(s => [s, this.boxesFromLayout(pageInfo, s, sectionPages[s])]));
    const rotations = pageInfo.map(p => (p && p.rotation) || 0);
    const info = {
      v: 2, fp: pdf.fp, fileName: pdf.name, form: String(form).toUpperCase(), scanned: true, numPages: pdf.numPages,
      sectionPages, boxes, rotations, keys: {}, conversion: null, conversionEstimated: true,
      counts: Object.fromEntries(SECTIONS.map(s => [s, Object.keys(boxes[s]).length])), updated: Date.now(),
      keyPages: pageInfo.map((p, i) => p && (p.kind === "key" || p.kind === "conversion") ? i : -1).filter(i => i >= 0),
    };
    return { info };
  },

  // Text PDFs whose text came from rough text recognition: let Claude fill the gaps.
  keyComplete(info, s) {
    const a = info.keys?.[s]?.answers || {};
    for (let n = 1; n <= PARSER.OLD_COUNT[s]; n++) if (!a[n] || !letterSet(s, n).includes(a[n])) return false;
    return true;
  },
  async repairText(pdf, info, log, signal) {
    const secs = SECTIONS.filter(s => (info.sectionPages[s] || []).length);
    // Question positions
    const weakLayout = secs.filter(s => Object.keys(info.boxes[s] || {}).length < PARSER.OLD_COUNT[s] * 0.95);
    if (weakLayout.length) {
      log("Some question numbers were hard to read, so Claude is checking those pages");
      const idx = [...new Set(weakLayout.flatMap(s => info.sectionPages[s]))].sort((a, b) => a - b);
      const pageInfo = await this.layoutPages(pdf, idx, log, signal);
      for (const s of weakLayout) {
        const add = this.boxesFromLayout(pageInfo, s, info.sectionPages[s]);
        for (const [n, b] of Object.entries(add)) if (!info.boxes[s][n]) info.boxes[s][n] = b;
        info.counts[s] = Object.keys(info.boxes[s]).length;
      }
    }
    // Answer key and score table
    const weakKey = secs.filter(s => !this.keyComplete(info, s));
    if ((weakKey.length || !info.conversion) && (info.keyPages || []).length) {
      log(weakKey.length ? "The answer key text is hard to read, so Claude is reading the key pages" : "Claude is reading the score table", true);
      const canv = [];
      for (const pi of info.keyPages) canv.push(await PDFX.render(pdf, pi, 1500));
      const k = await this.keyFromImages(canv, log, signal);
      // If any part of the text key was garbled, trust none of it: use Claude's read for every section.
      for (const s of (weakKey.length ? secs : [])) {
        if (!k.keys[s]) continue;
        const old = info.keys[s] || { answers: {}, categories: {} };
        const cats = Object.keys(k.keys[s].categories || {}).length ? k.keys[s].categories : old.categories;
        info.keys[s] = { answers: { ...k.keys[s].answers }, categories: cats || {} };
      }
      if (!info.conversion && k.conversion) { info.conversion = k.conversion; info.conversionEstimated = false; }
      if (k.form) info.form = k.form;
      if (weakKey.length) { info.keyFromClaude = true; info.keyConfirmed = false; }
      log(weakKey.length ? "Claude read the answer key. You'll check it before starting." : "Claude read the score table");
    }
  },

  // Read an answer key and score table from page images (scanned booklets, or a separate key file).
  async keyFromImages(canvases, log, signal) {
    const lim = await imageLimits();
    if (!lim) throw { code: "images_unavailable" };
    // Split each page into top and bottom halves so small print stays readable.
    const parts = [];
    for (const c of canvases) {
      parts.push(PDFX.crop(c, 0, 0, 1, 0.55), PDFX.crop(c, 0, 0.45, 1, 0.55));
    }
    const per = clamp(lim.maxCount || 5, 1, 8);
    const out = { keys: {}, conversion: null, form: "" };
    for (let i = 0; i < parts.length; i += per) {
      const batch = parts.slice(i, i + per);
      log(`Claude is reading the answer key (part ${Math.floor(i / per) + 1} of ${Math.ceil(parts.length / per)})`, true);
      const imgs = [];
      for (const c of batch) imgs.push(await canvasToBlob(c, "image/jpeg", 0.85));
      const prompt = `These images are pieces of a practice test booklet's scoring key and/or its raw score to scale score conversion table. Neighboring pieces overlap a little.
Read exactly what is printed. Do not guess. If a piece has no key or table, skip it.
Reply with only JSON:
{"form": "the form code printed on the page, like B02 or Z04, else empty",
 "answers": {"english": {"1": "C", "2": "J"}, "math": {}, "reading": {}, "science": {}},
 "categories": {"english": {"1": "CSE"}, "math": {"1": "A"}, "reading": {}, "science": {}},
 "conversion": {"english": [[36, 72, 75], [35, 70, 71]], "math": [], "reading": [], "science": []}}
"answers": the key letter for each question number. "categories": the reporting category code marked for that question if the key shows one (like POW, KLA, CSE, N, A, F, G, S, IES, KID, CS, IKI, IOD, SIN, EMI, UM, RH), else leave it out. "conversion": rows of [scale score, lowest raw score, highest raw score] for each test; leave out rows shown as a dash.`;
      const r = await askJSON(prompt, { images: imgs, signal, modelTier: "complex" });
      if (!out.form && r?.form && /\d/.test(r.form) && String(r.form).length <= 5) out.form = String(r.form).toUpperCase().trim();
      for (const s of SECTIONS) {
        const a = r?.answers?.[s] || {}, c = r?.categories?.[s] || {};
        for (const [n, L] of Object.entries(a)) {
          const letter = String(L).trim().toUpperCase();
          // Odd questions use A to D (or E in Math), even ones F to J (or K). Anything else is a misread.
          if (letterSet(s, +n).includes(letter)) (out.keys[s] ||= { answers: {}, categories: {} }).answers[n] = letter;
        }
        for (const [n, C] of Object.entries(c)) if (C) ((out.keys[s] ||= { answers: {}, categories: {} }).categories[n] = [String(C).trim().toUpperCase()]);
        const rows = r?.conversion?.[s];
        if (Array.isArray(rows) && rows.length) {
          out.conversion ||= { english: {}, math: {}, reading: {}, science: {} };
          for (const row of rows) { const [sc, lo, hi] = row.map(Number); if (sc >= 1 && sc <= 36 && lo >= 0 && hi >= lo) for (let x = lo; x <= hi; x++) out.conversion[s][x] = sc; }
        }
      }
    }
    return out;
  },

  // Estimate English reporting categories when the key doesn't give POW/KLA/CSE.
  async classifyEnglish(pdf, info, pages, log, signal) {
    const items = [];
    const n75 = Object.keys(info.boxes.english || {}).map(Number).sort((a, b) => a - b);
    log("Claude is sorting the English questions into the enhanced categories", true);
    const rule = `Categories: POW = Production of Writing (transitions, adding or deleting sentences, purpose, placement, order, intro and conclusion, main idea). KLA = Knowledge of Language (word choice, concision and redundancy, tone and style, precise wording). CSE = Conventions of Standard English (punctuation, sentence structure, agreement, pronouns, verb forms, modifiers, parallelism, apostrophes, idioms).
Reply with only JSON mapping question number to code, like {"1": "CSE", "2": "POW"}.`;
    let res = {};
    if (pages) {
      const found = PARSER.analyze(pages, "").found;
      for (const n of n75) items.push(PARSER.questionText(pages, found, "english", n).slice(0, 700));
      res = await askJSON(`Sort these practice test English questions into reporting categories.\n${rule}\n\n` + items.join("\n\n---\n\n"), { signal, modelTier: "default" });
    } else {
      const lim = await imageLimits();
      const per = clamp(lim?.maxCount || 5, 1, 8);
      const pgs = info.sectionPages.english;
      for (let i = 0; i < pgs.length; i += per) {
        const imgs = [];
        for (const pi of pgs.slice(i, i + per)) imgs.push(await canvasToBlob(PDFX.rotate(await PDFX.render(pdf, pi, 1000), info.rotations?.[pi] || 0), "image/jpeg", 0.8));
        const r = await askJSON(`These are English test pages. Sort every numbered question on them into a reporting category.\n${rule}`, { images: imgs, signal, modelTier: "default" });
        Object.assign(res, r || {});
      }
    }
    const k = (info.keys.english ||= { answers: {}, categories: {} });
    for (const [n, c] of Object.entries(res || {})) if (["POW", "KLA", "CSE"].includes(String(c).toUpperCase())) k.categories[n] = [String(c).toUpperCase()];
    info.catsEstimated = true;
  },
};

function englishCatsOfficial(info) {
  const c = info.keys?.english?.categories || {};
  const vals = Object.values(c).map(v => v[0]);
  return vals.length >= 60 && vals.every(v => ["POW", "KLA", "CSE"].includes(v));
}

// ===== Turning an old full-length test into the enhanced format =====
const ENGLISH_MIX = { POW: 20, KLA: 10, CSE: 20 }; // 40% / 20% / 40% of 50

function primaryCat(sec, cats) {
  if (!cats || !cats.length) return "?";
  if (sec === "math") return cats.find(c => ["N", "A", "F", "G", "S"].includes(c)) || (cats.includes("IES") ? "IES" : cats[0]);
  return cats[0];
}

// Pick `k` items from each group so the total category counts land near `target`.
// `forced` items must be kept (they can't be covered on the page).
function pickByGroups(groups, k, catOf, target, forced) {
  let best = null, bestScore = Infinity;
  for (let attempt = 0; attempt < 40; attempt++) {
    const chosen = groups.map(g => {
      const must = g.filter(n => forced.has(n));
      const rest = shuffle(g.filter(n => !forced.has(n)));
      return must.concat(rest).slice(0, Math.max(k, must.length));
    });
    const counts = () => { const c = {}; chosen.flat().forEach(n => c[catOf(n)] = (c[catOf(n)] || 0) + 1); return c; };
    const score = () => { const c = counts(); return Object.keys({ ...target, ...c }).reduce((s, key) => s + Math.abs((c[key] || 0) - (target[key] || 0)), 0); };
    let cur = score();
    for (let iter = 0; iter < 400 && cur > 0; iter++) {
      const gi = Math.floor(Math.random() * groups.length);
      const inside = chosen[gi].filter(n => !forced.has(n));
      const outside = groups[gi].filter(n => !chosen[gi].includes(n));
      if (!inside.length || !outside.length) continue;
      const a = inside[Math.floor(Math.random() * inside.length)], b = outside[Math.floor(Math.random() * outside.length)];
      chosen[gi][chosen[gi].indexOf(a)] = b;
      const nxt = score();
      if (nxt <= cur) cur = nxt; else chosen[gi][chosen[gi].indexOf(b)] = a;
    }
    if (cur < bestScore) { bestScore = cur; best = chosen.map(c => c.slice()); }
    if (cur === 0) break;
  }
  return best.flat().sort((a, b) => a - b);
}

function buildEnhanced(info) {
  const plan = { sections: {}, notes: [] };
  for (const sec of SECTIONS) {
    const key = info.keys?.[sec];
    const nums = Object.keys(key?.answers || {}).map(Number).filter(n => n >= 1 && n <= PARSER.OLD_COUNT[sec]).sort((a, b) => a - b);
    if (!nums.length || !(info.sectionPages?.[sec] || []).length) continue;
    const located = new Set(Object.keys(info.boxes?.[sec] || {}).map(Number));
    const forced = new Set(nums.filter(n => !located.has(n)));
    const catOf = n => primaryCat(sec, key.categories?.[n]);
    let qs;
    if (sec === "english") {
      const groups = [];
      for (let s = 1; s <= 75; s += 15) groups.push(nums.filter(n => n >= s && n < s + 15));
      qs = pickByGroups(groups.filter(g => g.length), 10, catOf, ENGLISH_MIX, forced);
      const c = {}; qs.forEach(n => c[catOf(n)] = (c[catOf(n)] || 0) + 1);
      plan.sections.english = { qs, mix: c };
      plan.notes.push(info.catsEstimated
        ? `English categories were sorted by Claude, so the ${c.POW || 0} / ${c.KLA || 0} / ${c.CSE || 0} mix (Production of Writing / Knowledge of Language / Conventions) is an estimate.`
        : `English uses this booklet's official categories: ${c.POW || 0} Production of Writing, ${c.KLA || 0} Knowledge of Language, ${c.CSE || 0} Conventions.`);
    } else if (sec === "math") {
      // Questions get harder as they go, so keep 15 from each third and keep the category balance.
      const groups = [nums.filter(n => n <= 20), nums.filter(n => n > 20 && n <= 40), nums.filter(n => n > 40)];
      const all = {}; nums.forEach(n => all[catOf(n)] = (all[catOf(n)] || 0) + 1);
      const target = Object.fromEntries(Object.entries(all).map(([k, v]) => [k, Math.round(v * 45 / nums.length)]));
      qs = pickByGroups(groups, 15, catOf, target, forced);
      plan.sections.math = { qs };
      plan.notes.push("Math keeps all 5 answer choices from the original test. The real enhanced test has 4.");
    } else if (sec === "reading") {
      const groups = [];
      for (let s = 1; s <= 40; s += 10) groups.push(nums.filter(n => n >= s && n < s + 10));
      qs = pickByGroups(groups.filter(g => g.length), 9, () => "x", {}, forced);
      plan.sections.reading = { qs };
      plan.notes.push("Reading drops 1 question from each passage, so 40 becomes 36.");
    } else {
      qs = nums.slice();
      plan.sections.science = { qs };
    }
    plan.sections[sec].count = plan.sections[sec].qs.length;
    plan.sections[sec].minutes = FORMAT[sec].minutes;
    if (forced.size) plan.notes.push(`${SECTION_NAMES[sec]}: ${forced.size} question${forced.size > 1 ? "s" : ""} couldn't be found on the page, so ${forced.size > 1 ? "they were" : "it was"} kept in the test.`);
  }
  if (info.conversionEstimated) plan.notes.push("This booklet has no score table we could read, so scores use a typical table and are a rough estimate.");
  return plan;
}

// Enhanced raw score to scale score, using this booklet's table scaled to the shorter length.
function scaleScore(info, sec, raw, outOf) {
  const old = PARSER.OLD_COUNT[sec];
  const eq = clamp(Math.round(raw * old / outOf), 0, old);
  const table = info.conversion?.[sec];
  if (table && Object.keys(table).length > old * 0.6) {
    for (let r = eq; r >= 0; r--) if (table[r] != null) return table[r];
    return 1;
  }
  return GENERIC_CONVERSION[sec][eq] || 1;
}
function letterSet(sec, n) {
  const five = sec === "math";
  const odd = n % 2 === 1;
  return odd ? (five ? ["A", "B", "C", "D", "E"] : ["A", "B", "C", "D"]) : (five ? ["F", "G", "H", "J", "K"] : ["F", "G", "H", "J"]);
}

routes.prepare = async (main, f) => {
  if (!f) return go("tests");

  let ctl = new AbortController();
  const stopBtn = h("button", { class: "btn sm", onclick: () => { ctl.abort(); } }, "Stop");
  main.append(h("h1", {}, "Setting up " + f.name), h("div", { class: "panel" }, cur, logBox, h("div", {}, stopBtn)));
  const log = (msg, replace) => { cur.lastChild.textContent = msg; if (!replace) logBox.append(h("div", { class: "muted" }, "✓ " + msg)); };
  f.busy = true; f.error = null;
  try {
    f.pdf = f.pdf || await PDFX.open(f.file);
    const known = TestInfo.get(f.pdf.fp);
    if (known) f.info = known;
    if (!RUN && tryResume(f)) { f.busy = false; return; }
    if (known && known.v === 2 && Object.keys(known.keys || {}).length) {
      f.info = known; f.ready = true; f.busy = false;
      return go("setup", f);
    }
    let r = await Prep.fromText(f.pdf, log);
    let pages = r.pages;
    if (r.scanned) {
      log("This PDF is a scan, so Claude will read the pages");
      pages = null;
      r = await Prep.fromScan(f.pdf, log, ctl.signal);
      log(`Claude found ${Object.values(r.info.counts).reduce((a, b) => a + b, 0)} questions`);
      if (r.info.keyPages.length) {
        const canv = [];
        for (const pi of r.info.keyPages) canv.push(PDFX.rotate(await PDFX.render(f.pdf, pi, 1500), r.info.rotations[pi] || 0));
        const k = await Prep.keyFromImages(canv, log, ctl.signal);
        r.info.keys = k.keys; r.info.conversion = k.conversion; r.info.conversionEstimated = !k.conversion; r.info.keyFromClaude = true;
        if (k.form) r.info.form = k.form;
        log("Claude read the answer key. You'll check it before starting.");
      }
    }
    const info = r.info;
    if (!info.scanned) {
      try { await Prep.repairText(f.pdf, info, log, ctl.signal); }
      catch (e) { if (e?.code === "cancelled") throw e; log(e?.code === "images_unavailable" ? "Claude can't read page images in this view, so some parts may need fixing by hand" : claudeErr(e)); }
    }
    // English categories.
    if (info.keys?.english && !englishCatsOfficial(info)) {
      try { await Prep.classifyEnglish(f.pdf, info, pages, log, ctl.signal); log("English questions sorted into categories (estimate)"); }
      catch (e) { if (e?.code === "cancelled") throw e; log("Couldn't sort English questions, so the mix is random this time"); }
    }
    info.updated = Date.now();
    TestInfo.set(info.fp, info);
    f.info = info; f.ready = true; f.status = "Ready";
    f.busy = false;
    go("setup", f);
  } catch (e) {
    f.busy = false;
    f.error = e?.code ? claudeErr(e) : (e?.message || "This PDF couldn't be read.");
    if (e?.code === "images_unavailable") f.error = "This PDF is a scan, and scans need Claude to read them. Open this page in Claude while signed in, then try again.";
    cur.replaceChildren(h("span", { style: "color:var(--bad)" }, f.error));
    stopBtn.replaceWith(h("div", { class: "row" }, h("button", { class: "btn", onclick: () => go("prepare", f) }, "Try again"), h("button", { class: "btn ghost", onclick: () => go("tests") }, "Back to tests")));
  }
};

function startRun(f, plan, secs, mode) {

  function sci() {
    const disp = h("div", { class: "disp" });

    const out = h("div", { style: "font-size:1.2rem;font-weight:600" }, MathParse.fmt(ans));
    const histEl = h("div", { class: "small muted" }, hist.slice(-2).map(x => h("div", {}, x)));
    disp.append(histEl, out);
    const run = () => {
      const src = input.value.trim(); if (!src) return;
      try { const v = MathParse.parse(src)({ deg, ans, x: 0 }); ans = v; hist.push(`${src} = ${MathParse.fmt(v)}`); input.value = ""; sci2(); }

    const sci2 = () => { draw(); setTimeout(() => $("#calc-in")?.focus(), 0); };
    input.addEventListener("keydown", e => { if (e.key === "Enter") { e.preventDefault(); run(); } });
    const ins = s => () => { const a = input.selectionStart ?? input.value.length; input.value = input.value.slice(0, a) + s + input.value.slice(input.selectionEnd ?? a); input.focus(); input.selectionStart = input.selectionEnd = a + s.length; };
    const K = (label, act, cls) => h("button", { class: cls || "", onclick: act }, label);
    const keys = h("div", { class: "keys" },
      K("sin", ins("sin(")), K("cos", ins("cos(")), K("tan", ins("tan(")), K("√", ins("sqrt(")), K("x²", ins("^2")), K("^", ins("^"), "op"),
      K("sin⁻¹", ins("asin(")), K("cos⁻¹", ins("acos(")), K("tan⁻¹", ins("atan(")), K("log", ins("log(")), K("ln", ins("ln(")), K("!", ins("!"), "op"),
      K("7", ins("7")), K("8", ins("8")), K("9", ins("9")), K("(", ins("(")), K(")", ins(")")), K("÷", ins("/"), "op"),
      K("4", ins("4")), K("5", ins("5")), K("6", ins("6")), K("π", ins("pi")), K("e", ins("e")), K("×", ins("*"), "op"),
      K("1", ins("1")), K("2", ins("2")), K("3", ins("3")), K("ans", ins("ans")), K("⌫", () => { input.value = input.value.slice(0, -1); input.focus(); }), K("−", ins("-"), "op"),
      K("0", ins("0")), K(".", ins(".")), K(deg ? "DEG" : "RAD", () => { deg = !deg; draw(); }, "op"), K("C", () => { input.value = ""; hist = []; ans = 0; draw(); }), K("=", run, "eq"), K("+", ins("+"), "op"));
    el.append(disp, input, keys);
    setTimeout(() => input.focus(), 0);
  }
  function graph() {
    const colors = ["var(--info)", "var(--bad)", "var(--good)"];
    const inputs = fns.map((f, i) => {
      const inp = h("input", { type: "text", id: "calc-f" + i, value: f, placeholder: i === 0 ? "y = 2x + 1" : "y = ", style: `font-family:var(--f-mono);border-left:4px solid ${colors[i]}` });
      inp.addEventListener("input", () => { fns[i] = inp.value; plot(); });
      return inp;
    });
    const canvas = h("canvas", { "aria-label": "Graph" });
    const coord = h("div", { class: "small muted mono" }, "Tap the graph to read a point");
    const zoomRow = h("div", { class: "row", style: "gap:4px" },
      h("button", { class: "btn sm", onclick: () => zoomBy(0.5) }, "Zoom in"), h("button", { class: "btn sm", onclick: () => zoomBy(2) }, "Zoom out"),
      h("button", { class: "btn sm ghost", onclick: () => { Object.assign(view, { x0: -10, x1: 10, y0: -10, y1: 10 }); plot(); } }, "Reset"),
      h("button", { class: "btn sm ghost", onclick: () => { deg = !deg; draw(); } }, deg ? "DEG" : "RAD"));
    el.append(...inputs, canvas, coord, zoomRow);
    function zoomBy(k) { const cx = (view.x0 + view.x1) / 2, cy = (view.y0 + view.y1) / 2, wx = (view.x1 - view.x0) * k / 2, wy = (view.y1 - view.y0) * k / 2; Object.assign(view, { x0: cx - wx, x1: cx + wx, y0: cy - wy, y1: cy + wy }); plot(); }
    function plot() {
      const W = canvas.clientWidth || 330, H = canvas.clientHeight || 220, dpr = Math.min(2, devicePixelRatio || 1);
      canvas.width = W * dpr; canvas.height = H * dpr;
      const ctx = canvas.getContext("2d"); ctx.scale(dpr, dpr);
      const cs = getComputedStyle(el);
      const px = x => (x - view.x0) / (view.x1 - view.x0) * W, py = y => H - (y - view.y0) / (view.y1 - view.y0) * H;
      ctx.clearRect(0, 0, W, H);
      ctx.strokeStyle = cs.getPropertyValue("--line"); ctx.lineWidth = 1;
      const step = niceStep(view.x1 - view.x0);
      for (let x = Math.ceil(view.x0 / step) * step; x <= view.x1; x += step) { ctx.beginPath(); ctx.moveTo(px(x), 0); ctx.lineTo(px(x), H); ctx.stroke(); }
      const ystep = niceStep(view.y1 - view.y0);
      for (let y = Math.ceil(view.y0 / ystep) * ystep; y <= view.y1; y += ystep) { ctx.beginPath(); ctx.moveTo(0, py(y)); ctx.lineTo(W, py(y)); ctx.stroke(); }
      ctx.strokeStyle = cs.getPropertyValue("--muted"); ctx.lineWidth = 1.2;
      ctx.beginPath(); ctx.moveTo(px(0), 0); ctx.lineTo(px(0), H); ctx.moveTo(0, py(0)); ctx.lineTo(W, py(0)); ctx.stroke();
      ctx.fillStyle = cs.getPropertyValue("--muted"); ctx.font = "10px " + cs.getPropertyValue("--f-mono");
      ctx.fillText(MathParse.fmt(view.x1), W - 28, py(0) - 4); ctx.fillText(MathParse.fmt(view.y1), px(0) + 4, 11);
      const realColors = [cs.getPropertyValue("--info"), cs.getPropertyValue("--bad"), cs.getPropertyValue("--good")];
      fns.forEach((src, i) => {
        src = src.replace(/^\s*y\s*=\s*/i, "").trim(); if (!src) return;
        let f; try { f = MathParse.parse(src); } catch { return; }
        ctx.strokeStyle = realColors[i]; ctx.lineWidth = 2; ctx.beginPath();
        let pen = false;
        for (let sx = 0; sx <= W; sx += 1) {
          const x = view.x0 + sx / W * (view.x1 - view.x0);
          let y; try { y = f({ x, deg, ans }); } catch { y = NaN; }
          if (!isFinite(y) || Math.abs(py(y)) > H * 4) { pen = false; continue; }
          pen ? ctx.lineTo(sx, py(y)) : ctx.moveTo(sx, py(y)); pen = true;
        }
        ctx.stroke();
      });
    }
    canvas.addEventListener("click", e => {
      const r = canvas.getBoundingClientRect();
      const x = view.x0 + (e.clientX - r.left) / r.width * (view.x1 - view.x0);
      const parts = [`x = ${MathParse.fmt(+x.toFixed(3))}`];
      fns.forEach((src, i) => { src = src.replace(/^\s*y\s*=\s*/i, "").trim(); if (!src) return; try { parts.push(`y${i + 1} = ${MathParse.fmt(+MathParse.parse(src)({ x, deg, ans }).toFixed(4))}`); } catch { } });
      coord.textContent = parts.join("   ");
    });
    setTimeout(plot, 0);
  }
  function niceStep(span) { const raw = span / 10; const p = Math.pow(10, Math.floor(Math.log10(raw))); const m = raw / p; return (m < 1.5 ? 1 : m < 3.5 ? 2 : m < 7.5 ? 5 : 10) * p; }
  return { toggle, hide, show };
})();

// ===== Scoring and review =====
const EXPLAIN_CACHE = {};
let LAST_RESULT = null; // {record, misses, run}

function topicList(sec) { return TOPICS.filter(t => t.section === sec).map(t => `${t.id}: ${t.name}`).join("\n"); }

async function questionPayload(run, sec, n, textPagesCache) {
  const out = { text: "", image: null };
  try { if (!run.info.scanned && textPagesCache.pages) out.text = PARSER.questionText(textPagesCache.pages, textPagesCache.found, sec, n).slice(0, 1800); } catch { }
  try { const c = await PDFX.questionImage(run.pdf, run.info, sec, n); if (c) out.image = c; } catch { }
  return out;
}

async function getTextPages(run, cache) {
  if (run.info.scanned || cache.pages) return;
  const pages = await PDFX.textPages(run.pdf);
  cache.pages = pages;
  cache.found = PARSER.analyze(pages, "").found;
}

// Ask Claude which topic each missed question tests. One call per section.
async function tagMisses(run, misses, onStatus, signal) {
  const cache = {};
  await getTextPages(run, cache);
  const lim = await imageLimits();
  for (const sec of SECTIONS) {
    const list = misses.filter(m => m.section === sec);
    if (!list.length) continue;
    onStatus(`Finding the concepts behind your ${SECTION_NAMES[sec]} misses`);
    const parts = [], imgs = [];
    for (const m of list) {
      const p = await questionPayload(run, sec, m.n, cache);
      if (p.text) parts.push(`Question ${m.n} (correct ${m.correct}, student chose ${m.yours || "nothing"}):\n${p.text}`);
      else if (p.image && lim && imgs.length < (lim.maxCount || 5)) { imgs.push(await canvasToBlob(p.image)); parts.push(`Question ${m.n} (correct ${m.correct}, student chose ${m.yours || "nothing"}): see image ${imgs.length}.`); }
      else parts.push(`Question ${m.n} (correct ${m.correct}, student chose ${m.yours || "nothing"}): not readable.`);
    }
    const prompt = `A student missed these ${SECTION_NAMES[sec]} questions on an ACT practice test. For each one, pick the ONE topic it tests from this list, and name the specific rule in a few plain words (like "missing second comma in a pair" or "slope of perpendicular lines").
Base the rule on this rules guide:
<guide>
${GUIDE[sec]}
</guide>
Topics:
${topicList(sec)}

Questions:
${parts.join("\n\n")}

Reply with only JSON: [{"n": 12, "topic": "e-extra", "rule": "missing second comma in a pair"}]`;
    try {
      const res = await askJSON(prompt, { signal, modelTier: "default", images: imgs.length ? imgs : undefined });
      for (const r of Array.isArray(res) ? res : []) {
        const m = list.find(x => x.n === Number(r.n));
        if (m && TOPIC_BY_ID[r.topic] && TOPIC_BY_ID[r.topic].section === sec) { m.topic = r.topic; m.rule = String(r.rule || "").slice(0, 80); }
      }
    } catch (e) { if (e?.code === "cancelled") throw e; onStatus(claudeErr(e)); }
  }
  return cache;
}

routes.score = async main => {
  if (!RUN) return go("home");
  window.__leaveGuard = null;
  const info = RUN.info;
  const sections = {};
  const misses = [];
  for (const sec of SECTIONS) {
    const d = RUN.done[sec]; if (!d) continue;
    const key = info.keys[sec].answers;
    let raw = 0;
    for (const n of d.qs) {
      const ok = d.answers[n] && d.answers[n] === key[n];
      if (ok) raw++;
      else misses.push({ id: uid(), section: sec, n, yours: d.answers[n] || null, correct: key[n], topic: null, rule: "", flagged: !!d.flags[n] });
    }
    sections[sec] = { raw, outOf: d.qs.length, scale: scaleScore(info, sec, raw, d.qs.length), timeUsed: d.timeUsed };
  }
  const core = ["english", "math", "reading"];
  const composite = core.every(s => sections[s]) ? Math.round(core.reduce((a, s) => a + sections[s].scale, 0) / 3) : null;
  let record = Store.get("tests").list.find(t => t.id === RUN.id);
  if (!record) {
    record = { id: RUN.id, form: RUN.form, date: Date.now(), sections, composite, complete: RUN.include.every(s => RUN.done[s]), estimate: !!info.conversionEstimated };
    Store.get("tests").list.push(record);
    Store.save("tests");
  }
  LAST_RESULT = { record, misses, run: RUN };
  try { localStorage.removeItem("bsp:run"); } catch { }

  // Header
  main.append(h("div", { class: "hero" },
    h("div", { class: "label" }, (RUN.form ? "Form " + RUN.form + " · " : "") + fmtDate(record.date)),
    h("h1", {}, composite != null ? `Composite ${composite}` : "Your section scores"),
    h("p", {}, (composite == null ? "Composite needs English, Math and Reading. " : "Composite is English, Math and Reading averaged. Science is reported on its own. ") +
      "Scores use this booklet's table scaled to the shorter enhanced length, so treat them as estimates.")));
  main.append(h("div", { class: "grid3" }, Object.entries(sections).map(([s, r]) => h("div", { class: "panel" },
    h("span", { class: "label" }, SECTION_NAMES[s]),
    h("div", { class: "stat" }, h("b", {}, r.scale), h("span", { class: "muted small num" }, `${r.raw} of ${r.outOf} right · ${fmtTime(r.timeUsed)} used`)),
    h("div", { class: "bar" }, h("i", { style: `width:${Math.round(100 * r.raw / r.outOf)}%` }))))));

  const conceptsPanel = h("div", { class: "panel" }, h("h2", {}, "Concepts you missed"), h("div", { class: "row muted" }, h("span", { class: "spinner" }), h("span", { id: "tagstatus" }, "Getting ready")));
  main.append(conceptsPanel);
  const reviewPanel = h("div", { class: "panel" });
  main.append(reviewPanel);

  const blanks = misses.filter(m => !m.yours);
  const wrong = misses.filter(m => m.yours);
  if (!wrong.length && blanks.length) { conceptsPanel.replaceChildren(h("h2", {}, "Concepts you missed"), h("p", {}, `You left ${blanks.length} blank and got none wrong that you answered. Blanks aren't added to your mistake log.`)); drawReview(reviewPanel, misses, {}); return; }
  if (!misses.length) { conceptsPanel.replaceChildren(h("h2", {}, "No misses"), h("p", {}, "Every question right. Try a harder test or a weak spots quiz.")); return; }

  let cache = {};
  const status = $("#tagstatus", conceptsPanel);
  try { cache = await tagMisses(RUN, wrong, s => status.textContent = s, new AbortController().signal); }
  catch (e) { status.textContent = claudeErr(e); }
  // Save to the mistake log (rule tags and answers only, no question text).
  const log = Store.get("misses");
  if (!log.list.some(m => m.testId === record.id)) {
    for (const m of wrong) log.list.push({ id: m.id, testId: record.id, form: RUN.form, date: record.date, section: m.section, n: m.n, topic: m.topic, rule: m.rule, yours: m.yours, correct: m.correct, source: "test" });
    if (log.list.length > 1500) log.list = log.list.slice(-1500);
    Store.save("misses");
  }
  drawConcepts(conceptsPanel, wrong);
  if (blanks.length) conceptsPanel.append(h("p", { class: "muted small" }, `${blanks.length} question${blanks.length > 1 ? "s were" : " was"} left blank. Blanks aren't added to your mistake log. There's no penalty for guessing, so fill in every bubble next time.`));
  drawReview(reviewPanel, misses, cache);
};

function drawConcepts(panel, misses) {
  const groups = {};
  for (const m of misses) (groups[m.topic || "untagged"] ||= []).push(m);
  const rows = Object.entries(groups).sort((a, b) => b[1].length - a[1].length);
  panel.replaceChildren(h("h2", {}, "Concepts you missed"),
    h("div", { class: "list" }, rows.map(([t, ms]) => h("div", { class: "spread" },
      h("div", { style: "min-width:0" },
        h("strong", {}, TOPIC_BY_ID[t]?.name || "Not tagged yet"),
        h("div", { class: "muted small" }, [...new Set(ms.map(m => m.rule).filter(Boolean))].slice(0, 3).join(" · "))),
      h("div", { class: "row" },
        h("span", { class: "chip bad num" }, `${ms.length} missed`),
        TOPIC_BY_ID[t] ? h("button", { class: "btn sm", onclick: () => go("quiz", { section: TOPIC_BY_ID[t].section, topic: t }) }, "Practice") : null)))));
}

function drawReview(panel, misses, cache) {
  panel.replaceChildren(h("h2", {}, "Review each miss"), h("p", { class: "muted small" }, "Open a question to see why the right answer works and why each wrong choice fails."));
  for (const sec of SECTIONS) {
    const list = misses.filter(m => m.section === sec).sort((a, b) => (!a.yours) - (!b.yours) || a.n - b.n);
    if (!list.length) continue;
    const nb = list.filter(m => !m.yours).length;
    panel.append(h("h3", {}, `${SECTION_NAMES[sec]} · ${list.length - nb} wrong${nb ? `, ${nb} blank` : ""}`));
    for (const m of list) {
      const det = h("details", { class: "miss" });
      const sum = h("summary", { style: "cursor:pointer" },
        h("span", { class: "mono" }, `#${m.n}`), " ",
        h("span", {}, `You: ${m.yours || "blank"} · Right: ${m.correct}`), " ",
        m.topic ? h("span", { class: "chip" }, TOPIC_BY_ID[m.topic].name) : null);
      const body = h("div", { class: "stack", style: "margin-top:10px" });
      det.append(sum, body);
      det.addEventListener("toggle", () => { if (det.open && !body.childElementCount) openMiss(body, m, cache); });
      panel.append(det);
    }
  }
}

async function openMiss(body, m, cache) {
  const run = LAST_RESULT?.run;
  if (!run?.pdf) { body.append(h("p", { class: "muted" }, "Add the test PDF again to see this question.")); return; }
  const p = await questionPayload(run, m.section, m.n, cache);
  if (p.image) { const img = h("img", { class: "crop", alt: `Question ${m.n} from the test page` }); img.src = p.image.toDataURL("image/jpeg", 0.85); body.append(img); }
  const out = h("div", { class: "explain" });
  body.append(out);
  renderExplanation(out, m, p, run);
}

async function renderExplanation(out, m, p, run) {
  const key = `${run.fp}:${m.section}:${m.n}:${m.yours}`;
  out.replaceChildren(h("div", { class: "row muted" }, h("span", { class: "spinner" }), "Claude is writing the explanation"));
  try {
    let ex = EXPLAIN_CACHE[key];
    if (!ex) {
      const lim = await imageLimits();
      const imgs = p.image && lim ? [await canvasToBlob(p.image)] : undefined;
      const eng = m.section === "english";
      const prompt = `You are tutoring a high school student on an ACT practice question they missed. Explain it in plain words and short sentences. Do not use dashes of any kind.
Every rule you cite must come from this rules guide. Do not add rules that aren't in it. Give the real reason, not a shortcut.
<guide>
${GUIDE[m.section]}
</guide>
Question ${m.n} (${SECTION_NAMES[m.section]}). The correct answer is ${m.correct}. The student chose ${m.yours || "nothing"}.
${p.text ? "Text of the question:\n" + p.text : "The question is in the image."}
${eng ? `For the right answer, go through EVERY punctuation mark in it and say why it is there (for example, why there's a comma after an intro phrase), and say why no other mark is needed.` : ""}
Then say why each wrong choice fails, one or two sentences each.
Reply with only JSON:
{"topic": "one id from: ${TOPICS.filter(t => t.section === m.section).map(t => t.id).join(", ")}",
 "rule": "the rule in a few words",
 "right": "why ${m.correct} works, 2 to 4 sentences",
 "marks": ${eng ? '[{"mark": ",", "why": "..."}]' : "[]"},
 "wrong": [{"letter": "B", "why": "..."}],
 "tip": "one sentence to remember next time"}`;
      ex = await askJSON(prompt, { images: imgs, modelTier: "default" });
      EXPLAIN_CACHE[key] = ex;
      if (!m.topic && TOPIC_BY_ID[ex?.topic]?.section === m.section && m.yours) {
        m.topic = ex.topic; m.rule = String(ex.rule || "").slice(0, 80);
        const row = Store.get("misses").list.find(x => x.id === m.id);
        if (row) { row.topic = m.topic; row.rule = m.rule; Store.save("misses"); }
      }
    }
    out.replaceChildren(explanationView(ex, m.correct, m.yours));
    out.append(offButton(() => ({ kind: "test", form: run.form, section: m.section, n: m.n, correct: m.correct, explanation: ex })));
  } catch (e) {
    out.replaceChildren(h("p", { class: "muted" }, claudeErr(e)), h("button", { class: "btn sm", onclick: () => renderExplanation(out, m, p, run) }, "Try again"));
  }
}

function explanationView(ex, correct, yours) {
  const wrap = h("div", { class: "stack" });
  if (ex.rule) wrap.append(h("div", { class: "row" }, h("span", { class: "label" }, "Rule"), h("span", {}, ex.rule)));
  wrap.append(h("p", {}, h("strong", {}, `Why ${correct} is right. `), ex.right || ""));
  if (Array.isArray(ex.marks) && ex.marks.length) wrap.append(h("div", { class: "stack small" }, h("span", { class: "label" }, "Every mark in the answer"),
    ex.marks.map(k => h("div", { class: "why" }, h("b", { class: "mono" }, k.mark || ""), h("span", {}, k.why || "")))));
  if (Array.isArray(ex.wrong) && ex.wrong.length) wrap.append(h("div", { class: "stack small" }, h("span", { class: "label" }, "Why the others fail"),
    ex.wrong.map(w => h("div", { class: "why" }, h("b", { class: "mono", style: w.letter === yours ? "color:var(--bad)" : "" }, w.letter || ""), h("span", {}, w.why || "")))));
  if (ex.tip) wrap.append(h("p", { class: "small" }, h("strong", {}, "Next time: "), ex.tip));
  return wrap;
}

function offButton(getReport) {

function reportOff(rep) {

      box.replaceChildren(h("h2", {}, "Send this to the site owner"), h("p", { class: "small" }, "Reports from visitors can't be saved here yet. Copy this and send it to whoever shared the page with you."), ta,
        h("div", { class: "row" }, h("button", { class: "btn primary", onclick: () => copyText(text, ta) }, "Copy report"), h("button", { class: "btn", onclick: close }, "Done")));
    });
    box.append(h("div", { class: "row" }, send, h("button", { class: "btn", onclick: close }, "Cancel")));

function topicCounts(list) {
  const c = {};
  for (const m of list) if (m.topic) c[m.topic] = (c[m.topic] || 0) + 1;
  return c;

function weakTopics(section, k = 5) {

const Bank = {
  shared: {}, loaded: {}, source: {},
  async load(sec) {
    if (this.loaded[sec]) return;
    let list = null;
    if (Store.db) {
      try {
        const snap = await Store.db.collection("qbank").where("section", "==", sec).limit(1000).get();
        if (!snap.empty) list = snap.docs.map(d => ({ ...d.data(), id: d.id }));
      } catch { }
    }
    // Built-in checked questions, plus anything added to the shared bank. Shared copies win by id.
    const seed = (window.SEED_BANK || []).filter(q => q.section === sec);
    const extra = list || [];
    const ids = new Set(extra.map(q => q.id));
    this.source[sec] = extra.length ? "shared" : "built in";
    this.shared[sec] = seed.filter(q => !ids.has(q.id)).concat(extra);
    this.loaded[sec] = true;
  },
  all(sec) {
    const local = (Store.get("quiz").localBank || []).filter(q => q.section === sec);
    const ids = new Set((this.shared[sec] || []).map(q => q.id));
    return (this.shared[sec] || []).concat(local.filter(q => !ids.has(q.id)));
  },
  count(sec, topic) { return this.all(sec).filter(q => !topic || q.topic === topic).length; },
};

function seenSet(topic) { const s = Store.get("quiz").seen; return new Set(s[topic] || []); }
function markSeen(q) { const s = Store.get("quiz").seen; (s[q.topic] ||= []); if (!s[q.topic].includes(q.id)) s[q.topic].push(q.id); }

// Draw questions with no repeats until each topic's bank is used up.
function drawQuestions(pool, n) {
  const byTopic = {};
  for (const q of pool) (byTopic[q.topic] ||= []).push(q);
  const picked = [];
  const exhausted = [];
  for (const [t, qs] of Object.entries(byTopic)) {
    const seen = seenSet(t);
    if (qs.every(q => seen.has(q.id))) exhausted.push(t);
  }
  // A topic whose bank is used up starts a new round.
  const seenAll = Store.get("quiz").seen;
  for (const t of exhausted) seenAll[t] = [];
  const fresh = shuffle(pool.filter(q => !seenSet(q.topic).has(q.id)));
  for (const q of fresh) { if (picked.length >= n) break; picked.push(q); }
  if (picked.length < n) for (const q of shuffle(pool)) { if (picked.length >= n) break; if (!picked.includes(q)) picked.push(q); }
  return { picked, exhausted };
}

function runQuiz(body, cfg) {

  if (exhausted.length && cfg.topic) toast("You've seen every question in this topic, so some repeat. Generate more to get new ones.", 4000);
  const qs = picked;
  const secOf = q => q.section;
  const totalSec = qs.reduce((a, q) => a + PACE[secOf(q)], 0) * multiplier();
  const deadline = Date.now() + totalSec * 1000;
  const answers = {};
  let i = 0, finished = false;
  const timer = h("span", { class: "timer" });
  const iv = setInterval(() => {
    if (!document.body.contains(timer)) { clearInterval(iv); return; }
    const left = (deadline - Date.now()) / 1000;
    timer.textContent = fmtTime(left); timer.classList.toggle("low", left <= 30);
    if (left <= 0 && !finished) { clearInterval(iv); toast("Time's up"); end(); }
  }, 400);
  timer.textContent = fmtTime(totalSec);

  body.replaceChildren(h("div", { class: "spread" }, h("div", {}, h("div", { class: "label" }, "Quiz"), h("h2", {}, cfg.title)), timer), card);

  function show() {
    const q = qs[i];

      h("div", { class: "spread" }, h("span", { class: "label" }, `Question ${i + 1} of ${qs.length}`), h("span", { class: "chip" }, TOPIC_BY_ID[q.topic]?.name || "")),

      if (answers[q.id] === k) b.classList.add("sel");
      if (locked) { if (k === q.answer) b.classList.add("right"); else if (answers[q.id] === k) b.classList.add("wrong"); b.disabled = true; }
      b.addEventListener("click", () => { answers[q.id] = k; show(); });
      opts.append(b);
    });
    card.append(opts);

    if (i < qs.length - 1) nav.append(h("button", { class: "btn primary", disabled: cfg.feedback === "each" && answers[q.id] == null, onclick: () => { i++; show(); } }, "Next"));

      if (ok) right++;
      const st = (quiz.stats[q.topic] ||= { seen: 0, right: 0 }); st.seen++; if (ok) st.right++;
      if (!ok) log.list.push({ id: uid(), source: "quiz", qid: q.id, date: Date.now(), section: q.section, topic: q.topic, rule: q.rule || "", yours: answers[q.id] != null ? "ABCD"[answers[q.id]] : null, correct: "ABCD"[q.answer] });
    }
    if (log.list.length > 1500) log.list = log.list.slice(-1500);
    quiz.history.push({ date: Date.now(), title: cfg.title, right, total: qs.length });
    if (quiz.history.length > 200) quiz.history = quiz.history.slice(-200);
    Store.save("quiz"); Store.save("misses");
    const usedSec = Math.round(totalSec - Math.max(0, (deadline - Date.now()) / 1000));
    body.replaceChildren(
      h("div", { class: "panel" }, h("div", { class: "label" }, cfg.title), h("div", { class: "stat" }, h("b", {}, `${right} / ${qs.length}`), h("span", { class: "muted small" }, `${fmtTime(usedSec)} used of ${fmtTime(totalSec)}`)),
        h("div", { class: "row" }, h("button", { class: "btn primary", onclick: () => cfg.sec ? setup(body, cfg.sec, cfg.topic) : weakSetup(body) }, "Another quiz"), h("button", { class: "btn", onclick: () => go("log") }, "Mistake log"))),
      h("div", { class: "panel" }, h("h2", {}, "Review"), qs.map((q, k) => {
        const ok = answers[q.id] === q.answer;
        const det = h("details", { open: !ok && cfg.feedback === "end" ? true : undefined },
          h("summary", { style: "cursor:pointer" }, h("span", { class: "chip " + (ok ? "good" : "bad") }, ok ? "Right" : "Missed"), " ", `Question ${k + 1}: `, TOPIC_BY_ID[q.topic]?.name || ""),
          h("div", { class: "stack", style: "margin-top:10px" },
            q.passage ? h("div", { class: "qpassage", html: richText(q.passage) }) : null, tableView(q.table),
            h("div", { class: "qstem", html: richText(q.stem) }),
            h("div", { class: "stack small" }, q.choices.map((c, j) => h("div", { class: "why" }, h("b", { class: "mono", style: j === q.answer ? "color:var(--good)" : j === answers[q.id] ? "color:var(--bad)" : "" }, "ABCD"[j]), h("span", { html: richText(c) })))),
            quizExplain(q, answers[q.id])));
        return det;
      })));
  }
  show();
}

function quizExplain(q, chosen) {
  const ok = chosen === q.answer;
  const ex = q.explanation || {};
  const box = h("div", { class: "explain" },
    h("p", {}, h("strong", { style: `color:var(${ok ? "--good" : "--bad"})` }, chosen == null ? "No answer. " : ok ? "Right. " : "Not quite. "), `The answer is ${"ABCD"[q.answer]}.`),
    q.rule ? h("div", { class: "row small" }, h("span", { class: "label" }, "Rule"), h("span", {}, q.rule)) : null,
    ex.right ? h("p", {}, ex.right) : null);
  if (Array.isArray(ex.marks) && ex.marks.length) box.append(h("div", { class: "stack small" }, h("span", { class: "label" }, "Every mark in the answer"), ex.marks.map(m => h("div", { class: "why" }, h("b", { class: "mono" }, m.mark), h("span", {}, m.why)))));
  if (Array.isArray(ex.wrong)) box.append(h("div", { class: "stack small" }, h("span", { class: "label" }, "Why the others fail"),
    ex.wrong.map((w, j) => j === q.answer || !w ? null : h("div", { class: "why" }, h("b", { class: "mono", style: j === chosen ? "color:var(--bad)" : "" }, "ABCD"[j]), h("span", {}, w)))));
  if (q.checked === false || q.by === "claude") box.append(h("p", { class: "muted small" }, "Written by Claude and checked by a second Claude pass."));
  box.append(offButton(() => ({ kind: "quiz", qid: q.id, section: q.section, correct: "ABCD"[q.answer], explanation: { stem: q.stem, choices: q.choices, ...ex } })));
  return box;
}

// Claude writes 10 questions, then a separate call answers them blind. Only matching answers are kept.
async function generateQuestions(sec, topic) {
  await Bank.load(sec);
  const t = TOPIC_BY_ID[topic];
  const existing = Bank.all(sec).filter(q => q.topic === topic).slice(-25).map(q => "- " + q.stem.slice(0, 120)).join("\n");
  const shape = sec === "english"
    ? `"stem": a sentence or two with the tested part wrapped in __double underscores__, "choices": 4 versions of the underlined part (first is "NO CHANGE" when it fits)`
    : sec === "math" ? `"stem": the problem in plain text using unicode math (x², √, π, ≤), "choices": 4 answers`
    : sec === "reading" ? `"passage": 3 to 6 sentences of original text, "stem": the question, "choices": 4 answers`
    : `"passage": 1 to 3 sentences describing a study, "table": {"headers": [...], "rows": [[...]]} with a small made up data table, "stem": the question, "choices": 4 answers`;
  const prompt = `Write 10 new ACT style practice questions for the topic "${t.name}" (${SECTION_NAMES[sec]}).
Use ONLY rules from this guide. Each question tests one rule from it. Write original content. Plain words, short sentences, no dashes of any kind in explanations.
<guide>
${GUIDE[sec]}
</guide>
Avoid repeating these existing questions:
${existing || "(none)"}
Each question is standalone. Exactly one choice is correct. Vary which letter is correct.
Reply with only a JSON array of 10 objects:
{${shape}, "answer": index 0 to 3 of the correct choice, "rule": "the rule in a few words",
 "explanation": {"right": "why the answer works, 2 to 3 sentences"${sec === "english" ? `, "marks": [{"mark": ",", "why": "why this punctuation mark is there"}] for every punctuation mark in the correct choice` : ""}, "wrong": [4 strings, one per choice, why it fails; "" for the correct one]}}`;
  const made = await askJSON(prompt, { modelTier: "complex", cache: false });
  const valid = (Array.isArray(made) ? made : []).filter(q => q && q.stem && Array.isArray(q.choices) && q.choices.length === 4 && q.answer >= 0 && q.answer <= 3);
  if (!valid.length) throw { code: "invalid_json" };
  // Blind check.
  const check = await askJSON(`Answer each ACT practice question. Reply with only a JSON array of the index (0 to 3) of the correct choice, in order.\n\n` +
    valid.map((q, k) => `Q${k + 1}. ${q.passage ? q.passage + "\n" : ""}${q.table ? JSON.stringify(q.table) + "\n" : ""}${q.stem}\n${q.choices.map((c, j) => `${j}) ${c}`).join("\n")}`).join("\n\n"), { modelTier: "default", cache: false });
  const kept = valid.filter((q, k) => Array.isArray(check) && Number(check[k]) === Number(q.answer)).map(q => ({
    id: "g-" + uid(), section: sec, topic, stem: String(q.stem), passage: q.passage ? String(q.passage) : undefined, table: q.table || undefined,
    choices: q.choices.map(String), answer: Number(q.answer), rule: String(q.rule || "").slice(0, 90), explanation: q.explanation || {}, checked: false, by: "claude", created: Date.now(),
  }));
  if (Store.isOwner && Store.db) {
    for (const q of kept) { try { const { id, ...doc } = q; await Store.db.doc("qbank/" + id).set(JSON.parse(JSON.stringify(doc))); } catch { } }
    Bank.loaded[sec] = false; await Bank.load(sec);
  } else {
    const quiz = Store.get("quiz");
    quiz.localBank = (quiz.localBank || []).concat(kept).slice(-300);
    Store.save("quiz");
  }
  return kept.length;
}

// ===== Onboarding and settings =====
function profileForm(p, onSave, isFirst) {
  const f = h("form", { class: "stack", style: "gap:22px" });
  const secBox = h("div", { class: "choices" }, SECTIONS.map(s =>
    h("label", { class: "choice" }, h("input", { type: "checkbox", name: "study", value: s, checked: (p.study || ["english", "math", "reading"]).includes(s) }), SECTION_NAMES[s])));
  const num = (name, val, min, max, ph) => h("input", { type: "number", id: "f-" + name, name, min, max, step: 1, value: val ?? "", placeholder: ph || "" });
  const cur = p.current || {};
  const curGrid = h("div", { class: "scoregrid" },
    ...["english", "math", "reading", "science"].map(s => h("label", { class: "field" }, h("span", {}, SECTION_NAMES[s]), num("cur-" + s, cur[s], 1, 36, "1 to 36"))),
    h("label", { class: "field" }, h("span", {}, "Composite"), num("cur-composite", cur.composite, 1, 36, "1 to 36")));
  const radio = (name, opts, val) => h("div", { class: "choices" }, opts.map(([v, label]) =>
    h("label", { class: "choice" }, h("input", { type: "radio", name, value: v, checked: String(val) === String(v) }), label)));

  f.append(
    h("div", { class: "field" }, h("span", {}, "Which sections do you want to study?"), secBox),
    h("div", { class: "field" }, h("span", {}, "Your current ACT scores"), h("p", { class: "muted small" }, "Leave blank if you haven't taken it yet."), curGrid),
    h("div", { class: "grid2" },
      h("label", { class: "field" }, h("span", {}, "Target composite"), num("target", p.target, 1, 36, "for example 30")),
      h("label", { class: "field" }, h("span", {}, "Test date"), h("input", { type: "date", id: "f-date", name: "date", value: p.date || "" }))),
    h("div", { class: "field" }, h("span", {}, "Time accommodations"), h("p", { class: "muted small" }, "This changes every timer on the site."),
      radio("accom", [["1", "Standard time"], ["1.5", "1.5x time"], ["2", "2x time"]], p.accom || "1")),
    h("div", { class: "field" }, h("span", {}, "Do you plan to take Science?"), h("p", { class: "muted small" }, "Science is optional on the enhanced ACT and isn't part of the composite."),
      radio("science", [["yes", "Yes"], ["no", "No"], ["unsure", "Not sure yet"]], p.science || "unsure")),
    h("div", { class: "row" }, h("button", { class: "btn primary", type: "submit" }, isFirst ? "Start practicing" : "Save settings")),
  );
  f.addEventListener("submit", e => {
    e.preventDefault();
    const fd = new FormData(f);
    const n = k => { const v = fd.get(k); return v === "" || v == null ? null : clamp(Math.round(Number(v)), 1, 36); };
    const study = fd.getAll("study");
    if (!study.length) { toast("Pick at least one section."); return; }
    onSave({
      ...p, onboarded: true, study,
      current: { english: n("cur-english"), math: n("cur-math"), reading: n("cur-reading"), science: n("cur-science"), composite: n("cur-composite") },
      target: n("target"), date: fd.get("date") || null, accom: fd.get("accom") || "1", science: fd.get("science") || "unsure",
    });
  });
  return f;
}

routes.onboarding = main => {
  $("#topbar").hidden = true;

      h("div", { class: "row" }, h("span", { class: "brand-mark", "aria-hidden": "true" }), h("span", { class: "label" }, "Bubble Sheet · for ACT practice")),

};

routes.settings = main => {
  main.append(
    h("h1", {}, "Settings"),

        ? "Open the link below on another phone or computer and your scores, mistakes and quizzes will show up there too. Keep it private: anyone with the link can see your progress."
        : "Cloud saving is not set up on this site, so progress stays in this browser."),

        h("button", { class: "btn sm", onclick: async e => { try { await navigator.clipboard.writeText(window.BSP.syncLink()); toast("Link copied"); } catch { toast("Select the link and copy it"); } } }, "Copy link")) : null,
      window.BSP && window.BSP.ownerMode() ? h("p", { class: "small" }, h("span", { class: "chip star" }, "Owner mode"), " ",
        h("button", { class: "btn sm ghost", onclick: () => { window.BSP.leaveOwnerMode(); toast("Owner mode off"); go("settings"); } }, "Turn off")) : null),
    h("div", { class: "panel" },
      h("h2", {}, "Start over"),
      h("p", { class: "muted" }, "This erases your scores, mistake log and quiz history."),
      h("div", {}, h("button", { class: "btn danger", onclick: async () => {
        if (!(await confirmBox("Erase all your progress? This can't be undone.", "Erase everything"))) return;
        for (const n of DOCS) { Store.data[n] = structuredClone(EMPTY[n]); await Store.save(n); }
        toast("Progress erased"); go("onboarding");
      } }, "Erase my progress"))),
  );
};

// ===== Boot =====
(function boot() {
  const nav = $("#nav");
  const items = [["home", "Home"], ["tests", "Tests"], ["quiz", "Quizzes"], ["log", "Mistake log"], ["progress", "Scores"], ["settings", "Settings"]];
  for (const [r, label] of items) nav.append(h("button", { "data-route": r, onclick: () => go(r) }, label));
  const who = $("#who");
  const setWho = () => { who.textContent = Store.mode === "cloud" ? "Saving to the cloud" : "Saving in this browser"; };
  Store.initLocal();
  setWho();
  go(P().onboarded ? "home" : "onboarding");
  Store.initCloud().then(() => {
    setWho();
    if (["home", "onboarding", "log", "progress", "settings"].includes(currentRoute)) go(P().onboarded ? (currentRoute === "onboarding" ? "home" : currentRoute) : "onboarding");
  });
})();
